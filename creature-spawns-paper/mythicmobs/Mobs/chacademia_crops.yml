# 살아나는 작물 몹 (2026-10-20)
# 소환: ChAcademiaWildlife 플러그인 crop-awakening (다 자란 작물 수확 시 5%) / 테스트: /테스트 몹 작물몹 <작물> [변색종]
# 모델: ModelEngine blueprint crop_<작물>.bbmodel, crop_<작물>_shiny.bbmodel (애니: spawn idle walk attack death)
# 보상(Drops)은 나중에 정함. 지금은 아무것도 안 떨어짐.
"CA_Crop_wheat":
  "Type": "HUSK"
  "Display": "§f살아난 밀"
  "Health": 6
  "Damage": 0
  "Options":
    "PreventOtherDrops": true
    "PreventRandomEquipment": true
    "PreventSunburn": true
    "PreventTransformation": true
    "PreventItemPickup": true
    "PreventRenaming": true
    "Silent": true
    "FollowRange": 16
    "MovementSpeed": 0.3
    "AlwaysShowName": false
    "Despawn": true
  "Drops": []
  "Skills":
    - "model{mid=crop_wheat;n=false;drive=true} @self ~onSpawn"
    - "addtag{t=chacademia_custom} @self ~onSpawn"
    - "addtag{t=chacademia_crop} @self ~onSpawn"
    - "skill{s=CA_Crop_Awaken} @self ~onSpawn"
    - "skill{s=CA_Crop_Hurt} @self ~onDamaged"
  "AIGoalSelectors":
    - "clear"
    - "float"
    - "fleeplayers"
    - "randomstroll"
    - "randomlookaround"
  "AITargetSelectors":
    - "clear"

