# books.yml 에 추가할 책 (2026-10-29, 스토리 2장 2-15). 학교 서버 plugins/MagicCodexBridge/books.yml 의 books: 아래에 그대로 붙인다.
# 대도서관 서가에 연결: 책장 블록을 보고 /컨텐츠관리 책 연결 record_monsters_100y  →  /서버관리 새로고침 책
# 끝까지 읽고 닫으면 스토리 신호 "몬스터기록" (한 사람당 평생 1번).
books:
  record_monsters_100y:
    title: "100년 전 몬스터에 관한 기록"
    required-intelligence: 0
    pages:
      - left: |
          이 기록은 차카데미아 대도서관이
          옛 순찰대의 일지를 모아 엮은 것이다.

          글씨가 바랜 곳은 그대로 두었다.
        right: |
          그 시절 숲과 들의 짐승, 그리고
          우리가 몬스터라 부르는 것들은
          먼저 사람을 해치지 않았다.

          사람이 다가가면 피했고,
          사람이 떠나면 돌아왔다.
      - left: |
          순찰대 일지 中

          "늑대 무리가 마을 우물가까지 내려왔다.
          아이들이 물을 길을 때까지 기다렸다가
          조용히 숲으로 돌아갔다."
        right: |
          "고블린들이 버린 그릇을 주워 갔다.
          대신 잘 익은 열매를 두고 갔다.
          누가 먼저 시작한 일인지 아무도 모른다."

          사람과 몬스터는 서로의 영역을 지키며
          평화롭게 함께 살아가고 있었다.
      - left: |
          그러나 잿빛 밤 이후,
          모든 것이 달라졌다.

          짐승들의 눈빛이 흐려지고,
          울음소리가 거칠어졌다.
        right: |
          몬스터들은 난폭해졌고,
          그때부터 사람을 먼저 공격하기 시작했다.

          순찰대 일지는 그날 이후로
          부상자 명단으로 가득하다.
      - left: |
          기록의 마지막 장.

          "난폭해진 그들을 죽이지 않고
          본래의 마음으로 돌려놓는 마법이 만들어졌다.
          그것을 교화라 부른다."
        right: |
          "교화를 처음 만든 이는
          전설의 대마법사 ■■■ 님이다."

          (이름이 적힌 자리는 물에 젖은 듯
          번져 있어 읽을 수 없다.)
    commands:
      - "유저관리 {player} 스토리신호 몬스터기록"
