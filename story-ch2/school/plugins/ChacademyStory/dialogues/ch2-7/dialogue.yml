      - {who: elena, face: "기본", text: "어서 오렴! 하르바 교수님이 보내셨구나."}
      - {who: elena, face: "기본", text: "오늘은 원소 반응을 알려 줄게. 마법을 맞은 적에게는 그 원소의 표식이 남아."}
