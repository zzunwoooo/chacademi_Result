      - {who: elena, face: "기본", text: "물과 불이 만나면 증기가, 불과 바람이 만나면 불길이 번지는 것처럼 말이야."}
      - {who: me, face: "", text: "원소를 섞어서 쓰라는 거군요."}
      - {who: elena, face: "기본", text: "맞아. 한 원소만 쓰는 마법사보다 훨씬 강해질 수 있어. 원소 반응을 30번 일으켜 보고 오렴!"}
