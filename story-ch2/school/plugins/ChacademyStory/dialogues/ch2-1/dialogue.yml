# 차카데미 대화 — Claude 작성 2026-10-29 (오너 2장 기획)
format: 1
id: "ch2-1"
title: "2-1. 세드릭의 큐디치 수업"
description: "세드릭 교수에게 큐디치를 배워요."
chapter: "2장 · 차카데미아"
start: a
dim: 0.35
type_speed: 0.03
