<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모션 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single stage (canvas) with a tick timeline underneath, specs in a side column that stacks on phones */
:root{
  --bg:#f3f1f7; --panel:#ffffff; --ink:#1d1a29; --muted:#6a6480; --line:#ddd8e8;
  --accent:#6b3fd6; --spark:#c98a12; --stage:#e9e5f2; --grid:#cfc8e0;
  --f-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121c; --panel:#1d1a28; --ink:#ece8f6; --muted:#a29bb8; --line:#2f2a40;
  --accent:#a888ff; --spark:#f0c05a; --stage:#1a1725; --grid:#2c2740; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121c; --panel:#1d1a28; --ink:#ece8f6; --muted:#a29bb8; --line:#2f2a40;
  --accent:#a888ff; --spark:#f0c05a; --stage:#1a1725; --grid:#2c2740; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:24px 40px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px}
header h1{font-family:var(--f-display);font-size:clamp(26px,4vw,34px);margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.hint{position:absolute;right:12px;top:10px;font-size:12px;color:var(--muted)}
.phase{position:absolute;left:14px;top:10px;font-family:var(--f-display);font-size:20px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
button,select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.spacer{flex:1}
.timeline{padding:4px 14px 14px;background:var(--panel)}
.tl-row{position:relative;height:26px;margin-top:6px}
.seg{position:absolute;top:0;height:100%;border-radius:4px;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink);white-space:nowrap;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.seg.hot{background:color-mix(in srgb,var(--accent) 22%,var(--bg));border-color:var(--accent)}
.cast-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--spark)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tick{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px;min-width:0}
aside h2{font-family:var(--f-display);font-size:18px;margin:0}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
dt{color:var(--muted)}
dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.axes{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.axes li{margin:2px 0}
code{font-family:var(--f-mono);font-size:12.5px}
@media (prefers-reduced-motion: reduce){.seg{transition:none}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1><span id="title">모션</span> <span class="tick" id="mname"></span></h1>
    <p id="desc"></p>
  </header>
  <div class="main">
    <div class="stage">
      <div class="phase" id="phase"></div>
      <div class="hint">드래그해서 회전</div>
      <canvas id="cv" width="960" height="720" aria-label="플레이어 모션 미리보기"></canvas>
      <div class="controls">
        <button class="primary" id="play">일시정지</button>
        <button id="replay">처음부터</button>
        <select id="speed" aria-label="재생 속도">
          <option value="1">1배속</option><option value="0.5">0.5배속</option><option value="0.25">0.25배속</option>
        </select>
        <span class="spacer"></span>
        <button data-view="35">3/4</button><button data-view="0">정면</button><button data-view="90">측면</button><button data-view="180">뒤</button>
      </div>
      <div class="timeline">
        <div class="tl-row" id="tl"></div>
        <input type="range" id="scrub" min="0" max="40" step="0.05" value="0" aria-label="틱 이동">
        <div class="tick" id="tickLabel">0.0틱 · 0.00초</div>
      </div>
    </div>
    <aside>
      <h2>파일 정보</h2>
      <dl id="info"></dl>
      <h2>구간</h2>
      <ul class="axes" id="phaseList"></ul>
    </aside>
  </div>
</div>

/* ---------- playerAnimator 보간 재현 ---------- */
const easeIn = f => t => f(t);
const easeOut = f => t => 1 - f(1 - t);
const easeInOut = f => t => t < .5 ? f(t * 2) / 2 : 1 - f(2 - t * 2) / 2;
const sine = n => 1 - Math.cos(n * Math.PI / 2), quad = n => n * n, cubic = n => n * n * n, pw = p => n => Math.pow(n, p);
const EASES = {
  LINEAR: t => t, CONSTANT: () => 0,
  INSINE: easeIn(sine), OUTSINE: easeOut(sine), INOUTSINE: easeInOut(sine),
  INQUAD: easeIn(quad), OUTQUAD: easeOut(quad), INOUTQUAD: easeInOut(quad),
  INCUBIC: easeIn(cubic), OUTCUBIC: easeOut(cubic), INOUTCUBIC: easeInOut(cubic),
  INQUART: easeIn(pw(4)), OUTQUART: easeOut(pw(4)), INOUTQUART: easeInOut(pw(4)),
};
const easeOf = s => { let n = s.toUpperCase(); if (n.startsWith('EASE')) n = n.slice(4); return EASES[n] || EASES.LINEAR; };
const E = ANIM.emote, DEG = Math.PI / 180;
const tracks = {}; // part.axis -> [{tick,value,ease}]
for (const m of E.moves) for (const [k, v] of Object.entries(m)) {
  if (k === 'tick' || k === 'easing' || k === 'turn') continue;
  for (const [ax, val] of Object.entries(v)) {
    const key = k + '.' + ax; (tracks[key] ||= []).push({ tick: m.tick, value: val * (E.degrees ? DEG : 1), ease: easeOf(m.easing) });
  }
}
Object.values(tracks).forEach(a => a.sort((x, y) => x.tick - y.tick));
const IOS = EASES.INOUTSINE;
function sample(key, t, current = 0) {
  const k = tracks[key]; if (!k || t >= E.stopTick) return current;
  let i = -1; for (let j = 0; j < k.length; j++) if (k[j].tick <= t) i = j;
  let before, after;
  if (i === -1) before = t < E.beginTick ? { tick: 0, value: current, ease: IOS } : { tick: E.beginTick, value: 0, ease: IOS };
  else { before = k[i]; if (t >= E.endTick && i === k.length - 1 && before.tick < E.endTick) before = { ...before, tick: E.endTick }; }
  if (i + 1 < k.length) after = k[i + 1];
  else if (t < E.endTick) after = { tick: E.endTick, value: k[k.length - 1].value };
  else after = { tick: E.stopTick, value: current };
  if (after.tick === before.tick) return before.value;
  const f = (t - before.tick) / (after.tick - before.tick);
  return before.value + before.ease(f) * (after.value - before.value);
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

function project(p) {

  const cx = Math.sin(camYaw) * Math.cos(camPitch) * d, cz = -Math.cos(camYaw) * Math.cos(camPitch) * d, cy = ty + Math.sin(camPitch) * d;

  const px = sample('body.x', t), py = sample('body.y', t), pz = sample('body.z', t);
  const bodyM = mul(mul(mul(mul(T(px, py + .7, pz), RZ(bz)), RY(by)), RX(bx)), T(0, -.7, 0));
  const root = mul(mul(bodyM, T(0, 1.501, 0)), S(-1/16, -1/16, 1/16));

  const faces = [];
  const tips = [];
  for (const P of PARTS) {
    const rx = sample(P.name + '.pitch', t), ry = sample(P.name + '.yaw', t), rz = sample(P.name + '.roll', t);
    const m = mul(mul(root, T(...P.pivot)), mul(mul(RZ(rz), RY(ry)), RX(rx)));
    boxFaces(m, P.box, P.color, faces);
    const prop = P.hand && PROPS[(META.props || {})[P.hand] || 'none'];
    if (prop) {
      // 바닐라 손 위치 → item 회전 (HeldItemMixin). 그 공간의 x축 = 팔의 -x 이므로 팔 좌표에선 RX(-pitch)
      const ip = sample(P.hand + 'Item.pitch', t);
      const wm = mul(mul(m, T(...GRIP[P.hand])), RX(-ip));
      boxFaces(wm, prop.box, prop.color, faces);
      if (prop.glow) tips.push(ap(wm, prop.tip));
    }
  }
  const light = [0.4, 0.8, -0.45], ll = Math.hypot(...light);
  const proj = faces.map(f => {
    const p = f.pts.map(project);
    const a = f.pts[0], b = f.pts[1], c = f.pts[2];
    const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]], v = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
    const n = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]]; const nl = Math.hypot(...n) || 1;
    const lam = Math.abs((n[0]*light[0] + n[1]*light[1] + n[2]*light[2]) / nl / ll);
    return { p, depth: p.reduce((s, q) => s + q[2], 0) / 4, shade: .55 + .45 * lam, color: f.color };
  }).sort((a, b) => b.depth - a.depth);
  for (const f of proj) {
    const [r, g, b] = f.color.map(c => Math.round(c * f.shade));
    ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); f.p.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 소품 끝 빛 (시전 순간 전후로 밝아짐)
  const ct = META.castTick ?? -99, glow = Math.max(0, 1 - Math.abs(t - ct) / 4);
  ctx.globalCompositeOperation = 'lighter';
  for (const tip of tips) {
    const tp = project(tip);
    const grd = ctx.createRadialGradient(tp[0], tp[1], 0, tp[0], tp[1], 22 + glow * 24);
    grd.addColorStop(0, spark); grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = .3 + .6 * glow; ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(tp[0], tp[1], 48, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ---------- 재생 ---------- */
const PH = META.phases.map(p => [p[0], p[1], p[2]]);
const MAXT = E.stopTick + 6;
PH.push([E.stopTick, MAXT, '바닐라']);
// 정보 패널
document.getElementById('title').textContent = META.title;
document.getElementById('mname').textContent = ANIM.name;
document.getElementById('desc').textContent = (ANIM.description || '') + ' playerAnimator 보간을 그대로 재현한 미리보기예요. 드래그하면 시점을 돌릴 수 있어요.';
document.title = META.title + ' 모션';
document.getElementById('scrub').max = MAXT;
const PART_KO = { head: '머리', torso: '상체', body: '몸 전체', rightArm: '오른팔', leftArm: '왼팔', rightLeg: '오른다리', leftLeg: '왼다리', rightItem: '오른손 소품', leftItem: '왼손 소품' };
const moved = [...new Set(Object.keys(tracks).map(k => k.split('.')[0]))];
const fixed = ['head', 'torso', 'rightArm', 'leftArm', 'rightLeg', 'leftLeg'].filter(p => !moved.includes(p));
const info = [
  ['경로', 'assets/chacademy_motion/player_animations/' + ANIM.name + '.json'],
  ['ID', 'chacademy_motion:' + ANIM.name],
  ['길이', E.stopTick + '틱 (' + (E.stopTick / 20).toFixed(2) + '초)'],
  ['시전 순간', META.castTick != null ? META.castTick + '틱 (' + (META.castTick / 20).toFixed(2) + '초)' : '없음'],
  ['움직이는 부위', moved.map(p => PART_KO[p] || p).join(', ')],
  ['바닐라 유지', fixed.length ? fixed.map(p => PART_KO[p]).join(', ') : '없음'],
];
document.getElementById('info').innerHTML = info.map(([a, b]) => '<dt>' + a + '</dt><dd></dd>').join('');
document.querySelectorAll('#info dd').forEach((dd, i) => dd.textContent = info[i][1]);
const pl = document.getElementById('phaseList');
META.phases.forEach(p => { const li = document.createElement('li'); const b = document.createElement('b'); b.textContent = p[0] + '–' + p[1] + ' '; li.appendChild(b); li.appendChild(document.createTextNode(p[3] || p[2])); pl.appendChild(li); });
const tl = document.getElementById('tl');
PH.forEach(([a, b, n]) => { const d = document.createElement('div'); d.className = 'seg'; d.style.left = (a / MAXT * 100) + '%'; d.style.width = ((b - a) / MAXT * 100) + '%'; d.textContent = n; d.dataset.a = a; d.dataset.b = b; tl.appendChild(d); });
const mk = document.createElement('div'); mk.className = 'cast-mark'; mk.style.left = ((META.castTick ?? -99) / MAXT * 100) + '%'; if (META.castTick != null) tl.appendChild(mk);

let tick = 0, playing = true, speed = 1, last = performance.now();
const scrub = document.getElementById('scrub'), label = document.getElementById('tickLabel'), phaseEl = document.getElementById('phase');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function ui() {
  scrub.value = tick; label.textContent = tick.toFixed(1) + '틱 · ' + (tick / 20).toFixed(2) + '초';
  const ph = PH.find(([a, b]) => tick >= a && tick < b) || PH[PH.length - 1]; phaseEl.textContent = ph[2];
  tl.querySelectorAll('.seg').forEach(s => s.classList.toggle('hot', tick >= +s.dataset.a && tick < +s.dataset.b));
}
function frame(now) {
  const dtTicks = Math.min(.1, (now - last) / 1000) * 20; last = now;
  if (playing) {
    tick += dtTicks * speed;
    if (tick > MAXT) { tick = 0; }
  }
  draw(tick); ui();
  requestAnimationFrame(frame);
}
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '일시정지' : '재생'; };
document.getElementById('replay').onclick = () => { tick = 0; playing = true; document.getElementById('play').textContent = '일시정지'; };
document.getElementById('speed').onchange = e => speed = +e.target.value;
scrub.oninput = () => { tick = +scrub.value; playing = false; document.getElementById('play').textContent = '재생'; };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { camYaw = +b.dataset.view * DEG; });
let drag = null;
cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY, camYaw, camPitch]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!drag) return; camYaw = drag[2] + (e.clientX - drag[0]) * .01; camPitch = Math.max(-.2, Math.min(1.1, drag[3] + (e.clientY - drag[1]) * .006)); });
cv.addEventListener('pointerup', () => drag = null);
if (reduce) speed = .5, document.getElementById('speed').value = '0.5';
requestAnimationFrame(frame);
</script>
</body></html>
