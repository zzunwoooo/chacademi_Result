# 나니 다이아서버 설정. 고친 뒤 /다이아 리로드
# 기준: 처음 목표 1000개 (11/16 오너). 아래 수치는 전부 이 기준에 맞춘 값이다.

# ── 목표 다이아 ───────────────────────────────────────────
goal:
  start-min: 1000         # 처음 들어올 때 "남은 목표". min 과 max 가 같으면 모두 같은 값 (다르면 그 사이 랜덤)
  start-max: 1000

# ── 보유 다이아: 주운 다이아는 인벤토리 대신 화면 숫자로 ───────────
wallet:
  absorb-blocks: true     # 다이아 블록도 흡수 (블록 1개 = 다이아 9개)

# ── 한글 닉네임 ────────────────────────────────
nickname:
  min: 2
  max: 8
  pattern: "^[가-힣0-9]+$"        # 완성형 한글·숫자만 (영문·자음/모음만은 불가). 영문도 허용하려면 "^[가-힣a-zA-Z0-9]+$"
  rule-text: "한글·숫자 {min}~{max}글자"
  banned: [운영자, 관리자, admin]
  allow-change: true              # /닉네임 으로 다시 바꾸기 허용
  force-on-join: true             # 닉네임이 없으면 접속했을 때 닉네임 창을 띄움 (정할 때까지 닫을 수 없음)

# ── 후원 받기 (donation 플러그인 연동) ───────────────────────────
donation:
  enabled: true
  allow-test: true            # 후원 플러그인의 시험 후원도 받을지
  announce-ticks: 40          # 알림이 뜨고 나서 이벤트가 실행되기까지 (20 = 1초)
  queue-gap-ticks: 20         # 이벤트 하나가 끝나고 다음 것까지 쉬는 시간

# ── 후원 이벤트: 별풍선 개수 → 이벤트 (대상 = 후원 받은 스트리머) ────────────
# kind: good(도움) / bad(방해) / neutral  — 알림 틀 종류에 쓰임
# icon: 화면에 띄울 그림 (모드 안 textures/ui/ 아래 이름, 확장자 없이)
# actions: food <개수> | goal <최소> <최대> (음수 = 감소) | goalpm <개수> | repeat <횟수> goal <최소> <최대>
#          diamonds <개수> | half | death | pool <풀 이름> | poolx <풀 이름> <횟수> | wheel | miner | pending(아직 안 만든 것)
#          bomb <개수> (다이아 폭탄: 펑 터지며 다이아가 사방으로)
#          vote (3000 채팅 투표: 방송 채팅 1·2 를 30초 동안 세어 많은 쪽 실행 — 1 다이아 폭탄 / 2 즉사)
events:
# 11/23 오너(클라이언트) 표: 10 나니죽빵 · 50/51 ±10~40 · 222 괴롭히기 · 300 다이아 도움 · 500/510 ±50~300 한 번에 · 2000 후원자 도우미 (100·1000 룰렛 없앰)
  "10":   { name: "나니죽빵",         icon: "icons/meal", kind: good,    actions: ["food 3"] }
  "50":   { name: "다이아 추가",      icon: "icons/goal_up", kind: bad,     actions: ["goal 10 40"] }
  "51":   { name: "다이아 감소",      icon: "icons/goal_down", kind: good,    actions: ["goal -40 -10"] }
  "222":  { name: "괴롭히기",         icon: "icons/hotbar_shuffle", kind: neutral, actions: ["pool prank"] }
  "300":  { name: "다이아 도움",      icon: "icons/diamond_pile", kind: good,    actions: ["pool reward"] }
  "500":  { name: "다이아 추가",      icon: "icons/goal_up", kind: bad,     actions: ["goal 50 300"] }
  "510":  { name: "다이아 감소",      icon: "icons/goal_down", kind: good,    actions: ["goal -300 -50"] }
  "2000": { name: "후원자 도우미",    icon: "icons/ai_player", kind: good,  actions: ["miner"] }
  "3000": { name: "채팅 투표",        icon: "icons/vote", kind: neutral, actions: ["vote"] }
  "4444": { name: "즉사",             icon: "icons/instant_death", kind: bad,     actions: ["death"] }

# ── 랜덤 풀: "pool <이름>" 이벤트가 여기서 하나를 뽑는다 (직전에 나온 것은 다음 한 번 제외) ──
# scope: one = 접속한 사람 중 룰렛으로 1명 / all = 전원 / self = 후원 받은 사람
# action: ant·curse·creeper·reverse·blackout·lava·bunny·dance·midas·giant <초>
#         hotbar | swap | crow | rocket | anvil | ufo | rain <개수> | fountain <개수> | pinata <개수> | meteor <운석 수>
# 시간·개수는 기획서 값. 기획서에 시간이 없던 개미화·바닥은 마그마 블럭은 30초. 11/22 오너: 스토커 크리퍼 15초, 저주받은 곡괭이 1분, UFO 가림 3초
pools:
  prank:
    - { id: ant,      name: "개미화",          icon: "icons/ant_size", scope: one, action: "ant 30" }
    - { id: curse,    name: "저주받은 곡괭이", icon: "icons/cursed_pick", scope: one, action: "curse 60" }
    - { id: creeper,  name: "스토커 크리퍼",   icon: "icons/creeper", scope: one, action: "creeper 15" }
    - { id: reverse,  name: "조작 반전",       icon: "icons/upside_down", scope: one, action: "reverse 30" }
    - { id: hotbar,   name: "핫바 셔플",       icon: "icons/hotbar_shuffle", scope: one, action: "hotbar" }
    - { id: swap,     name: "자리 셔플",       icon: "icons/position_shuffle", scope: all, action: "swap" }
    - { id: blackout, name: "정전",            icon: "icons/blackout", scope: all, action: "blackout 10" }
    - { id: lava,     name: "바닥은 마그마 블럭", icon: "icons/lava_floor", scope: all, action: "lava 30" }
    - { id: bunny,    name: "강제 바니홉",     icon: "icons/bunnyhop", scope: all, action: "bunny 30" }
    - { id: crow,     name: "다이아 도둑 까마귀", icon: "icons/crow", scope: one, action: "crow" }
    - { id: rocket,   name: "로켓 발사",       icon: "icons/rocket", scope: one, action: "rocket" }
    - { id: anvil,    name: "모루 낙하",       icon: "icons/anvil", scope: one, action: "anvil" }
    - { id: dance,    name: "강제 댄스",       icon: "icons/dance", scope: one, action: "dance 10" }
    - { id: ufo,      name: "UFO 납치",        icon: "icons/ufo", scope: one, action: "ufo" }
    - { id: ufo_all,  name: "단체 UFO 납치",   icon: "icons/group_ufo", scope: all, action: "ufo" }
    - { id: seal,     name: "인벤토리 칸 봉인", icon: "icons/hotbar_shuffle", scope: one, action: "seal 30" }
    - { id: monsters, name: "몬스터 습격",     icon: "icons/monster_raid", scope: one, action: "monsters 25" }
  # 300개 다이아 연출 (후원 받은 사람에게). 기획: 어떤 게 걸려도 다이아 80~120개 근처
  reward:
    - { id: rain,     name: "다이아 소나기",   icon: "icons/diamond_rain", scope: self, action: "rain 100" }
    - { id: midas,    name: "미다스의 손",     icon: "icons/midas", scope: self, action: "midas 10" }
    - { id: pinata,   name: "다이아 피냐타",   icon: "icons/pinata", scope: self, action: "pinata 150" }
    - { id: fountain, name: "다이아 분수",     icon: "icons/diamond_fountain", scope: self, action: "fountain 70" }
    - { id: meteor,   name: "운석우",          icon: "icons/meteor_shower", scope: self, action: "meteor 3" }
    - { id: giant,    name: "거인화",          icon: "icons/giant", scope: self, action: "giant 30" }

# ── 1000개 룰렛: weight = 확률(%) ─────────────────────────────
wheel:
  - { name: "목표 -300",    icon: "icons/goal_down", weight: 10, action: "goal -300 -300" }
  - { name: "목표 +300",    icon: "icons/goal_up", weight: 10, action: "goal 300 300" }
  - { name: "목표 ±100",    icon: "icons/random_goal", weight: 20, action: "goalpm 100" }
  - { name: "다이아 200개", icon: "icons/diamond_pile", weight: 10, action: "diamonds 200" }
  - { name: "연출 3연속",   icon: "icons/triple_effect", weight: 15, action: "poolx reward 3" }
  - { name: "AI 플레이어",  icon: "icons/ai_player", weight: 15, action: "miner" }
  - { name: "다이아 반토막", icon: "icons/half_diamond", weight: 10, action: "half" }
  - { name: "꽝: 밥 3개",   icon: "icons/no_prize", weight: 10, action: "food 3" }

# ── 2000개 후원자 AI 플레이어 ──────────────────────────────────
miner:
  seconds: 180                # 머무는 시간
  max: 3                      # 동시에 최대 몇 명 (넘치면 차례를 기다림)
  radius: 12                  # 다이아 광석을 찾는 반경 (이 안에 보이면 그쪽으로 파고 들어감)
  dig-to-y: -54               # 안 보이면 이 높이까지 계단식으로 내려간 뒤 옆으로 굴을 팜 (다이아가 많은 깊이)
  leash: 48                   # 스트리머와 이보다 멀어지면 스트리머 옆에서 다시 시작

effects:
  ant-scale: 0.2              # 개미화 때 몸 크기
  giant-scale: 2.0            # 거인화 때 몸 크기
  crow-steal: 64              # 까마귀가 훔치는 보유 다이아 (모자라면 전부)
  crow-flee-seconds: 20       # 까마귀가 도망 다니는 시간 (그 안에 때리면 되찾음)
  rocket-height: 100          # 로켓이 올라가는 높이
  anvil-stun-seconds: 5       # 모루에 맞았을 때 기절 시간
  pinata-hits: 50             # 피냐타를 터뜨리려면 때려야 하는 횟수
  pinata-seconds: 30
  midas-keep-ratio: 0.15      # 미다스가 끝났을 때 안 캔 광석 중 남겨 두는 비율 (나머지는 원래 블럭으로)
  meteor-ore-blocks: 33       # 운석 하나가 다이아 광석으로 바꾸는 블럭 수 (3개 × 33 ≈ 100)
  ufo-hold-seconds: 3         # UFO 에 갇혀 있는 시간 (화면이 가려지는 시간). 11/22 오너 "너무 긺" → 10초에서 줄임
  ufo-radius: 300             # UFO 가 내려놓는 곳: 원래 자리에서 이 칸 수 안의 아무 곳
  bomb-diamonds: 500          # 다이아 폭탄 1개에서 나오는 다이아 (목표의 절반)
  seal-slots: 9               # 인벤토리 칸 봉인 때 잠기는 칸 수 (가방 36칸 중, 11/22 오너 요청 · 수치는 Claude)
  # 몬스터 습격: 한 번에 부르는 수 (종류는 20종 중 겹치지 않게 무작위)
  monster-min: 3
  monster-max: 5

# ── 전용 아이템 ────────────────────────────────────────────
# material = 바탕이 되는 게임 아이템. art = 상점 화면에 쓰는 그림, model = 인벤토리에서 보이는 그림(ItemsAdder 리소스팩)
items:
  food:
    name: "밥"
    material: BREAD
    art: "items/food"
    model: "diamondserver:food"
    hunger: 8             # 스테이크와 같음
    saturation: 12.8
    lore: ["든든한 한 끼"]
  inven_save_ticket:
    name: "인벤세이브권"
    material: PAPER
    art: "items/inventory_save_ticket"
    model: "diamondserver:inventory_save_ticket"
    lore: ["가지고 있으면 죽을 때 1장이 자동으로 사용되어", "아이템과 레벨을 잃지 않습니다"]
  return_ticket:
    name: "귀환권"
    material: PAPER
    art: "items/return_ticket"
    model: "diamondserver:return_ticket"
    lore: ["손에 들고 우클릭하면 시작 지점으로 돌아갑니다"]
  teleport_ticket:
    name: "텔레포트권"
    material: PAPER
    art: "items/teleport_ticket"
    model: "diamondserver:teleport_ticket"
    lore: ["손에 들고 우클릭하면 고른 사람에게 이동합니다"]

# ── 상점: 구매 (가격 = 보유 다이아) ─────────────────────────────
# 가격 기준 (목표 1000개, 행운 없이 캐면 1시간에 다이아 30~50개쯤으로 잡음):
#  - 곡괭이: 싸게. 캔 다이아는 화면 숫자로 들어가 제작에 못 쓰므로 상점이 기본 공급처다 (다이아 곡괭이 = 재료값 3개 + 조금)
#  - 행운: 가장 큰 투자. 광석 1개당 다이아가 I 약 1.3배 · II 약 1.75배 · III 약 2.2배 → 광석 60~90개쯤 캐면 본전
#          행운 III = 100 (목표의 10%). 1시간 반~2시간쯤 캐면 살 수 있고, 그 뒤 속도가 두 배가 된다
#  - 효율·내구성·수선: 편의. 10~50
#  - 인벤세이브권 10 (죽어도 보유 다이아는 안 잃으므로 비싸지 않게) · 귀환권 3 · 텔레포트권 5 · 밥 8개에 1
#  - 보관함: 엔더 상자 15 · 셜커 상자 30 (광질하다 가방이 차는 것을 덜어 주는 편의. 셜커 상자는 들고 다니는 27칸이라 더 비쌈)
# 11/22 조정 (오너 "상점 밸런스 알아서 손 봐"):
#  - 곡괭이 순서를 성능대로: 철 5→4, 다이아 5→8 (다이아 곡괭이가 철과 같은 값이던 것), 네더라이트 30→40
#    (다이아 곡괭이는 보유 다이아 3개를 꺼내 직접 만들 수도 있으니 상점 값은 편의값)
#  - 행운 I 20→15 · II 50→40 (첫 행운을 일찍 사서 손맛을 보게), III 는 100 그대로 (가장 큰 투자)
#  - 수선 50→40, 텔레포트권 3→5 (UFO·로켓으로 멀리 날아갔을 때 동료에게 돌아가는 값이라 귀환권보다 조금 비싸게)
#  - 판매가는 그대로 (광질 부산물이 주 수입이 되지 않게)
shop:
  categories:             # 왼쪽 분류 (위에서부터 순서대로)
    pickaxe: "곡괭이"
    item: "아이템"
  items:
    # 11/23 오너: 곡괭이는 종결곡 3종만 (기본 곡괭이 뺌 · 효율 V·행운 III·내구성 III·수선 · 손에 들면 캐는 속도 n배로 바로바로 깨짐). 가격은 오너 값 그대로
    - { id: iron_final,      cat: pickaxe, name: "철 종결곡",     material: IRON_PICKAXE,      price: 20,  enchants: { efficiency: 5, fortune: 3, unbreaking: 3, mending: 1 }, mine-speed: 2 }
    - { id: diamond_final,   cat: pickaxe, name: "다이아 종결곡", material: DIAMOND_PICKAXE,   price: 100, enchants: { efficiency: 5, fortune: 3, unbreaking: 3, mending: 1 }, mine-speed: 3 }
    - { id: netherite_final, cat: pickaxe, name: "네더 종결곡",   material: NETHERITE_PICKAXE, price: 200, enchants: { efficiency: 5, fortune: 3, unbreaking: 3, mending: 1 }, mine-speed: 4 }
    - { id: food,              cat: item, name: "밥",           item: food,              amount: 8, price: 1 }
    - { id: inven_save_ticket, cat: item, name: "인벤세이브권", item: inven_save_ticket, price: 10 }
    - { id: return_ticket,     cat: item, name: "귀환권",       item: return_ticket,     price: 3 }
    - { id: teleport_ticket,   cat: item, name: "텔레포트권",   item: teleport_ticket,   price: 5 }
    - { id: ender_chest,       cat: item, name: "엔더 상자",    material: ENDER_CHEST,       price: 15 }
    - { id: shulker_box,       cat: item, name: "셜커 상자",    material: SHULKER_BOX,       price: 30 }

# ── 상점: 판매 (숫자 = 1개당 다이아. 소수점은 쌓였다가 1 이 넘으면 다이아 1개) ──
# 기준: 광질하다 나오는 부산물을 다 팔면 1시간에 다이아 8~10개쯤 (캐는 양의 2할 안팎). 주 수입이 되지 않게 낮게 둔다.
# block = 그 광물 9개로 만든 블록 (블록도 팔리고 값은 9배)
sell:
  COAL:           { name: "석탄",        price: 0.015, block: COAL_BLOCK }
  RAW_IRON:       { name: "철 원석",     price: 0.04,  block: RAW_IRON_BLOCK }
  IRON_INGOT:     { name: "철 주괴",     price: 0.05,  block: IRON_BLOCK }
  RAW_COPPER:     { name: "구리 원석",   price: 0.015, block: RAW_COPPER_BLOCK }
  COPPER_INGOT:   { name: "구리 주괴",   price: 0.02,  block: COPPER_BLOCK }
  RAW_GOLD:       { name: "금 원석",     price: 0.08,  block: RAW_GOLD_BLOCK }
  GOLD_INGOT:     { name: "금 주괴",     price: 0.1,   block: GOLD_BLOCK }
  REDSTONE:       { name: "레드스톤",    price: 0.008, block: REDSTONE_BLOCK }
  LAPIS_LAZULI:   { name: "청금석",      price: 0.015, block: LAPIS_BLOCK }
  EMERALD:        { name: "에메랄드",    price: 0.5,   block: EMERALD_BLOCK }
  QUARTZ:         { name: "네더 석영",   price: 0.02 }
  AMETHYST_SHARD: { name: "자수정 조각", price: 0.03 }

# ── 명령어 자동완성 ─────────────────────────────────────────
commands:
  hide-others: true       # 일반 플레이어가 / 를 쳤을 때 아래 명령만 보이게 한다 (관리자는 전부 보임). 숨길 뿐, 사용을 막지는 않는다
  visible: [명령어, 도움말, 상점, 우편함, 제출, 인출, 입금, 목표, 닉네임]

# ── 사망 벌칙 ─────────────────────────────────────────────
death:
  goal-penalty-min: 100   # 죽으면 남은 목표가 min~max 사이 무작위로 늘어난다 (11/23 오너 100~300). 0 이면 끔
  goal-penalty-max: 300
                          # 4444 즉사로 죽은 것과 이미 졸업한 사람은 늘지 않는다

# ── 3000개 채팅 투표 ────────────────────────────────────────
# 방송 채팅에 1 또는 2 를 친 수를 센다. 세는 것은 스트리머 게임의 모드가 후원 모드(Donation)의 방송 연결로 하고,
# 서버는 접속한 스트리머 방송 4개를 합산한다 (같은 시청자가 여러 번 쳐도 마지막 것 1표). 동점·표 없음은 무작위.
vote:
  seconds: 30
  option-1: "다이아 폭탄"   # 1 이 이기면: 다이아 폭탄 (effects.bomb-diamonds 개)
  option-2: "즉사"          # 2 가 이기면: 즉사 (사망 벌칙은 붙지 않음)
  # SOOP 방송국 아이디 (play.sooplive.com/<아이디>). 투표 동안 서버가 이 방송들 채팅의 1·2 를 직접 셈 (같은 시청자 아이디는 1표)
  soop-ids: [cctvno, nmangoquince, yeveee, sksgml16]   # 유연서 · 망구랑 · 유설아 · 킴나니

# ── 로비 → 야생 이동 포탈 (11/23 오너: 홀로그램 느낌) ────────────────
# 로비 광장(나무에 안 가린 평평한 곳)에 빛 고리 + 떠 있는 글씨. 들어가면 to-world 의 시작 지점 땅 위로 보낸다.
lobby-portal:
  enabled: true
  world: lobby
  x: 34.5
  y: 47.0          # 발 높이
  z: 32.5
  to-world: world
