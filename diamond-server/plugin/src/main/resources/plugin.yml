name: DiamondCore
version: 0.9.0
main: com.diamondserver.core.DiamondPlugin
api-version: '1.21'
description: "나니 다이아서버 (다이아 장부 · 상점 · 전용 아이템 · 후원 이벤트)"
softdepend: [donation, ModelEngine, Citizens]
# 명령어는 전부 한글. 사용법은 게임 안에서 /명령어 (플레이어) · /다이아 도움말 (관리자)
commands:
  명령어:
    description: "쓸 수 있는 명령어 보기"
    usage: "/명령어"
    aliases: [도움말]
  상점:
    description: "상점 열기 (G 키)"
    usage: "/상점"
  우편함:
    description: "우편함 열기 (H 키). 모두 받기는 /우편함 받기"
    usage: "/우편함 [받기]"
  제출:
    description: "보유 다이아를 제출해 남은 목표 줄이기"
    usage: "/제출 [개수|전부]"
  인출:
    description: "보유 다이아를 아이템으로 꺼내기"
    usage: "/인출 [개수]"
  입금:
    description: "인벤토리의 다이아를 보유 다이아로 넣기"
    usage: "/입금"
  목표:
    description: "남은 목표와 보유 다이아 보기"
    usage: "/목표"
  닉네임:
    description: "한글 닉네임 정하기"
    usage: "/닉네임 [새 닉네임]"
  다이아:
    description: "나니 다이아서버 관리 명령"
    usage: "/다이아 도움말"
    permission: diamondserver.admin
    permission-message: "관리자만 쓸 수 있는 명령입니다."
  후원테스트:
    description: "후원이 온 것처럼 이벤트를 실행 (시험용)"
    usage: "/후원테스트 <개수> [후원자] [닉]"
    permission: diamondserver.admin
    permission-message: "관리자만 쓸 수 있는 명령입니다."
permissions:
  diamondserver.admin:
    description: "나니 다이아서버 관리 명령 사용"
    default: op
