# 연금술 (경험치로 제작하는 숨겨진 레시피)
# 고친 뒤 /연금술관리 새로고침 으로 다시 불러옵니다. 서버를 다시 켤 필요는 없습니다.
#
# 재료 넣는 순서는 상관없고, "어떤 재료가 총 몇 개"인지만 봅니다. 같은 재료를 두 칸에 나눠 넣어도 합쳐서 셉니다.
# 아이템 표기: 아이템애더 아이템은 "네임스페이스:아이디"(예: item:lily), 바닐라 아이템은 "minecraft:아이디"(예: minecraft:sugar).
# 레시피 발견은 LuckPerms 권한 magiccodex.alchemy.recipe.<레시피아이디> 로 저장됩니다(스쿨·야생 공유는 LuckPerms 공유를 따름).

settings:
  # 마법진 둘레 재료 칸 수 (1~8). UI 그림은 6칸 기준입니다.
  slots: 6
  # 재료 칸을 눌렀을 때 고를 수 있는 아이템: 아이템 설명(lore) 첫 줄이 아래 카테고리 중 하나인 아이템.
  # 첫 줄의 [ ] ( ) 「 」 같은 괄호와 앞뒤 공백은 무시합니다. 예: "재료", "[재료]" 모두 "재료"로 봅니다.
  material-categories:
  - 재료
  # 설명 첫 줄과 상관없이 재료로 취급할 아이템 (바닐라 아이템 등)
