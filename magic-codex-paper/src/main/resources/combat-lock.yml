# 전투 중 이동 막기 (오픈 전 메모 #91, 오너 2026-10-26)
# 고친 뒤: /서버관리 새로고침 전투이동   (서버마다)
#
# 전투 = 살아있는 상대(야생 몹·플레이어)를 때렸거나 맞은 뒤 아래 seconds 초 안.
#   근접·화살·마법 피해·펫 스킬·길들인 동물 공격 모두 셉니다. NPC·펫·허수아비는 세지 않아요.
#   죽으면 바로 풀립니다.
# 전투 중에 막는 것: 귀환권 · 지도 이동(지점·개인 지점·야생 스폰) · 아래 명령 · 아래 마법.
#   막히면 차카데미 알림창에 "전투 중이라 이동할 수 없어요 · N초 뒤 가능" 이 뜨고, 아이템·마나·쿨타임은 쓰지 않아요.
# 막지 않는 것: 공간 도약 같은 짧은 전투 이동 마법, 빗자루 비행, 죽어서 리스폰(사망 귀환 포함),
#   큐디치·결투 같은 경기가 시키는 이동, 관리자(OP).

# false = 이 기능 전체 끄기 (전투 판정 자체는 다른 기능이 계속 씀)
enabled: true

# 마지막으로 때리거나 맞은 뒤 몇 초 동안 전투로 볼지 (1~120)
seconds: 10

# 막을 서버 (travel.yml 의 server-id). 비우면 [] 모든 서버.
servers:
  - school
  - wild1
  - wild2

# 막을 명령 (앞의 / 없이, 소문자). "huskhomes:home" 처럼 앞에 플러그인 이름을 붙여 쳐도 같이 막힙니다.
# 한글 별칭을 따로 만들었다면 여기에 그 이름도 넣어 주세요. 관리자 명령(/유저관리 찾아가기 등)은 넣지 마세요.
blocked-commands:
  - home
  - phome
  - publichome
  - spawn
  - warp
  - tpa
  - tpahere
  - tpaccept
  - tpyes
  - back
  - rtp
  - randomtp
  - 집
  - 홈
  - 스폰
  - 워프
  - 뒤로
  - 귀환

# 막을 마법 (마법 ID). 먼 거리 귀환·순간이동 마법만. 공간 도약(spatial_leap) 같은 전투 이동 마법은 넣지 마세요.
blocked-spells:
  - companion_return      # 145 동행 귀환 (마을 귀환 지점으로)

# 같은 알림이 연달아 뜨지 않게 하는 간격 (밀리초)
notify-cooldown-ms: 1500
