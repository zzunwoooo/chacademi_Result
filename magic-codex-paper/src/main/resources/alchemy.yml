# 연금술 (경험치로 제작하는 숨겨진 레시피)
# 게임 안에서는 /컨텐츠관리 연금술 레시피편집 화면으로 편집하면 됩니다.
# 이 파일은 스쿨·야생이 함께 쓰는 공유 DB의 설정을 이 서버에 받아 둔 사본입니다. 한쪽에서 바꾸면 다른 서버도 몇 초 안에 똑같이 바뀝니다.
# 파일을 직접 고쳤다면 /서버관리 새로고침 연금술 → 두 서버 모두에 적용됩니다. 서버를 다시 켤 필요는 없습니다.
#
# 재료 넣는 순서는 상관없고, "어떤 재료가 총 몇 개"인지만 봅니다. 같은 재료를 두 칸에 나눠 넣어도 합쳐서 셉니다.
# 아이템 표기: 아이템애더 아이템은 "네임스페이스:아이디"(예: item:lily), 바닐라 아이템은 "minecraft:아이디"(예: minecraft:sugar).
# 레시피 발견은 LuckPerms 권한 magiccodex.alchemy.recipe.<레시피아이디> 로 저장됩니다(스쿨·야생 공유는 LuckPerms 공유를 따름).

settings:
  # 마법진 둘레 재료 칸 수 (1~8). UI 그림은 6칸 기준입니다.
  slots: 6
  # 재료 칸을 눌렀을 때 고를 수 있는 아이템: 아이템 설명(lore) 첫 줄이 아래 카테고리 중 하나인 아이템.
  # 첫 줄의 [ ] ( ) 「 」 같은 괄호와 앞뒤 공백은 무시합니다. 예: "재료", "[재료]" 모두 "재료"로 봅니다.
  material-categories:
    - 재료
  # 설명 첫 줄과 상관없이 재료로 취급할 아이템 (바닐라 아이템 등)
  material-items: []
  # 레시피와 거의 맞을 때 힌트를 줄지 (재료 하나만 다르거나, 재료는 맞고 양만 다를 때)
  near-hint: true

# 화면에 나오는 문구. {name} 레시피 이름, {amount} 개수, {exp} 경험치, {item} 아이템 이름
messages:
  near: 무언가 반응할 것 같다…
  near-amount: 재료는 맞는 것 같은데, 양이 조금 다른 것 같다…
  nothing: 아무 반응이 없다.
  crafted: "{name} ×{amount} 제작 완료"
  discovered: "새로운 레시피 발견! · {name}"
  # 결과물이 인벤토리에 다 들어가지 않을 때 (제작하지 않음, 재료·경험치 그대로)
  no-room: 인벤토리에 결과물을 넣을 자리가 없어요. 공간을 비운 뒤 다시 시도해 주세요.
  no-exp: "경험치가 부족합니다. (필요 {exp})"
  # 아직 발견하지 않은 레시피인데 경험치가 부족할 때 (필요 경험치는 알려 주지 않음)
  no-exp-locked: 경험치가 부족해 마법진이 반응하지 않는다.
  missing: "재료가 부족합니다: {item}"
  empty: 재료를 넣어 주세요.

# 레시피 목록 (아직 비어 있음). 아래 예시의 # 을 지우고 고쳐 쓰면 됩니다.
#   name        목록에 보일 이름 (최대 40자)
#   result      결과 아이템, amount 결과 개수 (기본 1)
#   exp         소모 경험치 (바닐라 경험치 포인트, 레벨이 아님)
#   ingredients 재료와 개수. 서로 다른 재료 종류는 slots 개수 이하
#   order       목록 순서 (작을수록 위, 기본 0)
#   enabled     false 면 꺼짐 (발견·제작 불가, 목록에서도 빠짐)
recipes: {}
