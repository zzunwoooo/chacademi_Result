# 책 읽기 (MagicCodexBridge). 고친 뒤 /서버관리 새로고침 책
#
# books.<책ID>        책ID는 영문 소문자·숫자·_·- (1~48자). 책 기록(DB)이 이 ID로 남으니 한 번 정한 ID는 바꾸지 마세요.
#   title             제목 (40자까지). 첫 페이지 왼쪽 위에 표시.
#   pages             페이지 목록 (1~40). 한 페이지 = 펼친 두 쪽.
#     - left: |       왼쪽 쪽 본문 (1000자까지, 줄바꿈 그대로, 빈 줄 = 문단 띄우기)
#       right: |      오른쪽 쪽 본문 (생략 가능)
#   commands          (선택) 책을 펼쳤다가 닫으면(X·ESC 둘 다) 콘솔로 실행할 명령. 맨 앞 / 는 있어도 없어도 됨.
#                     플레이어마다 책 하나당 평생 한 번만 실행 (학교·야생 공유 DB). 명령이 없는 책은 글만 보여 줌.
#                     {player} = 마인크래프트 닉네임, {uuid} = UUID, {book} = 책ID
#   required-intelligence  (선택) 책을 펼치는 데 필요한 지능 (정수, 기본 0 = 제한 없음).
#                     지능은 스탯창의 '지능' 값(기본 + 장신구 + 손에 든 마법봉)과 같습니다.
#                     모자라면 책이 열리지 않고 "이 책은 아직 읽을 조건이 충족되지 않았어요 · 필요 지능 N" 알림이 뜹니다.
#                     블록 클릭·/컨텐츠관리 책 열기(미리보기) 둘 다 같은 조건을 봅니다. 미리보기는 지능이 충분한 계정으로 하세요.
#                     예)  required-intelligence: 30
#
# 마법 발견: 새 기능 없이 기존 수동 조건을 주면 됩니다 → 기존 '새로운 마법 발견' 알림이 그대로 뜸.
#   commands:
#     - "유저관리 {player} 마법조건 주기 flame_leap"
#   (마법조건 주기에 쓸 수 있는 마법 = MagicDiscovery manual-conditions.yml 의 마법, 자동완성으로 확인)
#
# 책과 블록 연결 (서버마다 따로, book-blocks.yml): 블록을 바라보고
#   /컨텐츠관리 책 연결 <책ID>      /컨텐츠관리 책 해제
# 미리보기: /컨텐츠관리 책 열기 <책ID> [닉네임]   (이렇게 연 책도 닫으면 명령이 실행됨)
# 기록 확인·초기화: /유저관리 <닉네임> 책기록 보기 · /유저관리 <닉네임> 책기록 초기화 <책ID> 확인

books:
  # [헛걸음] 3층 도서관 · 입구 바로 옆 책장 맨 윗칸. 제목만 그럴듯한 학생 연습장 (예전 예시 책 sample_book 을 살려 정리)
  sample_book:
    title: "오래된 마법서"
    required-intelligence: 0     # 필요 지능 (0 = 제한 없음)
    pages:
      - left: |
          이 책을 펼친 당신에게.

          미안하지만 이건 마법서가 아니다.
          1학년 때 내가 쓰던 연습장이다.
          표지가 멋있어서 샀을 뿐이다.
        right: |
          월요일. 촛불 켜기 실패.
          화요일. 촛불 켜기 실패. 눈썹이 탔다.
          수요일. 세드릭 교수님이 웃었다.
          목요일. 촛불이 켜졌다! …옆자리 애가 켜 준 거였다.
      - left: |
          그래도 하나는 배웠다.

          마법은 책을 펼친다고 생기지 않는다.
          제대로 된 책을 끝까지 읽고,
          제대로 된 수업을 끝까지 들어야 한다.
        right: |
          이 연습장을 도서관에 두고 간다.
          누군가 나처럼 표지에 속기를 바라며.

          — 루미나 기숙사, 이름은 비밀

  # ── 수업 책 (LessonBridge lessons.yml, 2026-10-26) — 끝까지 읽고 닫으면 마법 조건 지급 (플레이어당 1번). 필요 지능은 임시값: 기초 0 · 중급 20 · 고급 40 · 응용 50 · 심화 60 · 비전 0(대신 호감도) ──
  lesson_wind_1:
    title: "바람 마법 기초 — 바람의 손"
    required-intelligence: 0
    pages:
      - left: |
          바람은 손이 없다.
          그래서 마법사가 손을 빌려준다.

          오늘은 밀어내는 바람과 쏘아 보내는 바람.
          둘 다 숲에서 살아남는 데 필요한 것이다.
        right: |
          몬스터를 쓰러뜨리려 하지 마라.
          거리를 벌려라. 그다음에 생각해라.

          — 실습: 한 걸음 물러서며 손바닥을 펴고, 숨을 내쉬듯 바람을 밀어낸다.
      - left: |
          바람 화살은 모아서 쏜다.
          서두르면 흩어진다.

          내 매도 사냥할 때 기다린다.
          너도 기다려라.
        right: |
          숲이 험해진 건 잿빛 밤 이후다.
          예전엔 학생들이 혼자서도 숲을 다녔다.

          …다시 그렇게 되도록 가르치는 거다.
    commands:
      - "유저관리 {player} 마법조건 주기 wind_push"
      - "유저관리 {player} 마법조건 주기 cross_breeze"
  lesson_wind_2:
    title: "바람 마법 중급 — 칼날과 되받기"
    required-intelligence: 20
    pages:
      - left: |
          바람을 얇게 접으면 칼날이 된다.
          두껍게 모으면 벽이 된다.

          윈드 커터는 얇게.
          되받는 바람은 두껍게, 그리고 짧게.
        right: |
          화살이 날아오면 피하지 말고 돌려보내라.
          단, 반 박자. 그보다 늦으면 맞는다.

          — 실습: 매가 날갯짓하는 순간을 세어 보아라. 그 박자가 반 박자다.
      - left: |
          중급부터는 다치는 학생이 나온다.
          그래서 학생이 줄었다.

          다치지 않는 법도 수업이다.
        right: |
          칼날은 몬스터에게만.
          친구에게 겨누면 그날로 수업은 끝이다.
    commands:
      - "유저관리 {player} 마법조건 주기 vacuum_cleave"
      - "유저관리 {player} 마법조건 주기 returning_wind"
  lesson_wind_3:
    title: "바람 마법 고급 — 쏟아지는 화살"
    required-intelligence: 40
    pages:
      - left: |
          화살 하나는 피할 수 있다.
          다섯은 어렵다.

          바람 화살 다섯 개를 몸 둘레에 띄우고
          순서대로 놓아라.
        right: |
          중요한 건 순서다.
          한꺼번에 놓으면 서로 부딪쳐 흩어진다.

          — 실습: 왼쪽 위부터 시계 방향.
      - left: |
          이걸 쓸 줄 아는 학생은
          예전엔 한 학년에 열 명이 넘었다.

          지금은… 네가 몇 번째인지 모르겠군.
        right: |
          충분하다. 나머지는 숲에서 배워라.
    commands:
      - "유저관리 {player} 마법조건 주기 arrested_orbit"
  lesson_wind_taming:
    title: "하르바의 수업 — 숲의 짐승 달래기"
    required-intelligence: 0
    pages:
      - left: |
          숲의 짐승들이 사나워졌다.
          그렇다고 다 쓰러뜨릴 셈이냐?

          짐승은 적이 아니다. 겁먹었을 뿐이다.
        right: |
          교화는 빛으로 마음을 달래는 마법이다.
          빛은 이솔데 교수 몫이지만, 짐승은 내가 더 잘 안다.

          — 실습: 바람으로 거리를 두고, 짐승이 지칠 때를 기다려라.
      - left: |
          약해진 짐승일수록 마음을 열기 쉽다.
          해치지 말고, 쓰러뜨리지도 말고.

          내 매도 그렇게 처음 만났다.
        right: |
          교화한 짐승은 도감에 남는다.
          함께 다니는 친구가 될 수도 있지.

          …숲이 다시 조용해지면 좋겠군.
    commands:
      - "유저관리 {player} 마법조건 주기 rainbow_collar"
  lesson_wind_secret:
    title: "하르바의 비전 — 하늘을 누르는 바람"
    required-intelligence: 0
    pages:
      - left: |
          …이건 수업 목록에 없는 거다.

          바람을 한 점으로 모으면 무게가 생긴다.
          그 무게로 적을 끌어당기는 게 중력지대.
        right: |
          바람을 하늘로 풀어 놓으면 폭풍이 된다.
          그걸 지휘하는 게 폭풍의 지휘.

          둘 다 숲을 지키려고 만든 마법이다.
          뽐내려고 쓰지 마라.
      - left: |
          내 매가 너를 믿는다.
          그래서 가르친다.
        right: |
          …다른 학생들한테는 말하지 마라.
    commands:
      - "유저관리 {player} 마법조건 주기 weightless_zone"
      - "유저관리 {player} 마법조건 주기 storm_command"
  lesson_fire_1:
    title: "화염 마법 기초 — 첫 불씨"
    required-intelligence: 0
    pages:
      - left: |
          좋아, 불이다!
          불은 겁내면 꺼지고, 무시하면 번진다.

          파이어 볼은 작게, 빠르게.
          처음엔 촛불 하나 크기면 충분해!
        right: |
          잿불 덫은 땅에 불씨를 심어 두는 거야.
          밟으면 펑!

          — 실습: 운동장 끝 허수아비 앞에 덫 두 개. 세 개째는 안 깔린다는 걸 꼭 기억해!
      - left: |
          빗자루 시합 연습하다 보면
          불 마법 하나쯤은 있어야 덜 떨어지지!
        right: |
          자, 이제 기초 통과!
          다음 시간엔 벽을 세워 보자고!
    commands:
      - "유저관리 {player} 마법조건 주기 ember_bolt"
      - "유저관리 {player} 마법조건 주기 ember_trap"
  lesson_fire_2:
    title: "화염 마법 중급 — 불의 벽"
    required-intelligence: 20
    pages:
      - left: |
          플레어 월은 앞을 막는 불의 벽이야.
          도망칠 시간을 버는 마법이지.

          멋지게 싸우는 것보다
          살아 돌아오는 게 더 멋진 거다!
        right: |
          발화는 멀리 있는 대상에게 불을 붙여.
          대신 숲에서는 조심! 하르바 교수한테 혼난다!

          — 실습: 젖은 장작에 불 붙여 보기. 안 되면 마나가 아니라 집중이 부족한 거야.
      - left: |
          예전엔 이 수업을 들으려고
          줄을 섰다니까?

          지금은 네가 첫 줄이자 마지막 줄이야. 하하!
        right: |
          다음은 고급! 체력 단련도 같이 하자고!
    commands:
      - "유저관리 {player} 마법조건 주기 fire_curtain"
      - "유저관리 {player} 마법조건 주기 charcoal_conversion"
  lesson_fire_3:
    title: "화염 마법 고급 — 방패를 꿰뚫는 불"
    required-intelligence: 40
    pages:
      - left: |
          파이어 스트라이크!
          짧고 강한 불의 창으로 방패째 밀어붙인다.

          방패 든 상대와 실습할 때 쓰는 마법이었지.
        right: |
          광석 재련은 좀 다르게 생겼지?
          캐는 순간 광석을 녹여 버리는 마법이야.

          대장간 오토 씨가 질투하겠는걸!
      - left: |
          불은 부수는 데도 쓰지만
          만드는 데도 쓴다.

          학교를 다시 세우는 데도 불이 필요하겠지!
        right: |
          고급까지 왔다면 이제 진짜 화염 마법사야!
    commands:
      - "유저관리 {player} 마법조건 주기 incandescent_break"
      - "유저관리 {player} 마법조건 주기 glass_firing"
  lesson_fire_secret:
    title: "세드릭의 비전 — 경기장의 불꽃"
    required-intelligence: 0
    pages:
      - left: |
          이건 내가 선수 시절 쓰던 기술이야!

          화염 채찍으로 상대를 휘감아 끌어오고,
        right: |
          불꽃 줄넘기로 발밑에 불고리를 퍼뜨린다!
          고리를 뛰어넘는 게 포인트야.

          — 실습: 줄넘기 백 번. 진짜로.
      - left: |
          수업 목록엔 없는 거니까
          우리끼리 비밀이다!
        right: |
          …사실 교감 선생님한테 들키면 잔소리 백 줄이거든!
    commands:
      - "유저관리 {player} 마법조건 주기 flame_lash"
      - "유저관리 {player} 마법조건 주기 cinder_skipring"
  lesson_water_1:
    title: "물 마법 기초 — 물방울 하나"
    required-intelligence: 0
    pages:
      - left: |
          물은 모양이 없지만
          어디로 흐를지는 마법사가 정할 수 있어.

          오늘은 물방울 하나를 탄환처럼 날려 볼 거야.
        right: |
          힘을 주면 물방울이 깨져.
          손끝을 부드럽게, 숨을 천천히.

          — 실습: 분수대 물방울 하나를 떠올려 세 번 쏘아 보기.
      - left: |
          잘했어! 처음엔 다들 얼굴에 물 맞는 거 알지?
        right: |
          스스로 깨닫는 게 제일 오래 남는단다.
          다음 수업에서 또 보자.
    commands:
      - "유저관리 {player} 마법조건 주기 water_bolt"
  lesson_water_2:
    title: "물 마법 중급 — 튀어 오르는 물방울"
    required-intelligence: 20
    pages:
      - left: |
          물방울은 부딪치면 튀어 오르지.
          그 튀는 힘을 다음 적에게 넘겨주는 거야.

          같은 적은 두 번 맞히지 않는다는 것만 기억해.
        right: |
          — 실습: 허수아비 네 개를 순서대로 맞히기.
          하나를 놓치면 물방울이 길을 잃어.
      - left: |
          이 마법은 예전 졸업생이 만든 거래.
          학교가 북적이던 시절에.
        right: |
          언젠가 너희도 새 마법을 만들 수 있을 거야.
    commands:
      - "유저관리 {player} 마법조건 주기 bouncing_droplet"
  lesson_water_3:
    title: "물 마법 고급 — 해일"
    required-intelligence: 40
    pages:
      - left: |
          작은 물방울이 모여 파도가 되듯
          작은 마법이 모여 큰 마법이 돼.

          해일은 앞을 쓸어 내고, 적을 밀어내.
        right: |
          큰 마법일수록 끝까지 침착해야 해.
          파도는 한 번 일으키면 되돌릴 수 없거든.

          — 실습: 항구 방파제에서 바다를 오래 바라보기.
      - left: |
          여기까지 온 학생은 정말 오랜만이야.
          …고마워.
        right: |
          넌 정말 훌륭한 마법사가 될 거야!
    commands:
      - "유저관리 {player} 마법조건 주기 tidal_wave"
  lesson_water_4:
    title: "물 마법 응용 — 물로 막기"
    required-intelligence: 50
    pages:
      - left: |
          물은 막을 때도 쓸 수 있어.
          물레 방패는 다음 근접 공격을 받아 흘리고
          공격한 상대를 옆으로 밀어내.
        right: |
          파문방벽은 앞에 물결의 벽을 세워
          날아오는 화살을 멈춰.

          — 실습: 분수대 물결이 퍼지는 모양을 손끝으로 따라 그려 보기.
      - left: |
          공격만 배우는 학생이 많지만
          지키는 법을 아는 마법사가 더 오래 살아남는단다.
        right: |
          다음엔 조금 더 깊이 들어가 볼까?
    commands:
      - "유저관리 {player} 마법조건 주기 waterwheel_shield"
      - "유저관리 {player} 마법조건 주기 ripple_guard"
  lesson_water_5:
    title: "물 마법 심화 — 흐름을 다루기"
    required-intelligence: 60
    pages:
      - left: |
          물방울 인계는 물방울을 지정한 곳까지 보내
          주변의 적을 가두고 잠시 띄워.

          접히는 수면은 바닥에 물막을 펼쳤다가
          책장처럼 반대편으로 넘기는 마법이야.
        right: |
          둘 다 '흐름'을 다루는 마법이야.
          물이 어디로 가고 싶은지 먼저 느껴 봐.

          — 실습: 항구의 밀물과 썰물 시간을 기록해 오기.
      - left: |
          이 수업까지 들은 학생은
          졸업생 명단에서도 몇 명 안 돼.
        right: |
          정말 자랑스러워!
    commands:
      - "유저관리 {player} 마법조건 주기 droplet_relay"
      - "유저관리 {player} 마법조건 주기 folding_tideplane"
  lesson_water_secret:
    title: "엘레나의 비전 — 만년빙옥"
    required-intelligence: 0
    pages:
      - left: |
          물이 멈추면 얼음이 되지.
          만년빙옥은 적을 얼음 속에 가두는 마법이야.

          움직임도, 공격도 잠시 멈춰.
        right: |
          하지만 얼음은 깨지기 마련이야.
          일정량의 피해를 받으면 풀려 버려.

          그 사이에 할 일을 먼저 생각해 두렴.
      - left: |
          이건 내가 학생 때 제일 좋아하던 마법이야.
          너한테라면 알려 줘도 괜찮을 것 같아서.
        right: |
          쉿, 다른 교수님들한텐 비밀!
    commands:
      - "유저관리 {player} 마법조건 주기 eternal_ice_prison"
  lesson_earth_1:
    title: "대지 마법 기초 — 돌멩이 줍기"
    required-intelligence: 0
    pages:
      - left: |
          흙은 느긋해~
          그래서 대지 마법도 서두르면 안 돼.

          조약돌 하나를 들어 보렴. 무게가 느껴지지?
        right: |
          그 무게를 그대로 던지는 게 조약돌 던지기.
          뾰족한 돌 조각을 골라 차례로 날리는 게 돌 고르기야.

          — 실습: 온실 뒤 자갈밭에서 제일 동그란 돌 찾기.
      - left: |
          어머, 벌써 다 했어?
          난 아직 차를 다 못 마셨는데~
        right: |
          다음 시간엔 벽을 세워 볼까?
    commands:
      - "유저관리 {player} 마법조건 주기 pebble_toss"
      - "유저관리 {player} 마법조건 주기 flint_sorting"
  lesson_earth_2:
    title: "대지 마법 중급 — 벽과 씨앗"
    required-intelligence: 20
    pages:
      - left: |
          석벽은 앞을 막는 돌벽이야.
          화살도, 몬스터도 잠깐은 멈춰.

          동면의 씨앗은 다 자란 작물만 쏙 거둬들이고~
        right: |
          이끼 입히기는 발밑 깊은 곳을 살펴보는 마법이야.
          어두운 생물군계가 있는지 이끼가 알려 줘.

          — 실습: 온실 화분 세 개 돌보기. 물은 내가 줄게~
      - left: |
          대지 마법은 싸움보다
          돌보는 데 더 많이 써.

          학교 텃밭도 예전엔 훨씬 넓었는데…
        right: |
          음~ 그래도 네가 있으니 다시 넓어질지도?
    commands:
      - "유저관리 {player} 마법조건 주기 stone_wall"
      - "유저관리 {player} 마법조건 주기 dormant_seed"
      - "유저관리 {player} 마법조건 주기 moss_coating"
  lesson_earth_3:
    title: "대지 마법 고급 — 흔들리는 땅"
    required-intelligence: 40
    pages:
      - left: |
          지진은 내 주변의 땅을 흔들어
          적에게 피해를 주는 마법이야.

          자재 치환은 흙이 적의 발을 붙잡게 하지. 보스는 안 붙잡혀~
        right: |
          땅을 흔들 땐 내 발밑부터 단단히!
          안 그러면 같이 넘어진다~

          — 실습: 한 발로 서서 열까지 세기.
      - left: |
          고급까지 왔네!
          축하 기념으로 황금 만드라고라 냄새 맡게 해 줄까?
        right: |
          …농담이야~ 그건 정말 귀하거든.
    commands:
      - "유저관리 {player} 마법조건 주기 earthquake"
      - "유저관리 {player} 마법조건 주기 material_exchange"
  lesson_earth_secret:
    title: "베르나의 비전 — 원초의 돌"
    required-intelligence: 0
    pages:
      - left: |
          이건 땅이 처음 생겼을 때의 돌 이야기야.

          작은 돌 조각을 모아 커다란 돌핵을 만들고,
          다시 쓰면 그걸 날려 보내.
        right: |
          모으는 데 시간이 걸리니까 서두르지 말고~
          흙은 언제나 느긋하니까.

          — 실습: 돌 조각을 하나씩 세면서 모으기.
      - left: |
          수업 목록엔 없는 거야.
          너랑 차를 많이 마셔서 알려 주는 거~
        right: |
          다음에도 놀러 와. 차는 내가 살게~
    commands:
      - "유저관리 {player} 마법조건 주기 primordial_stone"
  lesson_light_1:
    title: "빛 마법 기초 — 작은 등불"
    required-intelligence: 0
    pages:
      - left: |
          빛 마법은 가장 오래된 마법 중 하나다.
          대마법사도 처음엔 작은 치유부터 배웠다고 기록되어 있지.

          작은 치유는 나를 조금 회복한다.
        right: |
          동행 귀환은 길을 잃었을 때 마을로 돌아가는 마법.
          교화는 숲에서 짐승을 아는 하르바 교수에게 배우렴.

          — 실습: 상처 입은 몬스터를 해치지 않고 바라보기.
      - left: |
          잿빛 밤 이후, 이 학교는
          빛 마법으로 사람들을 지켰다.

          지금은 그 기록을 아는 사람도 적구나.
        right: |
          …조용히 읽고, 조용히 익히렴.
    commands:
      - "유저관리 {player} 마법조건 주기 minor_heal"
      - "유저관리 {player} 마법조건 주기 companion_return"
  lesson_light_2:
    title: "빛 마법 중급 — 지키는 빛"
    required-intelligence: 20
    pages:
      - left: |
          보호 결계는 날아오는 투사체를 흡수해
          보호막으로 바꾼다.

          기억의 등불은 마지막으로 쓰러진 곳을 비춘다.
          그 자리의 방향과 거리를 알려 주고,
          그곳에 빛기둥을 세우지.
        right: |
          쓰러진 자리에 두고 온 것을 찾으러 갈 때 쓰렴.
          지키는 빛은, 잃어버린 것을 되찾는 빛이기도 하다.

          — 실습: 도서관에서 잃어버린 책 한 권을 찾아보렴. …서두르지 말고.
      - left: |
          책을 함부로 다루는 사람은 싫다.
          하지만 너는 아니구나.
        right: |
          다음 수업에서 보자.
    commands:
      - "유저관리 {player} 마법조건 주기 protective_ward"
      - "유저관리 {player} 마법조건 주기 memory_lantern"
  lesson_light_3:
    title: "빛 마법 고급 — 치유의 화살"
    required-intelligence: 40
    pages:
      - left: |
          자비의 화살은 매우 빠른 치유의 화살이다.
          멀리 있는 동료를 살리는 빛.

          마력 예금은 마나를 물약 한 병으로 담아 두는 법이다.
        right: |
          옛 기록에 따르면 이 둘은
          잿빛 밤에 가장 많이 쓰였다고 한다.

          — 실습: 도서관 끝 책장의 '잿빛 밤 연대기'를 펼쳐 보렴.
      - left: |
          …여기까지 온 학생은 오랜만이구나.
        right: |
          도서관은 언제든 열려 있다.
    commands:
      - "유저관리 {player} 마법조건 주기 merciful_arrow"
      - "유저관리 {player} 마법조건 주기 mana_deposit"
  lesson_light_secret:
    title: "이솔데의 비전 — 성좌의 가호"
    required-intelligence: 0
    pages:
      - left: |
          별자리마다 이야기가 있다.
          그 이야기를 빌려 동료를 지키는 것이 성좌의 가호.

          나와 주변 동료에게 빠른 발걸음과 단단한 몸을 준다.
        right: |
          이 마법은 금서 목록 바로 옆 칸에 꽂혀 있던 것이다.
          아무에게나 알려 주지 않는다.

          — 실습: 오늘 밤 별을 하나 골라 이름을 붙여 보렴.
      - left: |
          너는 책을 아끼는 사람이니까.
        right: |
          …다른 학생들에게는 비밀이다.
    commands:
      - "유저관리 {player} 마법조건 주기 constellation_blessing"
  lesson_dark_1:
    title: "어둠 마법 기초 — 그림자 매듭"
    required-intelligence: 0
    pages:
      - left: |
          어둠 마법은 금지된 마법이 아니다.
          잘못 쓰는 사람이 있을 뿐이다.

          그림자 매듭은 가까운 몬스터 하나를 잠시 느리게 만든다.
        right: |
          그림자를 묶는 것은 상대의 발이 아니라 시간이다.
          그 시간을 어떻게 쓸지는 네 몫이다.

          — 실습: 해 질 녘, 자기 그림자를 끝까지 바라볼 것.
      - left: |
          노크세르 학생들을 의심하는 자들이 있다.
          어둠 마법을 제대로 가르치지 않은 학교의 책임이다.
        right: |
          …첫 수업은 여기까지.
    commands:
      - "유저관리 {player} 마법조건 주기 shadow_bind"
  lesson_dark_2:
    title: "어둠 마법 중급 — 생명의 무게"
    required-intelligence: 20
    pages:
      - left: |
          생명 갈취는 땅에 어둠을 펼쳐
          그 위의 적에게서 생명을 빼앗아 나를 회복한다.

          빼앗는 마법이라는 것을 잊지 마라.
        right: |
          이 마법을 남에게 겨누는 순간
          너는 이 학교의 학생이 아니다.

          — 실습: 지금 네가 지킬 사람 셋의 이름을 적을 것.
      - left: |
          칭찬은 하지 않겠다.
          …당연히 해야 할 것을 했을 뿐이니.
        right: |
          다음 수업에 늦지 말 것.
    commands:
      - "유저관리 {player} 마법조건 주기 life_siphon"
  lesson_dark_3:
    title: "어둠 마법 고급 — 밤의 사슬"
    required-intelligence: 40
    pages:
      - left: |
          밤의 사슬은 범위 안의 몬스터를 사슬로 묶어
          한 마리가 받은 피해를 나눠 갖게 한다.

          무리를 상대하는 마법이다.
        right: |
          이 학교는 한때 무리 지은 몬스터들로부터
          마을을 지켰다. 이 마법으로.

          — 실습: 교칙 해설서 3장을 읽고 요약할 것.
      - left: |
          …쓸 만하군.
        right: |
          학교의 이름에 걸맞게 쓰도록.
    commands:
      - "유저관리 {player} 마법조건 주기 night_chain"
  lesson_dark_4:
    title: "어둠 마법 응용 — 저주의 기초"
    required-intelligence: 50
    pages:
      - left: |
          저주는 상대를 약하게 만드는 기술이다.
          나약함의 저주는 적의 공격력과 지능을 잠시 낮추고
          회복 봉인은 적이 회복하지 못하게 막는다.
        right: |
          강한 적 앞에서는 내가 강해지는 것보다
          상대를 약하게 만드는 편이 빠를 때가 있다.

          — 실습: 교칙 해설서의 '금지된 행동' 장을 외워 올 것.
      - left: |
          저주는 반드시 돌아온다는 말이 있다.
          그 말을 잊지 않는 자만이 저주를 쓸 자격이 있다.
        right: |
          …다음 수업 준비를 하게.
    commands:
      - "유저관리 {player} 마법조건 주기 misfortune_whisper"
      - "유저관리 {player} 마법조건 주기 healing_seal"
  lesson_dark_5:
    title: "어둠 마법 심화 — 마음을 흔드는 어둠"
    required-intelligence: 60
    pages:
      - left: |
          마인드컨트롤은 일반 몬스터 하나를 잠시 조종해
          가까운 다른 몬스터를 공격하게 한다.
          보스에게는 통하지 않는다.
        right: |
          상처 회계는 먹물 덩어리를 날려
          맞은 적에게 무작위 저주 하나를 남긴다.

          — 실습: 지난 일주일 동안 했던 실수를 빠짐없이 적을 것.
      - left: |
          다른 존재의 마음을 움직이는 마법이다.
          사람에게 쓰려는 생각은 버리게.
        right: |
          …자네라면 괜찮겠지.
    commands:
      - "유저관리 {player} 마법조건 주기 discord"
      - "유저관리 {player} 마법조건 주기 wound_accounting"
  lesson_dark_secret:
    title: "그레고르의 비전 — 금서의 계약"
    required-intelligence: 0
    pages:
      - left: |
          이것은 금서에 적혀 있던 계약이다.
          최대 마나의 대부분을 바쳐
          잠시 동안 마나 회복을 체력 회복으로 바꾼다.
        right: |
          대가가 큰 마법은
          대가를 치를 각오가 된 자만 써야 한다.

          가르치는 이유는 하나다. 네가 그 각오를 보여 줬기 때문이다.
      - left: |
          교감으로서가 아니라
          한 사람의 마법사로서 알려 주는 것이다.
        right: |
          …이 학교를 다시 세우는 데 힘을 보태게.
    commands:
      - "유저관리 {player} 마법조건 주기 forbidden_contract"

  # ════════════════════════════════════════════════════════════════════════════════════════════════
  # 도서관·교실 책 (2026-10-26, 메모 #105, Claude 기획 · 오너 최종 검수 대기) — 기획표: docs/plans/library-books.md
  #   [마법]   = 닫으면 마법 발견 (commands). 플레이어당 평생 1번.
  #   [마법·대기] = 그 마법이 아직 MagicDiscovery manual-conditions.yml 에 없어서 commands 를 주석으로 꺼 둠.
  #               조건 파일에 등록한 뒤(library-books.md '대기 책 켜기') 주석을 풀고 /서버관리 새로고침 책.
  #               (명령이 없는 동안은 읽어도 기록이 남지 않으므로, 켠 뒤 다시 읽으면 정상 발견)
  #   [헛걸음] = 마법 없음. 글만.
  #   필요 지능 단계: 0 · 20 · 40 · 60 · 80 · 100  (전투 스펙 제안 대충 ≈26 · 적당 ≈100 · 한계 ≈122 기준)
  # ════════════════════════════════════════════════════════════════════════════════════════════════

  # ──────────────────────────── 3층 도서관 (library) ────────────────────────────

  # [헛걸음] 입구 안내 데스크 옆 책장
  library_guide:
    title: "대도서관 이용 안내"
    required-intelligence: 0
    pages:
      - left: |
          하나. 도서관에서는 작게 말한다.
          둘. 책 귀퉁이를 접지 않는다.
          셋. 음식은 카페테리아에서.
          넷. 빌린 책은 제자리에.
        right: |
          다섯. 책에서 마법을 깨쳤다면
          그것은 책이 준 것이니
          학교에 기증하는 것을 잊지 말 것.

          여섯. 사서가 조용히 하라고 하면
          정말로 조용히 할 것.
      - left: |
          서가 안내

          1층 서가 — 역사·학칙·기숙사
          끝 책장 — 잿빛 밤에 관한 기록
          안쪽 서가 — 원소 이론·정령학
          2층 — 천문·광학·시간·그림자
        right: |
          모든 책이 마법을 품고 있지는 않다.
          대부분은 그냥 좋은 책이다.

          그것으로 충분하다.

          — 사서 이솔데
  # [헛걸음] 끝 책장 (빛 고급 수업에서 이솔데가 펼쳐 보라고 한 책)
  ashen_night_chronicle:
    title: "잿빛 밤 연대기"
    required-intelligence: 0
    pages:
      - left: |
          백 년 전 그 밤, 하늘은 재로 덮였다.

          학교 기록관은 이렇게 적었다.
          "달이 회색으로 변하고,
          종탑의 종이 저절로 울렸다."
        right: |
          공식 기록에 따르면
          그날 밤의 원인은 마법사 모르디안이다.

          그는 금지된 의식으로 악마를 불러냈고,
          학교는 하룻밤 사이에 불길에 휩싸였다.
      - left: |
          대마법사는 홀로 그 악마 앞에 섰다.
          그리고 봉인했다.

          그 대가로 대마법사는 돌아오지 않았다.
          마을 광장의 동상은 그날을 기억하려 세운 것이다.
        right: |
          그 뒤로 학생 수는 해마다 줄었다.
          교수들은 떠났고, 기숙사는 비었다.

          그래도 학교는 문을 닫지 않았다.
          누군가는 남아서 불을 켜 두어야 했으니까.
      - left: |
          — 덧붙임 (다른 손글씨)

          잿빛 밤에 가장 많이 쓰인 마법은
          화려한 공격 마법이 아니었다.

          다친 사람을 살리고
          물약에 마나를 담아 나눠 주는 마법이었다.
        right: |
          싸운 사람만큼
          지킨 사람도 기억되어야 한다.
  # [헛걸음] 1층 서가 · 학칙 칸 (어둠 고급·응용 수업에서 그레고르가 읽어 오라고 한 책)
  school_rules_commentary:
    title: "차카데미아 교칙 해설서"
    required-intelligence: 0
    pages:
      - left: |
          제1장 입학
          학생은 네 기숙사 중 하나에 속한다.
          기숙사는 가족이다. 싸워도 가족이다.

          제2장 수업
          수업에 늦은 학생은 교수의 잔소리를 듣는다.
          잔소리는 교칙이 아니라 전통이다.
        right: |
          제3장 마법의 사용
          마법은 사람을 지키는 데 쓴다.
          학생은 다른 학생에게 마법을 겨누지 않는다.
          단, 결투장에서 서로 동의한 대련은 예외로 한다.

          해설: 이 장은 잿빛 밤 이후 가장 먼저 고쳐 쓴 장이다.
      - left: |
          제4장 금지된 행동
          하나. 허락 없이 금서를 펼치는 것.
          둘. 남의 기억이나 마음을 함부로 엿보는 것.
          셋. 저주를 장난으로 거는 것.
          넷. 숲의 생물을 이유 없이 해치는 것.
        right: |
          해설: 넷째 줄은 최근에 더해졌다.
          숲의 동물들이 난폭해진 뒤로
          학생들이 겁에 질려 먼저 공격하는 일이 늘었기 때문이다.

          "두려움이 칼을 먼저 뽑게 하지 마라."
          — 교감 그레고르
  # [헛걸음] 1층 서가 · 역사 칸
  founding_history:
    title: "차카데미아 설립사"
    required-intelligence: 0
    pages:
      - left: |
          차카데미아는 바다와 숲 사이,
          마나가 가장 맑게 흐르는 언덕 위에 세워졌다.

          처음 학생은 열두 명.
          교실은 하나, 교수는 셋이었다.
        right: |
          학생이 늘자 기숙사를 나누었다.
          불과 땅을 닮은 아이들은 아르케온,
          빛과 물을 닮은 아이들은 루미나,
          바람과 짐승을 닮은 아이들은 베스티아즈,
          어둠을 닮은 아이들은 노크세르.
      - left: |
          전성기에는 학생이 천 명을 넘었다고 한다.
          빗자루 시합이 열리는 날이면
          마을 전체가 운동장으로 몰려왔다.
        right: |
          지금 그 운동장에는 풀이 자란다.

          하지만 언덕은 그대로고,
          마나는 여전히 맑게 흐른다.
  # [헛걸음] 1층 서가 · 역사 칸 (공식 역사만)
  archmage_life:
    title: "대마법사 전기 (요약본)"
    required-intelligence: 20
    pages:
      - left: |
          대마법사는 바닷가 마을의 어부 집안에서 태어났다.
          열 살에 처음 마법을 깨쳤는데,
          그것은 그물에 걸린 물고기를 놓아주는 작은 바람이었다고 한다.
        right: |
          그는 차카데미아에서 공부했고,
          졸업한 뒤에도 떠나지 않고 교수가 되었다.
          학생들은 그를 "언제나 도서관에 있는 사람"이라고 불렀다.
      - left: |
          잿빛 밤, 그는 학교를 지키다 사라졌다.
          그가 남긴 것은 지팡이 하나와
          책상 위의 쓰다 만 편지뿐이었다.
        right: |
          편지의 마지막 줄은 이렇다.

          "내가 없어도 수업은 계속하게."

          이 요약본은 그 줄을 지키려고 만든 것이다.
  # [헛걸음] 1층 서가 · 기숙사 칸
  four_houses:
    title: "네 기숙사 이야기"
    required-intelligence: 0
    pages:
      - left: |
          아르케온 — 불과 땅
          고집이 세고 손이 빠르다.
          아침 식사를 제일 먼저 끝내는 기숙사.

          루미나 — 빛과 물
          조용하고 다정하다.
          시험 기간에 도서관 자리를 제일 먼저 맡는 기숙사.
        right: |
          베스티아즈 — 바람과 짐승
          밖에 나가 있는 시간이 제일 길다.
          동물 털이 옷에 제일 많이 붙어 있는 기숙사.

          노크세르 — 어둠
          오해를 제일 많이 받는다.
          그리고 제일 의리가 있다.
      - left: |
          어느 기숙사가 최고냐는 질문에
          옛 교장은 이렇게 답했다고 한다.

          "네 기숙사가 다 모인 식탁이 최고다."
        right: |
          (여백에 낙서)
          그래도 우리 기숙사가 최고다.
          — 누군가
  # [헛걸음] 안쪽 서가 · 원소 이론 칸
  six_elements:
    title: "여섯 원소 개론"
    required-intelligence: 20
    pages:
      - left: |
          바람은 밀고, 불은 태우고,
          물은 흐르고, 땅은 버틴다.
          빛은 지키고, 어둠은 묶는다.

          이것이 가장 오래된 원소 분류다.
        right: |
          물론 실제로는 훨씬 복잡하다.
          바람으로 지키는 마법도 있고,
          어둠으로 치유하는 마법도 있다.

          분류는 처음 배우는 사람을 위한 지도일 뿐이다.
      - left: |
          원소를 익히는 가장 확실한 길은
          그 원소를 다루는 교수에게 직접 배우는 것이다.

          바람 하르바, 물 엘레나, 대지 베르나,
          화염 세드릭, 빛 이솔데, 어둠 그레고르.
        right: |
          이 책은 그 길을 대신하지 않는다.
          다만 길이 몇 갈래인지 알려 줄 뿐이다.
  # [헛걸음] 안쪽 서가 · 원소 이론 칸 (지능 걸린 이론서 — 마법 없음)
  mana_circulation:
    title: "마나 순환 이론 개론"
    required-intelligence: 40
    pages:
      - left: |
          마나는 몸 안에서 멈추지 않는다.
          심장에서 손끝으로, 손끝에서 다시 심장으로.

          마법을 쓴다는 것은
          이 흐름의 일부를 바깥으로 내보내는 일이다.
        right: |
          흐름이 빠른 사람은 마나가 빨리 차고,
          그릇이 큰 사람은 오래 버틴다.
          둘은 다른 재능이다.

          대부분의 학생은 둘 중 하나만 가졌다.
          그래서 연습한다.
      - left: |
          제2장 순환의 막힘

          지나치게 긴장하면 흐름이 막힌다.
          시험 직전에 마법이 안 나가는 이유다.
          숨을 길게 쉬어라.
        right: |
          제3장 이후는 2권에 이어진다.

          (2권은 대출 중. 반납 예정일은 30년 전.)
  # [헛걸음] 안쪽 서가 · 원소 이론 칸
  spell_naming:
    title: "마법 이름 짓는 법"
    required-intelligence: 20
    pages:
      - left: |
          새 마법을 만들었다면 이름이 필요하다.

          규칙 하나. 소리 내어 부르기 쉬울 것.
          규칙 둘. 무슨 마법인지 짐작할 수 있을 것.
          규칙 셋. 자기 이름을 붙이지 말 것.
        right: |
          나쁜 예:
          "위대한 나의 첫 번째 불꽃"
          "그거"
          "엄청 센 바람 2"

          좋은 예:
          "잿불 덫", "바람 화살", "작은 치유"
      - left: |
          규칙 셋에 대해.

          자기 이름을 붙인 마법은
          대개 그 사람과 함께 잊힌다.
          모두가 부를 수 있는 이름이어야 오래 남는다.
        right: |
          이 책을 쓴 사람의 이름도
          아무도 기억하지 못한다.

          그래도 이 책은 남았다.
  # [헛걸음] 안쪽 서가 맨 아래 칸 (지능 60 — 겨우 읽어도 목록뿐)
  discarded_list:
    title: "폐기 도서 목록 (사본)"
    required-intelligence: 60
    pages:
      - left: |
          다음 책은 낡거나 젖어서 폐기한다.

          「빗자루 수리 입문」 — 곰팡이
          「바다 괴물 실록」 — 내용이 거짓
          「연애편지 잘 쓰는 법」 — 너무 많이 빌려 감
          「마법사의 정원 가꾸기」 — 표지 분실
        right: |
          「고양이와 대화하는 법」 — 고양이가 찢음
          「잿빛 밤 이전 시간표」 — 쓸모없음
          「요리 마법 백 가지」 — 실제로는 요리책
          「교수님 몰래 자는 법」 — 압수
      - left: |
          이 목록에 있는 책은 더 이상 없다.
          찾지 마세요.
        right: |
          …정말 없습니다.

          — 사서 이솔데
  # [헛걸음] 안쪽 서가 가장 높은 칸 (지능 100 — 제7권만 있음)
  structure_vol7:
    title: "고등 마법 구조론 제7권"
    required-intelligence: 100
    pages:
      - left: |
          제7권을 펼친 독자에게.

          이 권은 제1권부터 제6권까지의 내용을
          모두 안다고 가정하고 쓰였다.
        right: |
          제1권부터 제6권은
          잿빛 밤에 모두 불탔다.
      - left: |
          그러니 이 권의 내용은
          누구도 이해할 수 없을 것이다.

          저자인 나도 가끔 헷갈린다.
        right: |
          그래도 여기까지 펼칠 수 있었다면
          당신은 이미 훌륭한 마법사다.

          그걸로 됐다. 책을 덮어도 좋다.
  # [마법] far_touch 손길 너머 · 안쪽 서가 · 원소 이론 칸 옆 '기계' 칸
  mechanics_understanding:
    title: "기계에 대한 이해"
    required-intelligence: 20
    pages:
      - left: |
          레버는 단순하다.
          당기면 신호가 가고, 신호가 가면 문이 열린다.

          문제는 레버가 늘 손 닿는 곳에 있지 않다는 것이다.
        right: |
          예전 정비공들은 긴 막대를 썼다.
          마법사들은 다른 방법을 찾았다.

          바람에 손의 모양을 실어
          멀리 있는 레버를 '대신 당기는' 것.
      - left: |
          방법은 이렇다.

          레버나 장치를 똑바로 바라본다.
          거리는 서른 걸음 안쪽.
          손가락을 구부리듯 마나를 보내 손잡이를 감는다.
        right: |
          세게 당길 필요는 없다.
          레버는 원래 가볍다.

          기계를 이해한 마법사는
          손이 하나 더 생긴 것과 같다.
    commands:
      - "유저관리 {player} 마법조건 주기 far_touch"
  # [마법] flight 비행 · 안쪽 서가 · 바람 칸 (빗자루 사진이 붙은 두꺼운 기록철)
  flight_records:
    title: "비행 연구 기록"
    required-intelligence: 20
    pages:
      - left: |
          비행 연구 기록 — 첫 장

          사람은 날개가 없다.
          그래서 빗자루를 탄다.
          빗자루는 날개가 아니라 '길'이다.
        right: |
          빗자루 솔 끝에 마나를 흘려 넣으면
          빗자루는 바람 위에 눕는다.
          탄 사람은 그 위에 올라앉기만 하면 된다.

          중요한 건 무게 중심이다.
          앞으로 숙이면 나아가고, 뒤로 젖히면 멈춘다.
      - left: |
          자기 빗자루가 없는 학생은
          학교 연습용 빗자루를 잠깐 빌릴 수 있다.
          단, 연습용은 오래 날지 못한다.
        right: |
          처음 뜰 때는 무조건 낮게.
          지붕 높이를 넘지 말 것.

          — 비행 실습 담당 기록, 여백에 세드릭의 글씨:
          "높이 나는 것보다 잘 내리는 게 먼저야!"
    commands:
      - "유저관리 {player} 마법조건 주기 flight"
  # [마법] cauldron_fill 가마솥 채우기 · 안쪽 서가 · 연금 칸
  chemistry_basics:
    title: "화학 기초"
    required-intelligence: 0
    pages:
      - left: |
          모든 연금술은 물에서 시작한다.

          가마솥 하나, 깨끗한 물, 그리고 인내.
          이 셋이 없으면 아무것도 끓일 수 없다.
        right: |
          물을 길어 오는 게 귀찮다면
          공기 속 물기를 불러 모으는 방법이 있다.

          가마솥을 바라보고 손바닥을 아래로.
          이슬이 맺히듯 물이 한 칸씩 차오른다.
      - left: |
          단, 빈 가마솥을 처음부터 만들지는 못한다.
          이미 놓인 가마솥에 물을 더할 뿐이다.

          그리고 한 번에 한 칸씩이다. 서두르지 말 것.
        right: |
          다음 장부터는 재료의 성질을 다룬다.
          …다음 장은 누가 찢어 갔다.
    commands:
      - "유저관리 {player} 마법조건 주기 cauldron_fill"
  # [마법] wash_letters 글씨 씻기 · 입구 안내 데스크 아래 칸 (서기·필사 칸)
  scribe_eraser:
    title: "서기관의 지우개"
    required-intelligence: 0
    pages:
      - left: |
          서기관은 글씨를 많이 쓴다.
          그래서 틀리는 일도 많다.

          표지판에 잘못 쓴 글씨를 칼로 긁어내던 시절,
          한 서기관이 물을 떠올렸다.
        right: |
          글씨는 결국 먹물이고,
          먹물은 물에 풀린다.

          표지판을 바라보고 손끝으로 쓸어내리듯 마나를 보내면
          한 면의 글씨가 깨끗이 씻겨 나간다.
      - left: |
          주의.
          남의 표지판은 씻을 수 없다.
          고칠 권한이 있는 표지판만.

          마법도 예의를 지킨다.
        right: |
          잘못 쓴 글씨는 지우면 된다.
          잘못 한 말은… 그건 마법으로도 안 된다.
    commands:
      - "유저관리 {player} 마법조건 주기 wash_letters"
  # [마법] heat_recovery 열량 보존 · 안쪽 서가 · 화염 칸
  energy_treatise:
    title: "에너지에 관하여"
    required-intelligence: 80
    pages:
      - left: |
          불은 사라지지 않는다.
          다만 다른 곳으로 옮겨 갈 뿐이다.

          장작의 열은 공기로, 공기의 열은 손으로.
        right: |
          그렇다면 이미 타오르는 불에서
          열을 거꾸로 끌어올 수도 있지 않을까.

          이 책은 그 질문에서 시작한다.
      - left: |
          가까운 불 — 모닥불, 화로, 타는 블록 —
          열 걸음 안쪽에 불이 있어야 한다.

          불을 향해 손을 펴고, 숨을 들이쉬듯 열을 당긴다.
          들어온 열은 상처를 메우는 데 쓰인다.
        right: |
          불이 없으면 아무것도 끌어올 수 없다.
          열량은 보존될 뿐, 생겨나지 않는다.

          그것이 이 마법의 이름이고, 한계다.
    commands:
      - "유저관리 {player} 마법조건 주기 heat_recovery"
  # [마법] firebird_hunt 불새 · 안쪽 서가 · 신화 칸
  three_firebirds:
    title: "불사조, 주작, 가루다"
    required-intelligence: 60
    pages:
      - left: |
          세 나라에 세 마리의 불새가 있다.

          서쪽의 불사조는 재에서 다시 태어나고,
          남쪽의 주작은 여름을 지키며,
          동쪽의 가루다는 뱀을 사냥한다.
        right: |
          생김새도 이야기도 다르지만
          셋에게는 공통점이 하나 있다.

          모두 '앞으로 날아가며 태운다'는 것.
      - left: |
          옛 화염 마법사들은 이 공통점을 빌렸다.

          불꽃으로 새의 형상을 빚고,
          앞을 향해 날려 보내는 것.
          새가 지나간 자리의 적은 함께 불탄다.
        right: |
          형상이 흐트러지면 그냥 불덩이가 된다.
          날개 끝까지 떠올려라.

          불새는 사냥하는 새다.
          머뭇거리는 새는 없다.
    commands:
      - "유저관리 {player} 마법조건 주기 firebird_hunt"
  # [마법] blue_bonfire 푸른 화톳불 · 안쪽 서가 · 화염 칸
  flame_colors:
    title: "불꽃의 색과 마력"
    required-intelligence: 60
    pages:
      - left: |
          붉은 불은 뜨겁다.
          노란 불은 밝다.
          푸른 불은… 차가워 보인다.

          그러나 실제로는 푸른 불이 가장 뜨겁다.
        right: |
          옛 연구자들은 푸른 불꽃 곁에서
          마나가 더 빨리 차오른다는 것을 알아냈다.

          불의 열이 아니라
          불의 '색'이 마나를 데우는 것이다.
      - left: |
          푸른 화톳불을 피우는 법.

          발밑에 장작을 쌓듯 마나를 모으고
          불꽃의 색을 푸르게 떠올린다.
          한 번 피우면 일 분쯤 타오른다.
        right: |
          화톳불 곁, 열 걸음 안에 선 사람은
          마나가 조금 더 빨리 돌아온다.

          동료와 함께 쓰는 불이다.
          혼자 쬐기엔 아까운 불이다.
    commands:
      - "유저관리 {player} 마법조건 주기 blue_bonfire"
  # [마법] water_elemental 운디네 · 안쪽 서가 · 정령학 칸 (자물쇠 달린 서류철)
  spirit_contract_water:
    title: "정령계약서 - 수"
    required-intelligence: 80
    pages:
      - left: |
          계약서 — 물의 정령

          물의 정령은 이름을 묻지 않는다.
          대신 물을 어떻게 대했는지를 본다.
        right: |
          강을 더럽히지 않은 자,
          목마른 이에게 물을 나눈 자,
          비를 원망하지 않은 자.

          정령은 그런 이의 부름에 답한다.
      - left: |
          부르는 법.

          손을 모아 물을 뜨듯 마나를 담고
          정령의 모양을 떠올린다.
          정령은 잠시 곁에 머물며 물 탄환으로 너를 돕는다.
        right: |
          정령은 오래 머물지 않는다.
          계약은 '잠시 함께'다.

          떠날 때는 고맙다고 말해라.
          다음에 또 와 줄 것이다.
    commands:
      - "유저관리 {player} 마법조건 주기 water_elemental"
  # [마법] earth_elemental 그놈 · 안쪽 서가 · 정령학 칸 (수 계약서 바로 옆)
  spirit_contract_earth:
    title: "정령계약서 - 지"
    required-intelligence: 80
    pages:
      - left: |
          계약서 — 땅의 정령

          땅의 정령은 느리다.
          부르면 대답하는 데 한참 걸린다.
          대신 한 번 오면 쉽게 물러서지 않는다.
        right: |
          정령은 흙으로 된 큰 몸을 빌려 나타난다.
          학생들은 그것을 '그놈'이라 부른다.
          정령은 그 이름을 별로 좋아하지 않는다.
      - left: |
          부르는 법.

          무릎을 굽혀 땅에 손을 대고
          흙 속의 무게를 위로 끌어올린다.
          골렘은 너를 따라다니며 가까운 적을 친다.
        right: |
          정령이 머무는 시간은 일 분 남짓.
          그 사이 너는 혼자가 아니다.

          돌아갈 때 흙을 밟아 다져 주어라.
          그것이 땅의 인사다.
    commands:
      - "유저관리 {player} 마법조건 주기 earth_elemental"
  # [마법] forest_throne 숲의 왕좌 · 안쪽 서가 · 정령학 칸 맨 위 (두꺼운 가죽 장정)
  immovable_forest_king:
    title: "움직이지 않는 숲의 왕"
    required-intelligence: 100
    pages:
      - left: |
          옛날 옛적, 숲에 왕이 있었다.
          왕은 한 번도 왕좌에서 일어나지 않았다.

          사람들은 왕이 게으르다고 했다.
        right: |
          어느 날 도적 떼가 숲에 들어왔다.
          왕은 여전히 일어나지 않았다.
          대신 왕좌 둘레의 땅에서 뿌리가 솟았다.

          도적들은 숲을 빠져나가지 못했다.
      - left: |
          이 이야기를 빌린 대지 마법이 있다.

          제자리에 뿌리를 내리듯 버티고 서면
          주위 여섯 걸음 안에 뿌리가 차례로 솟아
          다가오는 적을 친다.
        right: |
          대가는 하나.
          왕좌에 앉은 동안 너는 움직일 수 없다.

          왕이 일어나지 않은 건 게을러서가 아니었다.
          일어나는 순간 숲이 무너지기 때문이었다.
    commands:
      - "유저관리 {player} 마법조건 주기 forest_throne"
  # [마법] flame_leap 블레이즈 킥 · 안쪽 서가 · 화염 칸 맨 아래, 다른 책들 뒤에 숨겨진 얇은 책 (책장 뒷면 쪽에 연결 권장)
  body_art_training:
    title: "체술 강화"
    required-intelligence: 60
    pages:
      - left: |
          마법사는 몸이 약하다는 편견이 있다.
          대부분 맞는 말이다.

          이 책은 그 '대부분'에서 벗어나고 싶은 사람을 위한 것이다.
        right: |
          몸 안의 열을 다리로 모은다.
          발끝이 뜨거워질 때까지.

          그리고 몸을 한 바퀴 돌리며 차올린다.
          불꽃이 다리를 따라 원을 그린다.
      - left: |
          처음에는 넘어진다.
          두 번째도 넘어진다.

          열 번째쯤에는 넘어지면서도 불꽃이 나간다.
        right: |
          (여백) 세드릭 교수님이 이 책을 숨긴 것 같다.
          교수님 선수 시절 기술이랑 비슷하다.
          …아니면 반대로, 교수님이 이 책을 보고 배운 걸까?
    commands:
      - "유저관리 {player} 마법조건 주기 flame_leap"
  # [마법] void_maw 공허의 입 · 안쪽 서가 가장 깊은 칸, 표지가 없는 검은 책 (숨겨진 책)
  hungry_void:
    title: "텅 빈 것의 식욕"
    required-intelligence: 100
    pages:
      - left: |
          어둠에도 배고픔이 있다.

          빛이 닿지 않는 바닥 아래,
          비어 있는 자리는 늘 무언가를 채우고 싶어 한다.
        right: |
          이 책은 그 배고픔을 잠깐 빌리는 법을 적는다.
          빌린다. 부리는 것이 아니다.

          조준한 자리의 바닥을 바라보고
          그 아래의 빈 곳을 부른다.
      - left: |
          빈 곳의 입이 열리면
          그 자리에 선 적을 삼켰다가 뱉는다.

          입은 오래 열려 있지 않는다.
          배고픔은 금방 다른 곳으로 간다.
        right: |
          이 책을 다 읽었다면
          조용히 제자리에 꽂아 두어라.

          배고픈 것은 배고픈 곳에 두는 법이다.
    commands:
      - "유저관리 {player} 마법조건 주기 void_maw"

  # ──────────────────────────── 도서관 2층 (library_upper) ────────────────────────────

  # [헛걸음] 천문 칸
  star_atlas:
    title: "별자리 도감"
    required-intelligence: 20
    pages:
      - left: |
          봄 — 물고기자리 그물별
          어부들이 출항 날을 고를 때 본다.

          여름 — 불새자리
          꼬리가 길고 붉다.
        right: |
          가을 — 낫자리
          추수할 때 동쪽 하늘에 뜬다.

          겨울 — 늑대자리
          가장 밝은 별이 늑대의 눈이다.
      - left: |
          별에는 마법이 없다.
          적어도 이 책에 따르면.

          별은 그냥 길을 알려 준다.
        right: |
          길을 잃었다면 위를 봐라.
          대부분은 그것으로 충분하다.
  # [헛걸음] 신문·기록 칸
  old_newsletter:
    title: "학교 소식지 묶음 (90년 전)"
    required-intelligence: 0
    pages:
      - left: |
          [1면] 빗자루 시합 결승, 베스티아즈 우승!
          아르케온 주장 "다음엔 이긴다"

          [2면] 카페테리아 새 메뉴 '감자 세 번 구이'
          학생 만족도 조사 결과 "그냥 감자"
        right: |
          [3면] 신입생 모집
          올해 신입생 열한 명. 작년보다 넷 줄었다.
          교장 "숫자보다 마음이 중요하다"

          [4면] 분실물 — 노크세르 기숙사 고양이.
          찾으면 기숙사 사감에게.
      - left: |
          [다음 호 1면]
          고양이 찾았다. 도서관 2층에서 자고 있었다.
        right: |
          그 고양이의 후손이
          지금도 도서관 2층에서 자고 있다는 소문이 있다.
  # [헛걸음] 신화·민담 칸 (용 이야기 — 마법 없음)
  dragon_tales:
    title: "용에 관한 민담"
    required-intelligence: 40
    pages:
      - left: |
          바닷가 마을 노인들은 말한다.
          옛날 이 언덕에는 용이 살았다고.

          용이 숨을 쉬면 바다가 끓고,
          날개를 펴면 해가 가려졌다고.
        right: |
          그 용은 어디로 갔을까.

          어떤 이는 바다 밑에서 잔다고 하고,
          어떤 이는 산이 되었다고 하고,
          어떤 이는 처음부터 없었다고 한다.
      - left: |
          이 책을 쓴 사람은 세 번째에 가깝다.
          다만 이렇게 덧붙였다.

          "그래도 용 이야기를 할 때
          아이들 눈이 반짝인다면, 그걸로 됐다."
        right: |
          (여백) 용 마법 같은 건 안 나옵니다.
          세 번 읽었어요. — 실망한 학생
  # [헛걸음] 연금 역사 칸
  alchemy_history:
    title: "연금술의 역사"
    required-intelligence: 40
    pages:
      - left: |
          연금술은 금을 만들려다 시작되었다.
          그리고 금을 만들지 못해서 발전했다.

          실패한 연금술사들이 남긴 부산물이
          오늘날의 물약 대부분이다.
        right: |
          가장 유명한 실패는
          '영원히 식지 않는 수프'다.
          수프는 정말로 식지 않았다.
          문제는 너무 뜨거워서 아무도 못 먹었다는 것.
      - left: |
          차카데미아의 연금술 공방은
          잿빛 밤에도 불이 꺼지지 않은 몇 안 되는 곳이다.

          그날 밤 그곳에서 만든 물약이
          많은 사람을 살렸다.
        right: |
          연금술의 역사는 실패의 역사다.
          그래서 계속 실험한다.
  # [헛걸음] 마법진 칸 (지능 60 — 도형만 잔뜩)
  circle_geometry:
    title: "마법진 기하학"
    required-intelligence: 60
    pages:
      - left: |
          원 하나: 경계.
          원 둘: 안과 밖.
          삼각형: 방향.
          사각형: 고정.
        right: |
          이 네 가지를 겹치면
          대부분의 마법진을 읽을 수 있다.

          그릴 수 있다는 뜻은 아니다.
      - left: |
          연습 문제 1.
          원 안에 삼각형을 그리되
          꼭짓점이 원에 닿지 않게 하시오.
        right: |
          연습 문제 2.
          연습 문제 1의 답을 교수에게 보여 주고
          한숨을 듣지 않고 돌아오시오.
  # [헛걸음] 일기 칸
  third_year_diary:
    title: "어느 3학년의 일기"
    required-intelligence: 0
    pages:
      - left: |
          오늘 엘레나 교수님이 내 이름을 기억했다.
          학생이 적어서 그런 거라고 친구가 말했다.
          그래도 좋았다.
        right: |
          오늘 숲에서 여우를 봤다.
          예전엔 사람을 보면 도망갔는데
          오늘은 이를 드러냈다.
          요즘 숲이 이상하다.
      - left: |
          오늘 도서관에서 마법을 깨쳤다는 선배 이야기를 들었다.
          나도 하루 종일 책을 펼쳐 봤다.
          …아무것도 안 일어났다.
        right: |
          이솔데 선생님 말로는
          "맞는 책을 끝까지 읽어야 한다"고 한다.
          어느 게 맞는 책인지는 안 알려 주신다.

          내일 또 와야지.
  # [헛걸음] 연구 노트 칸 (지능 60 — 실패한 연구)
  invisible_cloak_notes:
    title: "실패한 연구 노트 — 투명 망토"
    required-intelligence: 60
    pages:
      - left: |
          목표: 입으면 보이지 않는 망토.

          1차 실험: 망토가 투명해졌다.
          나는 그대로 보였다.
        right: |
          2차 실험: 나도 투명해졌다.
          망토만 보였다. 날아다니는 망토 소문의 원인.

          3차 실험: 둘 다 투명해졌다.
          그런데 신발이 보였다.
      - left: |
          4차 실험: 신발도 투명해졌다.
          아무도 나를 찾지 못했다.
          점심을 놓쳤다.
        right: |
          결론: 연구 중단.
          보이지 않는 건 생각보다 외롭다.
  # [헛걸음] 생물 칸
  forest_bestiary:
    title: "숲 생물 관찰기"
    required-intelligence: 20
    pages:
      - left: |
          여우 — 영리하다. 겁이 많다.
          멧돼지 — 고집이 세다. 먼저 덤비지 않는다.
          늑대 — 무리를 지어 다닌다. 사람을 피한다.
        right: |
          (나중에 덧붙인 글씨)
          위 내용은 일 년 전까지의 기록이다.
          요즘은 셋 다 먼저 덤빈다.
          이유는 모른다.
      - left: |
          관찰자 메모.

          난폭해진 동물들은 눈빛이 다르다.
          화가 났다기보다 겁에 질린 눈이다.
        right: |
          무엇이 숲을 겁먹게 했을까.

          그걸 알아내기 전까지
          숲에는 혼자 들어가지 말 것.
  # [마법] season_sense 계절 예보 · 천문 칸 (별자리 도감 옆)
  season_almanac:
    title: "계절 관측 일지"
    required-intelligence: 0
    pages:
      - left: |
          계절은 갑자기 바뀌지 않는다.
          바뀌기 며칠 전부터 바람이 먼저 안다.

          봄바람은 비린내, 여름 바람은 풀 냄새,
          가을바람은 마른 잎, 겨울바람은 쇠 냄새.
        right: |
          관측자는 매일 같은 시각에 바람을 맡고
          냄새를 일지에 적었다.

          삼 년이 지나자
          일지를 보지 않고도 다음 계절을 맞혔다.
      - left: |
          그 감각을 마법으로 줄인 것이 계절 예보다.

          눈을 감고 바람을 한 번 들이쉰다.
          지금 계절과 다음 계절까지 남은 시간,
          그리고 다가오는 회오리 소식이 떠오른다.
        right: |
          예보는 예보일 뿐이다.
          그래도 우산을 챙길 시간은 벌어 준다.
    commands:
      - "유저관리 {player} 마법조건 주기 season_sense"
  # [마법] mirror_tune 반사 조율 · 광학 칸
  mirrors_and_light:
    title: "거울과 빛의 길"
    required-intelligence: 20
    pages:
      - left: |
          빛은 곧게 간다.
          거울을 만나면 꺾인다.

          옛 던전을 지은 마법사들은
          이 단순한 사실로 문을 잠갔다.
        right: |
          빛이 정해진 자리에 닿아야 열리는 문.
          그 길을 만드는 건 거울의 각도다.

          문제는 거울이 늘 손 닿는 곳에 있지 않다는 것.
      - left: |
          반사 조율.
          멀리 있는 거울이나 회전 다이얼을 바라보고
          손목을 돌리듯 마나를 보내면
          한 번에 직각만큼 돈다.
        right: |
          네 번 돌리면 제자리.
          급하면 틀린다. 빛이 어디로 가는지 먼저 봐라.
    commands:
      - "유저관리 {player} 마법조건 주기 mirror_tune"
  # [마법] prism_tint 프리즘 물들이기 · 광학 칸 (거울과 빛의 길 옆)
  prism_studies:
    title: "프리즘 연구"
    required-intelligence: 20
    pages:
      - left: |
          흰빛 안에는 모든 색이 들어 있다.
          프리즘은 그것을 꺼내 보여 줄 뿐이다.

          그렇다면 프리즘이 고르는 색을
          마법사가 정할 수도 있다.
        right: |
          프리즘을 바라보고 마음속으로 색을 하나 고른다.
          프리즘의 색이 바뀌고,
          그 프리즘을 지나는 빛줄기도 그 색으로 물든다.
      - left: |
          색은 정해진 순서로 돈다.
          지나쳤다면 몸을 웅크리고 다시 써라.
          반대 순서로 돌아간다.
        right: |
          옛 던전의 색 문은
          맞는 색의 빛이 닿아야 열린다.

          무슨 색인지는 대개 문 근처에 적혀 있다.
          잘 읽어라.
    commands:
      - "유저관리 {player} 마법조건 주기 prism_tint"
  # [마법] light_beam 빛줄기 · 광학 칸 맨 위
  straight_light:
    title: "곧은 빛에 관한 소론"
    required-intelligence: 40
    pages:
      - left: |
          거울도 프리즘도
          빛이 없으면 쓸모가 없다.

          이 소론은 그 빛을
          손바닥에서 직접 쏘는 법을 다룬다.
        right: |
          손을 앞으로 뻗고
          햇살을 한 점으로 모으듯 마나를 모은다.
          삼 초 동안 곧은 빛줄기가 뻗어 나간다.
      - left: |
          빛줄기는 거울에서 꺾이고,
          프리즘을 지나면 그 색으로 물든다.

          거울과 프리즘과 빛줄기.
          셋이 모이면 잠긴 길이 열린다.
        right: |
          쏘는 동안에는 천천히 움직여라.
          빛은 곧고, 손은 흔들린다.
    commands:
      - "유저관리 {player} 마법조건 주기 light_beam"
  # [마법] rewind 되감기 · 시간 칸
  turning_back:
    title: "되돌리는 장치에 관하여"
    required-intelligence: 40
    pages:
      - left: |
          시간은 되돌릴 수 없다.
          그러나 장치의 '상태'는 되돌릴 수 있다.

          방금 내려간 레버, 방금 닫힌 문,
          방금 바뀐 무언가.
        right: |
          장치는 자기가 바로 전에 어땠는지 기억한다.
          아주 잠깐, 일 분쯤.

          그 기억을 꺼내 장치에게 돌려주는 것이 되감기다.
      - left: |
          바뀐 장치를 바라보고
          시곗바늘을 거꾸로 돌리는 모습을 떠올린다.
          장치가 바로 전 상태로 돌아간다.
        right: |
          일 분이 지나면 장치는 잊는다.
          실수했다면 빨리 되감아라.

          사람의 기억은 그보다 오래가니
          사람에게 한 실수는 사과로 되감아라.
    commands:
      - "유저관리 {player} 마법조건 주기 rewind"
  # [마법] shadow_double 그림자 분신 · 그림자 칸
  shadow_twin:
    title: "그림자는 두 번 선다"
    required-intelligence: 60
    pages:
      - left: |
          그림자는 늘 나를 따라온다.
          그런데 내가 떠난 뒤에도
          그림자가 잠깐 남아 있다면?
        right: |
          노크세르의 옛 학생들은 이것을 놀이로 했다.
          자리를 뜨면서 그림자를 그 자리에 '두고' 가는 것.

          술래는 늘 그림자를 쫓다가 속았다.
      - left: |
          선 자리에서 마나를 발밑에 떨어뜨리면
          그림자 분신이 그 자리에 남는다.

          여덟을 세기 전에 한 번 더 쓰면
          분신이 있는 곳으로 돌아온다.
        right: |
          싸움에서는 도망칠 자리를 미리 정해 두는 마법이다.

          돌아올 곳이 있다는 건
          언제나 든든한 일이다.
    commands:
      - "유저관리 {player} 마법조건 주기 shadow_double"
  # [마법] loosen_grasp 손아귀 풀기 · 그림자 칸
  loosened_grip:
    title: "손아귀를 푸는 법"
    required-intelligence: 60
    pages:
      - left: |
          무기를 든 손은 단단하다.
          그러나 손가락 하나만 풀어도
          그 손은 더 이상 무기를 쥐지 못한다.
        right: |
          그림자를 상대의 손끝에 감아
          손가락 하나를 살짝 당긴다.

          사람이라면 손에 든 것을 다른 것으로 바꿔 쥐고,
          몬스터라면 잠시 기술을 쓰지 못한다.
      - left: |
          결투장에서 이 마법을 처음 맞은 학생은
          빵을 든 채 상대에게 달려들었다고 한다.
        right: |
          웃을 일이지만
          실전에서는 웃지 못한다.

          상대가 무엇을 들었는지 먼저 봐라.
    commands:
      - "유저관리 {player} 마법조건 주기 loosen_grasp"
  # [마법] warning_thread 경고의 실 · 그림자 칸 맨 위
  warning_thread_manual:
    title: "경계를 긋는 실"
    required-intelligence: 80
    pages:
      - left: |
          노크세르 기숙사 문지기들은
          검 대신 실을 들었다.

          실로 원을 그어 두면
          그 안에 들어온 자는 밖으로 나가지 못했다.
        right: |
          대상 주위에 그림자 실을 둘러 결계를 친다.
          일곱을 셀 동안
          결계 안의 적은 밖으로 나가지 못한다.
      - left: |
          도망치는 적을 붙잡는 마법이다.
          동시에 동료가 싸울 자리를 만들어 주는 마법이다.
        right: |
          실은 가늘다.
          가는 것으로 큰 것을 묶으려면
          마음이 단단해야 한다.
    commands:
      - "유저관리 {player} 마법조건 주기 warning_thread"

  # ──────────────────────────── 강의실 1 (classroom_1) — 바람 교실 ────────────────────────────

  # [헛걸음] 교탁 옆 책장
  wind_textbook:
    title: "바람학 교과서 제1권"
    required-intelligence: 20
    pages:
      - left: |
          제1과 바람은 어디서 오는가
          높은 곳에서 낮은 곳으로.
          차가운 곳에서 따뜻한 곳으로.
        right: |
          제2과 바람을 느끼는 법
          손가락에 침을 묻혀 들어 본다.
          (하르바 교수 메모: 실습 시간에 침 묻히지 말 것)
      - left: |
          제3과 이후는 하르바 교수의 수업에서 다룬다.

          이 교과서는 수업을 대신하지 않는다.
          교수의 매도 이 교과서를 읽지 않는다.
        right: |
          (여백) 매가 이 페이지를 쪼아 놨다.
  # [헛걸음] 뒤쪽 사물함 위
  ungraded_homework:
    title: "채점 안 된 숙제 더미"
    required-intelligence: 0
    pages:
      - left: |
          숙제: 바람 화살을 쏠 때 주의할 점 세 가지.

          학생 A: 1. 사람 쪽으로 쏘지 않는다. 2. 창문을 닫는다.
          3. 교수님 매 쪽으로 쏘지 않는다.
        right: |
          학생 B: 1. 모아서 쏜다. 2. 기다린다. 3. 기다린다.
          (하르바: 좋다.)

          학생 C: 잘 모르겠습니다.
          (하르바: 솔직해서 좋다. 다시 해 와라.)
      - left: |
          숙제 더미 맨 아래에
          백 년 전 날짜가 적힌 숙제가 하나 있다.
        right: |
          "주의할 점: 친구를 두고 도망가지 않는다."

          채점 칸은 비어 있다.
  # [마법] pressure_press 윈드 프레스 · 교탁 뒤 책장 (발견 조건 변경 제안: 앵무새 공격 → 이 책)
  falling_mechanics:
    title: "떨어지는 것들의 역학"
    required-intelligence: 40
    pages:
      - left: |
          하늘에 떠 있는 것은 언젠가 떨어진다.
          새도, 박쥐도, 날아오른 적도.

          바람 마법사는 그 '언젠가'를 '지금'으로 바꾼다.
        right: |
          공중에 뜬 대상을 바라보고
          손바닥으로 위에서 아래로 누른다.
          머리 위의 공기가 무거워져 대상을 땅으로 끌어내린다.
      - left: |
          땅 위에 선 적에게는 듣지 않는다.
          이미 떨어져 있으니까.

          날아서 도망치는 적, 높이 뛰어오른 적에게 써라.
        right: |
          (여백) 하르바의 매가 이 마법을 제일 싫어한다.
          매 근처에서는 절대 쓰지 말 것.
    commands:
      - "유저관리 {player} 마법조건 주기 pressure_press"
  # [마법] pressure_rupture 토네이도 스핀 · 교탁 뒤 책장 (발견 조건 변경 제안: 제자리 10바퀴 → 이 책)
  whirlwind_axis:
    title: "회오리의 축"
    required-intelligence: 60
    pages:
      - left: |
          회오리에는 가운데가 있다.
          가운데는 고요하고, 바깥은 사납다.

          마법사가 그 가운데에 서면
          회오리는 마법사를 축으로 돈다.
        right: |
          두 발을 단단히 딛고
          몸을 감싸듯 바람을 한 바퀴 둘러라.
          주위 세 걸음 안의 적이 밀려나며 바람에 베인다.
      - left: |
          둘러싸였을 때 쓰는 마법이다.
          혼자 숲에 들어갔다가 돌아온 학생들이
          가장 먼저 배우고 싶어 했던 마법.
        right: |
          축이 흔들리면 회오리도 흩어진다.
          발밑부터 굳혀라.
    commands:
      - "유저관리 {player} 마법조건 주기 pressure_rupture"

  # ──────────────────────────── 강의실 2 (classroom_2) — 장치·대지 실습실 ────────────────────────────

  # [헛걸음] 교탁 서랍 옆 책장 (지능 40)
  lecture_prep_notes:
    title: "어느 교수의 수업 준비 노트"
    required-intelligence: 40
    pages:
      - left: |
          월요일 수업 준비.
          학생 수: 셋. 의자 서른 개 중 셋.
          나머지 의자는 치울까 하다가 그만두었다.
        right: |
          언젠가 다시 채워질지도 모르니까.

          오늘 할 것:
          1. 출석 (금방 끝남)
          2. 지난 시간 복습
          3. 실습 — 다치지 않게
      - left: |
          메모.
          학생 하나가 질문을 많이 한다.
          귀찮다. 그리고 반갑다.
        right: |
          질문하는 학생이 있는 동안은
          이 학교가 아직 학교다.
  # [마법] conduit_turn 도관 회전 · 실습 교재 칸
  conduit_design:
    title: "마력 도관 설계"
    required-intelligence: 20
    pages:
      - left: |
          마력 도관은 마나가 흐르는 길이다.
          물길처럼, 길이 꺾이면 흐름도 꺾인다.

          옛 던전의 문 대부분은
          도관의 방향만 바꾸면 열린다.
        right: |
          도관 하나를 바라보고
          손가락으로 반의반 바퀴를 그린다.
          도관이 직각으로 돌아 마나가 다른 길로 흐른다.
      - left: |
          설계도를 먼저 봐라.
          마나가 어디서 와서 어디로 가야 하는지.

          무작정 돌리면 처음으로 되돌아올 뿐이다.
        right: |
          네 번 돌리면 원래대로.
          그래서 서두를 필요가 없다.
    commands:
      - "유저관리 {player} 마법조건 주기 conduit_turn"
  # [마법] stone_weight 무게추 · 실습 교재 칸 (마력 도관 설계 옆)
  weight_and_balance:
    title: "무게와 균형"
    required-intelligence: 20
    pages:
      - left: |
          압력판은 무게를 기다린다.
          사람이든 상자든 돌이든.

          그런데 사람이 계속 서 있을 수는 없다.
          다른 곳에도 가야 하니까.
        right: |
          대지 마법사는 대신 무게추를 놓는다.

          압력판을 바라보고
          돌을 떨어뜨리듯 마나를 아래로 내던진다.
          마법 무게추가 떨어져 판을 누른다.
      - left: |
          무게추는 판을 누른 뒤 부서진다.
          한 번에 한 번.

          판이 계속 눌려 있어야 하는 장치라면
          다른 방법을 찾아라.
        right: |
          (베르나 교수 메모)
          무게추로 친구 발을 누르지 마~
          진짜로 아파~
    commands:
      - "유저관리 {player} 마법조건 주기 stone_weight"

  # ──────────────────────────── 강의실 3 (classroom_3) — 화염 실습실 ────────────────────────────

  # [헛걸음] 문 옆 벽 책장
  fire_safety_rules:
    title: "화염 실습실 안전 수칙"
    required-intelligence: 0
    pages:
      - left: |
          1. 머리카락은 묶는다.
          2. 소매는 걷는다.
          3. 물 양동이는 늘 문 옆에.
          4. 불이 붙으면 구른다. 마법 쓰지 말고 구른다.
        right: |
          5. 세드릭 교수가 "괜찮아!"라고 해도
             괜찮지 않을 수 있다.
          6. 5번은 교감 선생님이 직접 추가함.
      - left: |
          작년 사고 기록.
          눈썹 화상 3건. 앞머리 화상 2건.
          커튼 1건.
        right: |
          커튼은 아직 교체하지 못했다.
          예산이 없다.
  # [마법] steam_ignition 증기 점화 · 실습 교재 칸
  steam_primer:
    title: "증기 기관 입문"
    required-intelligence: 40
    pages:
      - left: |
          물을 끓이면 김이 난다.
          김을 가두면 힘이 된다.

          옛 장인들은 이 힘으로 문을 열고
          승강기를 움직였다.
        right: |
          증기 밸브는 불을 기다린다.
          밸브를 바라보고 손끝의 불씨를 안으로 밀어 넣으면
          압력이 차오른다.
      - left: |
          압력이 찬 밸브는
          이어진 장치에 마력 신호를 보낸다.

          그다음 일은 장치가 한다.
        right: |
          밸브가 차가우면 몇 번이고 다시 넣어라.
          증기는 서두르지 않는다.
    commands:
      - "유저관리 {player} 마법조건 주기 steam_ignition"
  # [마법] thawing_heat 해빙의 열기 · 실습 교재 칸 (증기 기관 입문 옆)
  thawing_notes:
    title: "얼음을 녹이는 열"
    required-intelligence: 40
    pages:
      - left: |
          불로 얼음을 녹이는 것은 쉽다.
          얼음을 '천천히' 녹이는 것은 어렵다.

          봉인된 얼음은 급하게 녹이면 다시 얼어붙는다.
        right: |
          얼음 봉인을 바라보고
          손을 대듯 가까이에서 열기를 불어넣어라.
          셋을 셀 동안 끊기지 않으면 녹는다.
      - left: |
          그 사이 누가 너를 때리면
          열기가 흩어져 얼음은 다시 굳는다.

          동료에게 등을 맡겨라.
        right: |
          (여백) 엘레나 교수님은 이 마법을 싫어하신다.
          "애써 얼린 걸 왜 녹여!"
    commands:
      - "유저관리 {player} 마법조건 주기 thawing_heat"

  # ──────────────────────────── 연금술 공방 (alchemy_workshop) ────────────────────────────

  # [헛걸음] 약초 선반 옆
  herb_guide:
    title: "약초 도감"
    required-intelligence: 0
    pages:
      - left: |
          달빛 이끼 — 밤에만 빛난다. 맛은 없다.
          불꽃 고추 — 맵다. 정말로 맵다.
          잠꽃 — 냄새만 맡아도 졸리다. 수업 중 금지.
        right: |
          황금 만드라고라 — 귀하다. 뽑을 때 운다.
          귀마개 필수.
          (베르나: 우리 온실 것은 노래를 부른다~)
      - left: |
          약초는 먹기 전에 반드시
          베르나 교수에게 물어볼 것.
        right: |
          작년에 물어보지 않은 학생은
          사흘 동안 딸꾹질을 했다.
  # [헛걸음] 작업대 아래 (지능 20)
  potion_accidents:
    title: "폭발한 물약 기록"
    required-intelligence: 20
    pages:
      - left: |
          3월 2일 — 치유 물약에 불꽃 고추를 넣음.
          치유는 됐다. 혀가 사흘 동안 얼얼했다.
        right: |
          3월 9일 — 잠꽃과 커피콩을 함께 끓임.
          마신 학생이 잠든 채로 춤을 췄다.

          3월 16일 — 가마솥이 날아감.
          원인 불명. 가마솥은 아직 못 찾았다.
      - left: |
          교훈.
          재료는 한 번에 하나씩 바꿔라.
          그래야 무엇 때문에 터졌는지 안다.
        right: |
          (아래 다른 글씨)
          가마솥 찾았습니다. 대강당 지붕 위.
  # [마법] insight_flash 영감의 섬광 · 작업대 위 노트 꽂이
  alchemist_insight:
    title: "연금술사의 번뜩임"
    required-intelligence: 40
    pages:
      - left: |
          연금술사는 대부분의 시간을 틀린다.
          그러다 어느 순간
          "무언가 반응할 것 같다"는 느낌이 온다.
        right: |
          그 느낌을 붙잡아 두는 마법이 있다.

          눈을 감고 머리 위에 작은 섬광을 켠다.
          다음 실험 한 번은
          넣은 재료 중 몇 가지가 맞았는지 숫자로 떠오른다.
      - left: |
          무엇이 맞았는지는 알려 주지 않는다.
          몇 개가 맞았는지만.

          나머지는 연금술사의 몫이다.
        right: |
          영감은 답이 아니라 방향이다.
          방향만 알아도 실패가 절반으로 준다.
    commands:
      - "유저관리 {player} 마법조건 주기 insight_flash"

  # ──────────────────────────── 대강당 (great_hall) ────────────────────────────

  # [헛걸음] 단상 옆 책장
  ceremony_program:
    title: "입학식 식순"
    required-intelligence: 0
    pages:
      - left: |
          1. 신입생 입장
          2. 교장 인사 (교장 부재 시 교감)
          3. 기숙사 배정
          4. 교가 제창
        right: |
          5. 재학생 환영 (재학생이 있을 경우)
          6. 만찬

          (메모) 올해도 2번은 교감 선생님.
          5번은… 몇 명이라도 꼭 부르자.
      - left: |
          교가 가사 1절
          "바다와 숲 사이 언덕 위에
          꺼지지 않는 등불 하나"
        right: |
          2절은 아무도 기억하지 못한다.
  # [헛걸음] 뒤쪽 벽 책장
  alumni_roll:
    title: "역대 졸업생 명부"
    required-intelligence: 0
    pages:
      - left: |
          명부는 두껍다.
          앞쪽은 이름이 빽빽하고,
          뒤로 갈수록 듬성듬성하다.
        right: |
          잿빛 밤이 있던 해의 칸에는
          이름 대신 짧은 줄이 많이 그어져 있다.
          졸업하지 못한 학생들이다.
      - left: |
          가장 최근 페이지는 거의 비어 있다.

          맨 아래 칸 하나에 연필로
          누군가 작게 써 두었다.
        right: |
          "다음은 너."
  # [마법] statue_wake 석상 깨우기 · 단상 뒤 책장 (발견 조건 변경 제안: 밤에 갑옷 거치대 앞 30초 → 이 책)
  statue_keeper_log:
    title: "석상 관리 일지"
    required-intelligence: 20
    pages:
      - left: |
          학교의 석상들은 잠들어 있다.
          완전히 돌이 된 것은 아니다.

          옛 관리인들은 석상을 잠깐 깨워
          고개를 돌리게 하는 법을 알았다.
        right: |
          석상을 바라보고
          어깨를 두드리듯 마나를 가볍게 보낸다.
          석상이 시선을 오른쪽으로 직각만큼 돌린다.
      - left: |
          석상이 바라보는 쪽에
          길이 열리는 장치가 있다고 한다.
          네 번 깨우면 원래 자리로 돌아온다.
        right: |
          관리인 브루노의 메모:
          "깨우고 나면 꼭 인사할 것.
          석상도 기분이라는 게 있다."
    commands:
      - "유저관리 {player} 마법조건 주기 statue_wake"

  # ──────────────────────────── 기숙사 입구 (dorm_entrances) · 2층 기숙사 홀 (dorm_hall) ────────────────────────────

  # [헛걸음] 기숙사 입구 게시판 옆 책장
  dorm_guide:
    title: "기숙사 생활 안내"
    required-intelligence: 0
    pages:
      - left: |
          소등은 밤 열한 시.
          소등 뒤 복도에서 마법 연습 금지.
          (특히 빛 마법. 다 깬다.)
        right: |
          세탁은 목요일.
          빨래에 물 마법 쓰지 말 것.
          지난번에 복도가 강이 되었다.
      - left: |
          다른 기숙사 방에 들어갈 때는 노크.
          노크세르 방은 두 번 노크.
        right: |
          왜 두 번이냐고 묻지 마라.
          전통이다.
  # [마법] sealing_thread 봉인의 실 · 기숙사 입구 사감 책상 옆 (발견 조건 변경 제안: 내 상자 100번 열고 닫기 → 이 책)
  locksmith_secret:
    title: "자물쇠 장인의 비밀"
    required-intelligence: 40
    pages:
      - left: |
          기숙사에는 자물쇠가 없다.
          백 년 전에는 있었다.
          그때 사감들이 쓰던 방법이 이 책에 적혀 있다.
        right: |
          직접 단 문이나 직접 놓은 상자 하나를 바라보고
          손가락으로 실을 감듯 그림자를 둘러라.
          봉인이 걸리면 다른 사람은 열지 못한다.
      - left: |
          같은 곳에 한 번 더 쓰면 봉인이 풀린다.
          남의 문에는 걸 수 없다.

          자물쇠는 지키는 것이지
          가두는 것이 아니다.
        right: |
          (사감 메모)
          간식 상자 봉인 금지.
          룸메이트가 운다.
    commands:
      - "유저관리 {player} 마법조건 주기 sealing_thread"
  # [헛걸음] 2층 기숙사 홀 소파 옆 책장
  unsent_letter:
    title: "전하지 못한 편지"
    required-intelligence: 0
    pages:
      - left: |
          너에게.

          빗자루 시합 끝나고 하려던 말이 있었어.
          그런데 네가 우승해서
          다들 너한테 몰려가는 바람에 못 했어.
        right: |
          그다음 날 하려고 했는데
          네가 감기에 걸렸고,
          그다음 날은 내가 걸렸어.
      - left: |
          그래서 편지로 써.
          …라고 쓰고 나니
          이것도 못 줄 것 같아.
        right: |
          그러니까 여기 꽂아 둘게.
          언젠가 네가 이 책장을 정리하다 찾기를.

          (편지 아래쪽 다른 글씨) 찾았어. 나도야.
  # [헛걸음] 2층 기숙사 홀 벽난로 옆 책장
  dorm_ghost_stories:
    title: "기숙사 괴담 모음"
    required-intelligence: 0
    pages:
      - left: |
          괴담 하나. 2층 복도 끝 거울.
          밤에 비춰 보면 내가 한 박자 늦게 움직인다.
          (확인 결과: 거울이 기울어져 있음)
        right: |
          괴담 둘. 도서관 2층의 고양이.
          백 년째 같은 고양이가 잔다.
          (확인 결과: 후손임. 아마도.)
      - left: |
          괴담 셋. 소등 뒤 들리는 발소리.
          (확인 결과: 관리인 브루노 아저씨의 순찰)
        right: |
          괴담 넷. 아직 확인하지 못함.

          …확인하러 간 사람이
          아침 먹으러 안 나왔다.
          (다음 날 덧붙임: 늦잠이었음)

  # ──────────────────────────── 지하 강화소 (forge_basement) ────────────────────────────

  # [헛걸음] 계산대 뒤 선반
  otto_ledger:
    title: "오토의 장부"
    required-intelligence: 0
    pages:
      - left: |
          월 — 마법봉 강화 두 건. 하나 실패.
          실패한 손님이 울었다. 같이 울 뻔했다.
        right: |
          화 — 토비가 망치를 발에 떨어뜨림.
          오늘 장사 끝.

          수 — 아무도 안 옴. 모루 닦음.
      - left: |
          목 — 학생 하나가 와서
          "강화 확률 올리는 비법 있어요?" 물음.
        right: |
          대답: 있다. 집중해서 두드리는 거다.
          학생 표정: 실망.

          …진짜 그게 비법인데.
  # [헛걸음·보류] arcane_imprint 마력 각인 · 모루 옆 공구 선반 위 (오너 결정 2026-10-26: 이 책은 연결 안 함 — 마력 각인은 "모루로 도구에 이름 10번" 자동 조건 그대로)
  arcane_imprint_manual:
    title: "도구에 새기는 마력"
    required-intelligence: 80
    pages:
      - left: |
          좋은 대장장이는 도구에 이름을 새긴다.
          마법 대장장이는 이름 대신 마력을 새긴다.

          새겨진 마력은 잠깐 동안
          도구를 더 넓게 쓰게 해 준다.
        right: |
          곡괭이를 손에 쥐고
          손잡이부터 날 끝까지 마력을 한 줄로 그어라.
          이십을 셀 동안 한 번에 세 칸 넓이씩 캐낸다.
      - left: |
          곡괭이에만 새겨진다.
          도끼나 삽은 마력을 받아 주지 않는다.
          (이유는 오토도 모른다.)
        right: |
          각인이 끝나면 곡괭이는 원래대로.
          마력은 빌려 쓰는 것이다.
    # commands:   # 연결 안 함 (오너 결정 2026-10-26). 켜려면 manual-conditions.yml 에 arcane_imprint 를 넣고 discoveries.yml 자동 조건을 뺀 뒤 주석 풀기
    #   - "유저관리 {player} 마법조건 주기 arcane_imprint"

  # ──────────────────────────── 카페테리아 (cafeteria) · 병원 (hospital) ────────────────────────────

  # [헛걸음] 카페테리아 배식대 옆 선반
  dorothea_recipes:
    title: "도로테아의 요리 노트"
    required-intelligence: 0
    pages:
      - left: |
          감자 수프
          감자 셋, 양파 하나, 소금 조금.
          오래 끓인다. 사랑을 넣는다.
        right: |
          (여백) 사랑은 어디서 사요? — 학생
          (아래) 직접 만들어야지. — 도로테아
      - left: |
          생선 구이
          항구에서 셀마가 골라 준 생선.
          껍질부터 굽는다. 뒤집는 건 한 번만.
        right: |
          학생들이 많을 때는 생선 백 마리를 구웠다.
          요즘은 열 마리.

          그래도 맛은 똑같이 낸다.
  # [헛걸음] 카페테리아 창가 자리 의자 위 (도서관에서 누가 들고 나온 책)
  lost_library_book:
    title: "누군가 두고 간 도서관 책"
    required-intelligence: 0
    pages:
      - left: |
          책 안쪽에 대출 카드가 꽂혀 있다.

          반납 기한: 지난주.
          대출자 이름: 지워져 있음.
        right: |
          내용은 평범한 시집이다.

          "바람이 불면 창을 열고
          비가 오면 창을 닫는다
          그것이 내가 아는 마법의 전부"
      - left: |
          시집 마지막 장에 메모.

          "이솔데 선생님께 혼나기 전에
          누가 대신 반납해 주세요."
        right: |
          …이 책을 도서관에 가져다주면
          사서가 아주 조금 웃을지도 모른다.
  # [헛걸음] 병원 대기 의자 옆 책장
  first_aid_guide:
    title: "응급 처치 안내서"
    required-intelligence: 0
    pages:
      - left: |
          다쳤을 때 순서.
          1. 안전한 곳으로 피한다.
          2. 숨을 고른다.
          3. 물약이 있으면 마신다.
          4. 없으면 병원으로.
        right: |
          치유 마법을 아는 친구가 있다면
          3번과 4번 사이에 부른다.

          치유 마법은 수업에서 제대로 배울 것.
          혼자 연습하다 더 다친 학생이 많다.
      - left: |
          — 힐데의 한마디
          "숲에서 다쳐 오는 학생이 늘었어요.
          혼자 다니지 마세요."
        right: |
          "그리고 다쳤으면 숨기지 말고 오세요.
          숨기다 커진 상처가 제일 아파요."

  # ──────────────────────────── 낚시 용품점 · 아티팩트 연구소 · 1층 로비 ────────────────────────────

  # [헛걸음] 낚시 용품점 카운터 옆 선반
  sea_fishing_primer:
    title: "바다 낚시 입문"
    required-intelligence: 0
    pages:
      - left: |
          낚시는 기다림이다.
          기다림이 지루하면 낚시가 아니라 벌이다.

          찌가 흔들리면 바로 당기지 말고 한 박자.
        right: |
          줄이 팽팽해지면 풀어 주고,
          느슨해지면 감는다.
          물고기와 줄다리기를 하는 게 아니라 춤을 추는 거다.
      - left: |
          비 오는 날은 물고기가 잘 문다.
          춥고 젖는 건 덤이다.
        right: |
          (여백, 큼직한 글씨)
          모르면 올레 아저씨한테 물어봐라.
          부두에 있다.
  # [헛걸음] 아티팩트 연구소 진열장 옆 서류철 (지능 40)
  artifact_inventory:
    title: "연구소 소장품 목록"
    required-intelligence: 40
    pages:
      - left: |
          소장품 1 — 금이 간 수정구. 아무것도 안 보임.
          소장품 2 — 녹슨 열쇠. 맞는 자물쇠 없음.
          소장품 3 — 멈춘 회중시계. 고치면 다시 멈춤.
        right: |
          소장품 4 — 깃털 하나. 출처 불명.
          소장품 5 — 빈 상자. 원래 뭐가 들어 있었는지 모름.
      - left: |
          연구 메모.
          대부분 쓸모없다.
          그런데 버리지 못하겠다.
        right: |
          쓸모없어 보이는 것도
          누군가 언젠가 쓸모를 찾아낼지 모른다.
          연구소는 그 '언젠가'를 위해 있다.
  # [헛걸음] 1층 로비 안내 책상 위
  visitor_log:
    title: "방문자 명부"
    required-intelligence: 0
    pages:
      - left: |
          오늘의 방문자:
          빵집 그레타 — 교수 휴게실 빵 배달
          어부 올레 — 생선 배달, 수다 30분
          (빈칸)
        right: |
          오늘의 방문자:
          꽃집 로사 — 대강당 꽃 교체
          (빈칸)
          (빈칸)
      - left: |
          명부 맨 끝에 오래된 글씨.

          "학교를 다시 보러 왔다.
          여전히 등불이 켜져 있어 다행이다.
          — 옛 졸업생"
        right: |
          이 명부에 이름을 쓰고 싶다면
          관리인 브루노에게 말하면 된다.
          펜은 늘 책상 위에 있다.
