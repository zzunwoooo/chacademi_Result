# 기숙사 점수 홀로그램 (오픈 전 메모 #106, 오너 2026-10-26 "게시판 없이 단순하게 홀로그램 느낌으로")
# 고친 뒤: /서버관리 새로고침 기숙사판   (servers 를 바꿔 켜고/끄는 것만 서버 재시작이 필요해요)
#
# 정한 자리에 클라(MagicCodex 모드)가 떠 있는 글씨를 그려요. 블록·게시판·엔티티 없음.
#   제목 "기숙사 점수" + 순위대로 4줄 (순위 · 기숙사 이름 · 점수), 1위 줄은 금빛.
# 자리 정하기 (OP): 홀로그램을 둘 곳에 서서
#   /컨텐츠관리 기숙사판 추가 <이름> [동|서|남|북]
#     서 있는 곳, 눈높이보다 조금 위. 같은 이름이면 옮겨요.
#     판은 카메라를 따라 돌지 않고 고른 방향(90도 단위)을 바라봐요 = 그쪽에 선 사람이 읽어요. 뒤에서는 안 보여요.
#     방향을 안 적으면 내가 바라보는 방향을 가장 가까운 90도로 맞춰요.
#   /컨텐츠관리 기숙사판 삭제 <이름>
#   /컨텐츠관리 기숙사판 목록
# 점수는 기존 학교 기록(/기숙사관리 점수, 공유 DB)을 그대로 보여 줘요. 이 기능은 DB 를 따로 읽지 않아요.

# false = 이 기능 전체 끄기
enabled: true

# 켤 서버 (travel.yml 의 server-id). 여기 없는 서버는 아무 일도 하지 않아요. 비우면 [] 모든 서버.
servers:
  - school

# 클라가 그리는 거리 (블록, 8~96)
view-distance: 48

# 점수가 바뀌었는지 확인하는 주기 (초, 5~300). 바뀐 경우에만 보내요.
refresh-seconds: 20

# 추가할 때 눈높이보다 얼마나 위에 둘지 (블록). 홀로그램 가운데 기준
height-above-eyes: 0.9

# 정한 자리 (명령으로 바꾸는 걸 권장). 이름: {world, x, y, z, facing: 동|서|남|북}
boards: {}
