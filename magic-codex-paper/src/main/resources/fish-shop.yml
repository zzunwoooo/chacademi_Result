# 물고기 판매소 (2026-10-20). 아공간 수조의 물고기를 등급별로 한 번에 판다. 잠긴 종류는 크기·등급 상관없이 팔지 않는다.
# 바꾼 뒤 /서버관리 새로고침 물고기판매소 (명령으로 바꾸면 바로 저장·적용). 이 파일은 공유 DB로 학교·야생에 같이 적용됨.
# NPC 연결만 서버마다 따로 (fish-shop-npcs.yml).
title: "물고기 판매소"
role: "물고기 매입상"
# Citizens NPC 이름이 없을 때 쓰는 이름
npc-name: "물고기 매입상"
# 왼쪽 일러스트: textures/gui/dialogue/<portrait>.png (기존 상점 초상과 같은 방식). 비우면 이름표만
portrait: ""

# 물고기 한 마리 값 = 기본가 × 크기 보정 (반올림)
#   기본가 = prices.fish 에 있으면 그 값, 없으면 등급 기본가 (특수 조건 물고기는 × special-bonus)
#   크기 보정 = 그 물고기의 최소 크기일 때 size-min, 최대 크기일 때 size-max, 사이는 비례
#   특수 조건 = 날씨 지정·보름달/그믐달·지하·높은 곳/깊은 땅속
prices:
  grade:
    일반: 80
    고급: 400
    유일: 2000
    전설: 10000
  size-min: 0.7
  size-max: 1.5
  special-bonus: 1.3
  # 물고기별 기본가 덮어쓰기 (예: fish_200: 50000)
  fish: {}
