# 사용 아이템 3종 (2026-10-26 오너 결정) — 고친 뒤: /서버관리 새로고침 사용아이템   (서버마다)
# 아이템은 운영 ItemsAdder 에 있는 것 (아래 id). 우클릭해서 씀. 쓸 수 없는 상황이면 알림만 뜨고 아이템은 그대로.

# ── 변색종 변경권: 들고 야생 몹을 우클릭 → 그 몹이 변색종(색만 다른 버전)이 됨, 1개 사용 ──
# 관리자 명령 /월드관리 변색종 지정 과 같은 방식 (변색종 모델 ca_xxx_s 로 바꾸고 이름 노란색·반짝임). 교화하면 변색종 펫.
# 거절(아이템 그대로): 변색종 모델이 없는 몹 · 이미 변색종 · 보스 · 교화 중 · 교화 대상에 등록 안 된 몹 · 아래 막힌 세계
shiny-change:
  item: "item:shiny_change"
  # 바라보는 몹을 찾는 거리 (칸, 2~16)
  range: 6
  # 이 이름으로 시작하는 MythicMobs 몹만 (야생 커스텀 몹). 비우면 CA_Wild_
  mythic-prefixes: [CA_Wild_]
  # 못 쓰는 세계 이름 (예: 경기장·튜토리얼)
  excluded-worlds: []

# ── 마법 힌트권: 우클릭 → 아직 안 배운 마법 하나의 힌트, 1개 사용 (남은 마법이 없으면 거절) ──
# 연출: MagicCodex 모드 = 「운명의 타로」 창 (카드 3장 중 하나 고르기 → 뒤집기 → 별·힌트, 고르기는 연출이고 결과는 서버가 미리 정함).
#       모드 없는 접속 = 예전처럼 깨달음의 빛(221)의 빛의 책 + 알림·채팅. 힌트 후보는 깨달음의 빛과 같음(궁극·미구현 제외).
# 별 확률(타로 기획 #65): 3성 = 발견 조건 그대로, 2성 = NPC·깨달음의 빛 수준 목격담(애매하게), 1성 = 원소만(막연하게)
# 오너 확인 필요: 디자인 명세는 3성 10% 만 확정, 1성·2성 나누기는 미정 → 지금 값 50/40 은 예전 기획 #65 값 그대로 (비율이라 합이 100 이 아니어도 됨)
spell-hint:
  item: "item:spell_hint"
  # false = 타로 창을 끄고 모두 예전 연출(빛의 책 + 알림)로
  tarot-ui: true
  stars:
    1: 50
    2: 40
    3: 10

# ── 재화 주머니: 우클릭 → 돈(G) 지급, 1개 사용, 결과 알림 + 운영 기록 "돈" ──
# 구간을 weight 비율로 고르고 그 안에서 min~max 사이 금액 (round-to 단위로 내림).
# 대박 = 30분 노동치 15,000 G (오너 결정 2026-10-26). 나머지 구간은 같은 비율.
# 상점 가격 기준 = 물고기 판매소 등급가 80/400/2,000/10,000 (기본 장비 얕은 물 1마리 평균 약 250 G).
# 평균 약 1,945 G. 마지막 구간이 "대박" 표시(효과음 하나 더).
money-pouch:
  item: "item:money_pouch"
  round-to: 10
  tiers:
    - {name: "동전 몇 닢", weight: 45, min: 250, max: 750}
    - {name: "묵직한 동전", weight: 30, min: 750, max: 2000}
    - {name: "은화 한 줌", weight: 17, min: 2000, max: 5000}
    - {name: "금화 주머니", weight: 6.5, min: 5000, max: 10000}
    - {name: "대박! 30분 노동치", weight: 1.5, min: 15000, max: 15000}
