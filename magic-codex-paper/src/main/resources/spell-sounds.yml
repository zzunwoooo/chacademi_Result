      - {sound: entity.blaze.shoot, volume: 0.5, pitch: 0.8, delay: 2}
      - {sound: block.fire.ambient, volume: 0.6, pitch: 0.8, delay: 5}
      - {sound: block.blastfurnace.fire_crackle, volume: 0.5, pitch: 0.9, delay: 9}
