    cast:
      - {sound: entity.goat.long_jump, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: entity.breeze.jump, volume: 0.5, pitch: 0.9, delay: 1}
      - {sound: entity.phantom.swoop, volume: 0.4, pitch: 1.1, delay: 4}
    hit:
      - {sound: item.mace.smash_ground, volume: 0.6, pitch: 1.1, delay: 0}
      - {sound: entity.ravager.roar, volume: 0.45, pitch: 1.3, delay: 2}
      - {sound: entity.wind_charge.wind_burst, volume: 0.4, pitch: 0.9, delay: 2}

  # ===================== fire (37) =====================
  hearth_touch:          # 033 손끝의 화로 — 손끝에 작은 불이 켜지고 지글 구워지는 소리, 조용한 생활 마법
    cast:
      - {sound: item.flintandsteel.use, volume: 0.4, pitch: 1.5, delay: 0}
      - {sound: block.furnace.fire_crackle, volume: 0.5, pitch: 1.3, delay: 2}
      - {sound: block.lava.pop, volume: 0.3, pitch: 1.6, delay: 8}
      - {sound: entity.experience_orb.pickup, volume: 0.25, pitch: 1.4, delay: 12}

  ember_bolt:            # 034 파이어 볼 — 가볍고 짧은 블레이즈 발사음 + 불씨 반짝, 연사해도 거슬리지 않게
    cast:
      - {sound: entity.blaze.shoot, volume: 0.5, pitch: 1.5, delay: 0}
      - {sound: block.fire.ambient, volume: 0.35, pitch: 1.8, delay: 1}
    hit:
      - {sound: entity.generic.burn, volume: 0.5, pitch: 1.3, delay: 0}
      - {sound: block.lava.pop, volume: 0.35, pitch: 1.5, delay: 1}

  rekindle:              # 035 다시 타오르는 불 — 부싯돌 딸깍 + 촛불이 화르륵 살아나는 작은 소리
    cast:
      - {sound: item.flintandsteel.use, volume: 0.45, pitch: 1.2, delay: 0}
      - {sound: block.candle.ambient, volume: 0.4, pitch: 1.4, delay: 2}
    hit:
      - {sound: block.fire.ambient, volume: 0.4, pitch: 1.3, delay: 0}
      - {sound: block.amethyst_block.chime, volume: 0.25, pitch: 1.8, delay: 2}

  flame_forging:         # 036 불꽃 단조 — 화염이 감싸고 모루 망치질 두 번, 마무리 담금질 쉭
    cast:
      - {sound: block.blastfurnace.fire_crackle, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: block.anvil.use, volume: 0.45, pitch: 1.3, delay: 4}
      - {sound: block.smithing_table.use, volume: 0.5, pitch: 1.1, delay: 10}
      - {sound: block.lava.extinguish, volume: 0.35, pitch: 1.4, delay: 16}

  ember_trap:            # 037 잿불 덫 — 바닥에 철컥 깔리는 덫 + 은은히 타는 잿불, 발동 시 펑
    cast:
      - {sound: block.iron_trapdoor.close, volume: 0.45, pitch: 1.4, delay: 0}
      - {sound: block.campfire.crackle, volume: 0.5, pitch: 1.2, delay: 2}
      - {sound: block.respawn_anchor.charge, volume: 0.3, pitch: 1.7, delay: 6}
    hit:
      - {sound: entity.dragon_fireball.explode, volume: 0.45, pitch: 1.5, delay: 0}
