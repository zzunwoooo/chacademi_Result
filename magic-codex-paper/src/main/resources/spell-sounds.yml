    end:
      - {sound: block.sweet_berry_bush.break, volume: 0.4, pitch: 0.9, delay: 0}
      - {sound: block.azalea_leaves.fall, volume: 0.3, pitch: 1.1, delay: 3}

  vein_fracture:         # 110 광맥 파쇄 — 광맥을 따라 연쇄로 쩍쩍 갈라지는 파쇄음
