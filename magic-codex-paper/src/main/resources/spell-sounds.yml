      - {sound: entity.illusioner.mirror_move, volume: 0.5, pitch: 1.3, delay: 6}
      - {sound: block.note_block.chime, volume: 0.4, pitch: 1.8, delay: 8}

  flawless_moment:         # 146 무결의 순간 — 시간이 멈춘 듯 맑게 울리는 종 + 금빛 갑주
