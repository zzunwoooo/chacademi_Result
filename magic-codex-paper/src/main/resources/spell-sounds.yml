      - {sound: block.amethyst_block.resonate, volume: 0.35, pitch: 1.4, delay: 8}

  firebird_hunt:         # 059 불새 — 불새가 날갯짓하며 울부짖고 전방으로 쏘아져 나감, 휩쓸며 화염 타격
    cast:
      - {sound: entity.phantom.flap, volume: 0.6, pitch: 1.2, delay: 0}
