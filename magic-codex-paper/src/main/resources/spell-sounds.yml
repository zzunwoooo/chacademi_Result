    cast:
      - {sound: item.flintandsteel.use, volume: 0.45, pitch: 0.8, delay: 0}
      - {sound: block.soul_sand.place, volume: 0.4, pitch: 1.0, delay: 2}
      - {sound: block.campfire.crackle, volume: 0.55, pitch: 0.9, delay: 4}
      - {sound: block.beacon.activate, volume: 0.4, pitch: 1.5, delay: 10}
    end:
      - {sound: particle.soul_escape, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: block.fire.extinguish, volume: 0.35, pitch: 0.8, delay: 2}
      - {sound: block.beacon.deactivate, volume: 0.35, pitch: 1.4, delay: 6}

  crimson_breath:        # 064 드래곤 브레스 — 긴 영창 속 용의 으르렁과 숨 들이킴이 쌓이다 거대한 화염 숨결이 뿜어짐
    cast:
      - {sound: entity.evoker.prepare_summon, volume: 0.7, pitch: 0.6, delay: 0}
      - {sound: block.respawn_anchor.charge, volume: 0.7, pitch: 0.5, delay: 8}
      - {sound: entity.ender_dragon.growl, volume: 0.6, pitch: 0.7, delay: 16}
      - {sound: entity.breeze.inhale, volume: 0.8, pitch: 0.5, delay: 26}
      - {sound: entity.ender_dragon.shoot, volume: 0.9, pitch: 0.6, delay: 36}
      - {sound: entity.ghast.shoot, volume: 0.8, pitch: 0.5, delay: 38}
    hit:
      - {sound: entity.dragon_fireball.explode, volume: 0.8, pitch: 0.6, delay: 0}
      - {sound: entity.generic.explode, volume: 0.6, pitch: 0.7, delay: 1}
      - {sound: block.blastfurnace.fire_crackle, volume: 0.8, pitch: 0.6, delay: 4}
      - {sound: block.fire.ambient, volume: 0.7, pitch: 0.6, delay: 10}
    end:
      - {sound: entity.ender_dragon.flap, volume: 0.5, pitch: 0.7, delay: 0}
      - {sound: block.fire.extinguish, volume: 0.5, pitch: 0.7, delay: 4}
      - {sound: block.lava.pop, volume: 0.4, pitch: 0.8, delay: 8}

  cinder_skipring:       # 212 불꽃 줄넘기 — 발밑에서 휘잉 퍼져나가는 불고리, 닿으면 짧게 탁 탐
    cast:
      - {sound: entity.breeze.wind_burst, volume: 0.45, pitch: 1.4, delay: 0}
      - {sound: item.firecharge.use, volume: 0.5, pitch: 1.1, delay: 1}
      - {sound: block.fire.ambient, volume: 0.45, pitch: 1.0, delay: 4}
    hit:
      - {sound: entity.generic.burn, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: entity.player.attack.knockback, volume: 0.45, pitch: 1.3, delay: 0}

  thawing_heat:          # 239 해빙의 열기 — 3초간 열기를 불어넣는 지속음, 얼음이 쩍 녹아 깨지는 마무리
    cast:
      - {sound: entity.breeze.inhale, volume: 0.4, pitch: 1.3, delay: 0}
      - {sound: block.furnace.fire_crackle, volume: 0.45, pitch: 1.2, delay: 4}
      - {sound: block.fire.ambient, volume: 0.4, pitch: 1.3, delay: 14}
    hit:
      - {sound: block.glass.break, volume: 0.5, pitch: 1.3, delay: 0}
      - {sound: block.fire.extinguish, volume: 0.4, pitch: 1.4, delay: 1}
      - {sound: entity.player.splash, volume: 0.3, pitch: 1.5, delay: 4}

  steam_ignition:        # 240 증기 점화 — 밸브에 불이 들어가 압력이 차오르며 칙 증기가 뿜고 장치가 덜컥 반응
    cast:
      - {sound: item.flintandsteel.use, volume: 0.45, pitch: 1.0, delay: 0}
      - {sound: block.furnace.fire_crackle, volume: 0.4, pitch: 1.2, delay: 2}
    hit:
      - {sound: block.lava.extinguish, volume: 0.5, pitch: 0.8, delay: 0}
      - {sound: block.piston.extend, volume: 0.4, pitch: 1.2, delay: 6}
      - {sound: block.copper_bulb.turn_on, volume: 0.4, pitch: 1.0, delay: 10}

  fox_orbit:             # 300 여우불 공전 — 장난스러운 여우 울음과 함께 작은 불씨가 빙글 돌다 휘어 날아감
    cast:
      - {sound: entity.fox.ambient, volume: 0.35, pitch: 1.5, delay: 0}
      - {sound: block.fire.ambient, volume: 0.35, pitch: 1.8, delay: 2}
      - {sound: entity.breeze.whirl, volume: 0.3, pitch: 1.7, delay: 4}
      - {sound: entity.blaze.shoot, volume: 0.35, pitch: 1.7, delay: 14}
    hit:
      - {sound: entity.generic.burn, volume: 0.35, pitch: 1.4, delay: 0}
      - {sound: block.lava.pop, volume: 0.3, pitch: 1.7, delay: 1}

  curving_plumes:        # 301 곡선 불깃털 — 날개를 털듯 펄럭 부채꼴로 흩뿌리는 불깃털, 가벼운 휘익
    cast:
      - {sound: entity.parrot.fly, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: entity.blaze.shoot, volume: 0.35, pitch: 1.6, delay: 1}
      - {sound: entity.arrow.shoot, volume: 0.3, pitch: 1.4, delay: 3}
    hit:
      - {sound: entity.generic.burn, volume: 0.35, pitch: 1.5, delay: 0}
      - {sound: entity.arrow.hit, volume: 0.3, pitch: 1.6, delay: 0}

  # ===================== water (37) =====================
  water_breath:          # 065 물결 숨결 — 물속으로 들어가듯 깊은 숨, 기포가 보글 올라오며 몸을 감싸는 느낌
    cast:
      - {sound: entity.player.breath, volume: 0.6, pitch: 1.1, delay: 0}
      - {sound: block.bubble_column.upwards_inside, volume: 0.45, pitch: 1.4, delay: 3}
      - {sound: block.amethyst_block.chime, volume: 0.4, pitch: 1.5, delay: 8}
    end:
      - {sound: ambient.underwater.exit, volume: 0.4, pitch: 1.3, delay: 0}
      - {sound: block.bubble_column.bubble_pop, volume: 0.4, pitch: 1.2, delay: 3}

  tide_stride:           # 066 물살 타기 — 돌고래가 물살을 가르며 튀어나가는 가벼운 질주감
    cast:
      - {sound: entity.dolphin.swim, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: entity.player.swim, volume: 0.5, pitch: 1.4, delay: 2}
      - {sound: entity.dolphin.play, volume: 0.35, pitch: 1.3, delay: 6}
    end:
      - {sound: entity.generic.swim, volume: 0.35, pitch: 0.8, delay: 0}

  water_bolt:            # 067 물방울 탄환 — 짧게 '퓻' 쏘는 물방울, 맞으면 철퍽 튀는 짧은 스플래시
    cast:
      - {sound: entity.squid.squirt, volume: 0.5, pitch: 1.6, delay: 0}
      - {sound: block.bubble_column.bubble_pop, volume: 0.4, pitch: 1.5, delay: 1}
    hit:
      - {sound: entity.generic.splash, volume: 0.55, pitch: 1.5, delay: 0}
      - {sound: entity.player.attack.knockback, volume: 0.35, pitch: 1.4, delay: 0}

  quench:                # 068 불길 씻기 — 물 한 바가지 끼얹고 치익 하고 불이 꺼지는 소리
    cast:
      - {sound: item.bucket.empty, volume: 0.55, pitch: 1.3, delay: 0}
      - {sound: block.fire.extinguish, volume: 0.45, pitch: 1.5, delay: 2}
      - {sound: block.pointed_dripstone.drip_water, volume: 0.4, pitch: 1.2, delay: 6}

  purifying_wave:        # 069 정화의 물결 — 맑은 물결이 퍼지며 탁한 기운을 씻어내는 종소리 같은 정화
    cast:
      - {sound: block.conduit.activate, volume: 0.5, pitch: 1.6, delay: 0}
      - {sound: entity.player.splash, volume: 0.45, pitch: 1.2, delay: 2}
      - {sound: block.amethyst_block.resonate, volume: 0.5, pitch: 1.4, delay: 6}
      - {sound: block.bell.resonate, volume: 0.3, pitch: 1.8, delay: 12}
    hit:
      - {sound: block.amethyst_block.chime, volume: 0.45, pitch: 1.7, delay: 0}
      - {sound: block.bubble_column.bubble_pop, volume: 0.35, pitch: 1.4, delay: 2}

  ice_bridge:            # 070 얼음 다리 — 발밑 수면이 쩍 얼어붙는 서리, 끝나면 얼음이 녹아 물방울
    cast:
      - {sound: block.powder_snow.place, volume: 0.6, pitch: 0.9, delay: 0}
      - {sound: block.glass.place, volume: 0.5, pitch: 1.4, delay: 2}
      - {sound: block.amethyst_cluster.place, volume: 0.4, pitch: 1.6, delay: 6}
    end:
      - {sound: block.glass.break, volume: 0.35, pitch: 1.6, delay: 0}
      - {sound: block.pointed_dripstone.drip_water, volume: 0.4, pitch: 1.0, delay: 4}

  spring_unseal:         # 072 수맥 개방 — 땅이 열리며 샘물이 콸콸 솟아오름
    cast:
      - {sound: block.gravel.break, volume: 0.45, pitch: 0.8, delay: 0}
      - {sound: block.bubble_column.upwards_ambient, volume: 0.5, pitch: 1.0, delay: 3}
    hit:
      - {sound: item.bucket.empty, volume: 0.65, pitch: 0.9, delay: 0}
      - {sound: entity.player.splash, volume: 0.45, pitch: 1.1, delay: 2}
      - {sound: block.water.ambient, volume: 0.35, pitch: 1.2, delay: 6}

  water_elemental:       # 073 운디네 — 물기둥이 소용돌이치며 정령이 노래하듯 깨어남, 끝에는 물로 흩어짐
    cast:
      - {sound: block.bubble_column.whirlpool_inside, volume: 0.55, pitch: 1.1, delay: 0}
      - {sound: entity.evoker.prepare_summon, volume: 0.4, pitch: 1.6, delay: 3}
      - {sound: entity.dolphin.ambient_water, volume: 0.45, pitch: 1.5, delay: 10}
      - {sound: block.amethyst_block.chime, volume: 0.45, pitch: 1.3, delay: 14}
    end:
      - {sound: entity.player.splash, volume: 0.5, pitch: 1.3, delay: 0}
      - {sound: block.bubble_column.bubble_pop, volume: 0.45, pitch: 1.1, delay: 3}
      - {sound: block.amethyst_block.resonate, volume: 0.3, pitch: 1.8, delay: 6}

  eternal_ice_prison:    # 074 만년빙옥 — 대상 주위로 얼음이 쩌억 굳어 감옥이 닫힘, 풀릴 땐 산산조각
    cast:
      - {sound: block.powder_snow.break, volume: 0.6, pitch: 0.8, delay: 0}
      - {sound: block.conduit.attack.target, volume: 0.5, pitch: 0.9, delay: 2}
    hit:
      - {sound: block.glass.place, volume: 0.75, pitch: 0.6, delay: 0}
      - {sound: block.amethyst_block.place, volume: 0.6, pitch: 0.8, delay: 2}
      - {sound: block.powder_snow.place, volume: 0.6, pitch: 0.7, delay: 4}
      - {sound: block.chain.place, volume: 0.4, pitch: 0.7, delay: 8}
    end:
      - {sound: block.glass.break, volume: 0.7, pitch: 0.8, delay: 0}
      - {sound: block.amethyst_cluster.break, volume: 0.5, pitch: 1.2, delay: 2}

  cauldron_fill:         # 075 가마솥 채우기 — 가마솥에 물이 똑똑 떨어져 찰랑 차오르는 작은 소리
    cast:
      - {sound: block.pointed_dripstone.drip_water_into_cauldron, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: item.bucket.empty, volume: 0.35, pitch: 1.5, delay: 3}

  dye_rinse:             # 076 염색 씻기 — 가죽을 물에 헹궈 물감이 빠지는 촉촉한 소리
    cast:
      - {sound: block.wet_sponge.place, volume: 0.45, pitch: 1.2, delay: 0}
      - {sound: entity.generic.swim, volume: 0.35, pitch: 1.5, delay: 2}
      - {sound: block.pointed_dripstone.drip_water, volume: 0.35, pitch: 1.4, delay: 6}

  fish_lure:             # 077 물고기 유인 — 찌 주위로 물고기가 몰려드는 퐁당·꼬리 퍼덕임
    cast:
      - {sound: entity.fishing_bobber.splash, volume: 0.4, pitch: 1.5, delay: 0}
      - {sound: entity.fish.swim, volume: 0.45, pitch: 1.2, delay: 3}
      - {sound: entity.tropical_fish.flop, volume: 0.3, pitch: 1.4, delay: 8}

  frost_rupture:         # 078 서리 파열 — 얼음 시계가 째깍 새겨지고 1초 뒤 얼음 가시가 쾅 솟음
    cast:
      - {sound: block.powder_snow.step, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: block.amethyst_cluster.hit, volume: 0.5, pitch: 1.5, delay: 3}
      - {sound: block.note_block.chime, volume: 0.3, pitch: 1.2, delay: 10}
    hit:
      - {sound: block.glass.break, volume: 0.75, pitch: 0.7, delay: 0}
      - {sound: block.amethyst_cluster.break, volume: 0.6, pitch: 0.9, delay: 1}
      - {sound: block.powder_snow.break, volume: 0.55, pitch: 0.8, delay: 2}

  pressure_lance:        # 079 수압창 — 물이 응축되어 고압으로 쏘아지는 날카로운 관통음, 맞을 때마다 짧은 꿰뚫음
    cast:
      - {sound: block.bubble_column.whirlpool_inside, volume: 0.45, pitch: 1.6, delay: 0}
      - {sound: item.trident.throw, volume: 0.7, pitch: 1.2, delay: 3}
      - {sound: item.trident.riptide_1, volume: 0.4, pitch: 1.5, delay: 4}
    hit:
      - {sound: item.trident.hit, volume: 0.6, pitch: 1.3, delay: 0}
      - {sound: entity.generic.splash, volume: 0.4, pitch: 1.6, delay: 0}

  life_distribution:     # 080 생명의 분배 — 생명이 물처럼 흘러 고르게 나뉘는 저울 같은 공명
    cast:
      - {sound: block.beacon.power_select, volume: 0.4, pitch: 1.4, delay: 0}
      - {sound: block.bubble_column.upwards_inside, volume: 0.4, pitch: 1.2, delay: 3}
      - {sound: block.amethyst_block.resonate, volume: 0.5, pitch: 1.2, delay: 8}
    hit:
      - {sound: block.amethyst_block.chime, volume: 0.45, pitch: 1.5, delay: 0}
      - {sound: entity.experience_orb.pickup, volume: 0.3, pitch: 0.9, delay: 2}

  moist_farmland:        # 081 촉촉한 밭 — 흙 위로 물이 스며드는 부드러운 촉촉함
    cast:
      - {sound: weather.rain, volume: 0.25, pitch: 1.3, delay: 0}
      - {sound: block.wet_grass.place, volume: 0.45, pitch: 1.0, delay: 2}
      - {sound: block.mud.place, volume: 0.3, pitch: 1.3, delay: 6}

  wash_letters:          # 082 글씨 씻기 — 표지판을 물걸레로 스윽 닦아내는 짧은 소리
    cast:
      - {sound: block.wet_sponge.hit, volume: 0.4, pitch: 1.3, delay: 0}
      - {sound: item.brush.brushing.generic, volume: 0.35, pitch: 1.4, delay: 2}

  healing_rain:          # 083 치유의 비 — 부드러운 빗소리 위로 무지개 같은 맑은 차임
    cast:
      - {sound: weather.rain, volume: 0.4, pitch: 1.1, delay: 0}
      - {sound: block.amethyst_block.resonate, volume: 0.5, pitch: 1.3, delay: 4}
      - {sound: block.note_block.chime, volume: 0.35, pitch: 1.5, delay: 10}
      - {sound: block.amethyst_block.chime, volume: 0.4, pitch: 1.8, delay: 16}
    hit:
      - {sound: block.amethyst_block.chime, volume: 0.35, pitch: 1.6, delay: 0}
      - {sound: block.pointed_dripstone.drip_water, volume: 0.3, pitch: 1.4, delay: 2}
    end:
      - {sound: weather.rain, volume: 0.25, pitch: 1.5, delay: 0}
      - {sound: block.amethyst_block.resonate, volume: 0.3, pitch: 1.8, delay: 4}

  dew_gathering:         # 084 이슬 모으기 — 맺힌 이슬이 똑똑 병에 모이는 맑은 소리
    cast:
      - {sound: block.pointed_dripstone.drip_water, volume: 0.4, pitch: 1.6, delay: 0}
      - {sound: item.bottle.fill, volume: 0.45, pitch: 1.3, delay: 3}
      - {sound: block.amethyst_block.chime, volume: 0.3, pitch: 1.9, delay: 8}

  quiet_mooring:         # 085 노아의 방주 — 나무 배가 수면 위에 툭 놓이고 노가 한 번 저어짐
    cast:
      - {sound: block.wood.place, volume: 0.55, pitch: 0.8, delay: 0}
      - {sound: entity.player.splash, volume: 0.45, pitch: 1.0, delay: 2}
      - {sound: entity.boat.paddle_water, volume: 0.45, pitch: 1.1, delay: 7}

  bubble_aria:           # 086 물거품 아리아 — 노래하듯 떠가는 물거품, 터지면 세로 파문이 둥둥 퍼짐
    cast:
      - {sound: entity.puffer_fish.blow_up, volume: 0.45, pitch: 1.5, delay: 0}
      - {sound: block.note_block.flute, volume: 0.35, pitch: 1.4, delay: 2}
      - {sound: block.bubble_column.upwards_ambient, volume: 0.4, pitch: 1.5, delay: 4}
    hit:
      - {sound: block.bubble_column.bubble_pop, volume: 0.7, pitch: 0.9, delay: 0}
      - {sound: entity.player.splash.high_speed, volume: 0.5, pitch: 1.2, delay: 1}
      - {sound: block.amethyst_block.resonate, volume: 0.4, pitch: 1.5, delay: 4}

  pressure_hammer:       # 087 수압해머 — 거대한 물 덩어리가 웅 하고 뭉쳤다가 쿵 하고 내려찍힘
