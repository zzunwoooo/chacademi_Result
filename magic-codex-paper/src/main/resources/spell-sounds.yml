      - {sound: block.stone.place, volume: 0.45, pitch: 0.8, delay: 3}

  flame_sword_dance:     # 061 화염 검무 — 칼날이 하나씩 뽑혀 떠오르는 금속성 울림, 휘두를 때마다 불꽃 베기
    cast:
      - {sound: block.fire.ambient, volume: 0.5, pitch: 1.1, delay: 0}
      - {sound: item.armor.equip_netherite, volume: 0.45, pitch: 1.5, delay: 3}
      - {sound: block.amethyst_block.resonate, volume: 0.4, pitch: 1.2, delay: 5}
      - {sound: item.armor.equip_netherite, volume: 0.45, pitch: 1.7, delay: 9}
      - {sound: item.armor.equip_netherite, volume: 0.45, pitch: 1.9, delay: 15}
    hit:
      - {sound: entity.player.attack.sweep, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: entity.blaze.shoot, volume: 0.4, pitch: 1.4, delay: 1}
      - {sound: entity.generic.burn, volume: 0.4, pitch: 1.2, delay: 2}
    end:
      - {sound: block.fire.extinguish, volume: 0.35, pitch: 1.3, delay: 0}
      - {sound: block.amethyst_cluster.break, volume: 0.3, pitch: 1.4, delay: 2}

