      - {sound: block.fire.ambient, volume: 0.6, pitch: 1.1, delay: 10}
      - {sound: block.beacon.activate, volume: 0.6, pitch: 1.3, delay: 18}
      - {sound: block.amethyst_block.resonate, volume: 0.5, pitch: 1.6, delay: 28}
    hit:
