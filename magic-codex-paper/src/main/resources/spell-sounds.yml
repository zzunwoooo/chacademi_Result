      - {sound: block.rooted_dirt.break, volume: 0.5, pitch: 0.8, delay: 2}
    end:
      - {sound: block.mud.break, volume: 0.6, pitch: 0.7, delay: 0}
      - {sound: block.gravel.fall, volume: 0.5, pitch: 0.9, delay: 4}
      - {sound: block.sand.fall, volume: 0.4, pitch: 0.8, delay: 10}

  earthquake:            # 105 지진 — 땅 깊은 곳 진동 + 돌 구르는 파동
