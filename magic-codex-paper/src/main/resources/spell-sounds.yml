      - {sound: entity.iron_golem.repair, volume: 0.6, pitch: 0.7, delay: 16}
      - {sound: entity.ravager.step, volume: 0.8, pitch: 0.7, delay: 26}
      - {sound: block.gravel.fall, volume: 0.6, pitch: 0.8, delay: 30}
    hit:
      - {sound: entity.iron_golem.attack, volume: 0.8, pitch: 0.7, delay: 0}
