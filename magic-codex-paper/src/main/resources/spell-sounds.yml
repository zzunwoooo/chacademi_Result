      - {sound: entity.illusioner.cast_spell, volume: 0.3, pitch: 1.9, delay: 0}
    hit:
      - {sound: entity.item_frame.rotate_item, volume: 0.5, pitch: 1.1, delay: 0}
      - {sound: block.amethyst_cluster.step, volume: 0.35, pitch: 1.6, delay: 1}

  prism_tint:              # 246 프리즘 물들이기 — 수정이 색을 바꾸며 '팅' 울리는 짧은 음 (연타 안전)
