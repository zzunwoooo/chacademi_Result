      - {sound: item.book.page_turn, volume: 0.5, pitch: 1.1, delay: 0}
      - {sound: entity.evoker.prepare_summon, volume: 0.45, pitch: 1.5, delay: 2}
      - {sound: entity.wolf.ambient, volume: 0.5, pitch: 1.2, delay: 10}
      - {sound: entity.cat.ambient, volume: 0.5, pitch: 1.2, delay: 13}
    end:
