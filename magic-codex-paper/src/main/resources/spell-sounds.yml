      - {sound: entity.phantom.flap, volume: 0.5, pitch: 0.8, delay: 1}
      - {sound: entity.breeze.wind_burst, volume: 0.6, pitch: 0.8, delay: 3}
    hit:
      - {sound: entity.player.attack.knockback, volume: 0.55, pitch: 0.9, delay: 0}
      - {sound: block.heavy_core.hit, volume: 0.4, pitch: 1.0, delay: 1}

  feather_storm:            # 319 깃털 폭풍 — 몸 둘레로 휘도는 깃털 칼날의 사각사각 베기
    cast:
