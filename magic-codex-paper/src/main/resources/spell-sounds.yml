      - {sound: entity.generic.explode, volume: 0.6, pitch: 0.9, delay: 0}
      - {sound: entity.dragon_fireball.explode, volume: 0.5, pitch: 0.8, delay: 1}
    end:
      - {sound: block.redstone_torch.burnout, volume: 0.35, pitch: 1.0, delay: 0}

  heat_recovery:         # 058 열량 보존 — 주변 불길을 빨아들이는 흡입 + 몸으로 스며드는 따스한 회복음
    cast:
      - {sound: entity.breeze.inhale, volume: 0.6, pitch: 0.7, delay: 0}
      - {sound: block.fire.ambient, volume: 0.5, pitch: 0.9, delay: 4}
      - {sound: block.respawn_anchor.charge, volume: 0.5, pitch: 1.0, delay: 12}
      - {sound: block.beacon.power_select, volume: 0.45, pitch: 1.3, delay: 22}
