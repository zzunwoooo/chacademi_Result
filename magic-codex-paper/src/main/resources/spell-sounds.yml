      - {sound: item.crop.plant, volume: 0.35, pitch: 1.15, delay: 5}
      - {sound: item.crop.plant, volume: 0.3, pitch: 1.3, delay: 8}

  bee_calm:              # 108 벌떼 달래기 — 꿀처럼 달콤하고 나른한 진정
    cast:
