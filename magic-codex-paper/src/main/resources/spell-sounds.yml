      - {sound: block.note_block.chime, volume: 0.5, pitch: 1.33, delay: 8}
      - {sound: block.note_block.chime, volume: 0.5, pitch: 2.0, delay: 12}
      - {sound: block.respawn_anchor.charge, volume: 0.55, pitch: 1.3, delay: 18}
      - {sound: entity.player.levelup, volume: 0.55, pitch: 1.2, delay: 26}

  constellation_emissary:  # 164 성좌의 대리인 — 작은 별 사역마가 반짝 태어나 치유를 뿌림
