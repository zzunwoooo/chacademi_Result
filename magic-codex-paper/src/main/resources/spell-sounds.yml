      - {sound: block.lava.pop, volume: 0.4, pitch: 1.2, delay: 3}
    end:
      - {sound: block.fire.extinguish, volume: 0.35, pitch: 1.5, delay: 0}
      - {sound: block.redstone_torch.burnout, volume: 0.3, pitch: 1.2, delay: 2}

  fire_curtain:          # 038 플레어 월 — 낮게 확 치솟는 화염 장벽, 넓고 두꺼운 불길
