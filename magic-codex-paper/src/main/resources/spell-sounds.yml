      - {sound: entity.firework_rocket.twinkle_far, volume: 0.3, pitch: 1.4, delay: 4}

  light_beam:              # 244 빛줄기 — 집중된 광선이 웅웅 뻗어나가고 거울에 반사되는 퍼즐 빔
