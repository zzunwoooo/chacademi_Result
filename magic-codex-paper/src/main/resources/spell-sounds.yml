      - {sound: block.note_block.chime, volume: 0.4, pitch: 1.0, delay: 4}
      - {sound: block.note_block.chime, volume: 0.4, pitch: 1.26, delay: 7}
      - {sound: block.note_block.chime, volume: 0.4, pitch: 1.5, delay: 10}
    hit:
      - {sound: block.amethyst_block.resonate, volume: 0.45, pitch: 1.5, delay: 0}
      - {sound: entity.player.levelup, volume: 0.35, pitch: 1.8, delay: 4}
    end:
      - {sound: block.note_block.bass, volume: 0.35, pitch: 0.8, delay: 0}
      - {sound: block.amethyst_cluster.step, volume: 0.3, pitch: 0.9, delay: 2}

  sun_drying:              # 150 햇살 말림 — 볕에 바삭하게 말라가는 가죽, 소박한 생활음
    cast:
      - {sound: block.amethyst_block.chime, volume: 0.3, pitch: 1.4, delay: 0}
      - {sound: block.campfire.crackle, volume: 0.35, pitch: 1.6, delay: 2}
      - {sound: item.armor.equip_leather, volume: 0.45, pitch: 1.2, delay: 8}

  luminous_copy:           # 151 빛의 필사 — 빛이 펜끝처럼 모였다가 글씨 위치로 날아가 새겨짐
