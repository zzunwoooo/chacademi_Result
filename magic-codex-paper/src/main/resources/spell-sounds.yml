      - {sound: block.fire.ambient, volume: 0.35, pitch: 1.4, delay: 1}
    end:
      - {sound: block.fire.extinguish, volume: 0.5, pitch: 0.9, delay: 0}
      - {sound: block.lava.extinguish, volume: 0.3, pitch: 1.2, delay: 4}

  phoenix_oath:          # 039 불사조의 서약 — 날갯짓과 함께 성스러운 불꽃이 깃드는 장엄한 서약, 막을 땐 부활의 울림
