      - {sound: block.amethyst_cluster.hit, volume: 0.3, pitch: 1.5, delay: 2}

  # ===================== dark (39) =====================
  night_sight:            # 165 밤눈 — 눈꺼풀이 열리듯 꽃잎 열림 + 낮은 스컬크 반짝임, 조용한 자기 버프
