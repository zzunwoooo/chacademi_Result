    end:
      - {sound: block.copper_bulb.turn_off, volume: 0.35, pitch: 1.4, delay: 0}
      - {sound: entity.allay.item_taken, volume: 0.3, pitch: 1.5, delay: 2}

  rainbow_collar:          # 149 교화 — 일곱 빛 고리가 감기며 마음을 여는 상냥한 주문
