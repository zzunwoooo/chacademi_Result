    hit:
      - {sound: item.mace.smash_ground_heavy, volume: 0.75, pitch: 1.0, delay: 0}
      - {sound: entity.player.splash.high_speed, volume: 0.7, pitch: 0.6, delay: 1}
      - {sound: entity.generic.splash, volume: 0.5, pitch: 0.8, delay: 4}

  waterspout:            # 088 용오름 — 소용돌이 물기둥이 휘몰아치며 솟구치고, 끝나면 물이 쏟아져 내림
    cast:
      - {sound: block.bubble_column.whirlpool_inside, volume: 0.7, pitch: 0.8, delay: 0}
      - {sound: entity.breeze.whirl, volume: 0.5, pitch: 0.9, delay: 3}
      - {sound: item.trident.riptide_3, volume: 0.6, pitch: 0.9, delay: 8}
    hit:
      - {sound: entity.player.splash.high_speed, volume: 0.55, pitch: 1.0, delay: 0}
      - {sound: entity.breeze.wind_burst, volume: 0.35, pitch: 1.3, delay: 1}
    end:
      - {sound: weather.rain, volume: 0.4, pitch: 0.9, delay: 0}
      - {sound: entity.generic.splash, volume: 0.5, pitch: 0.7, delay: 3}

  current_sorting:       # 089 사금 추출 — 물살을 고르며 모래가 걸러지다가 금빛 반짝임이 드러나는 보상감 (궁극급 쿨다운)
    cast:
      - {sound: block.water.ambient, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: item.brush.brushing.sand, volume: 0.5, pitch: 1.1, delay: 6}
      - {sound: block.sand.fall, volume: 0.45, pitch: 1.2, delay: 14}
      - {sound: item.brush.brushing.sand.complete, volume: 0.6, pitch: 1.0, delay: 24}
      - {sound: entity.player.levelup, volume: 0.45, pitch: 1.6, delay: 30}
      - {sound: block.amethyst_block.chime, volume: 0.6, pitch: 1.9, delay: 34}

  potion_mist:           # 090 약액 분무 — 물약병이 칙 터지며 푸른 안개가 쉬익 퍼짐
    cast:
      - {sound: entity.splash_potion.break, volume: 0.55, pitch: 1.3, delay: 0}
      - {sound: entity.lingering_potion.throw, volume: 0.4, pitch: 0.9, delay: 2}
      - {sound: block.brewing_stand.brew, volume: 0.4, pitch: 1.4, delay: 5}
    hit:
      - {sound: item.bottle.empty, volume: 0.35, pitch: 1.6, delay: 0}
      - {sound: block.amethyst_block.chime, volume: 0.3, pitch: 1.5, delay: 2}
    end:
      - {sound: block.fire.extinguish, volume: 0.25, pitch: 1.8, delay: 0}

  waterwheel_shield:     # 091 물레 방패 — 물레가 덜컥 돌기 시작하는 물방패, 막을 때 철썩 튕겨냄
    cast:
      - {sound: block.bubble_column.whirlpool_ambient, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: block.bamboo_wood.place, volume: 0.45, pitch: 0.8, delay: 2}
      - {sound: item.armor.equip_turtle, volume: 0.5, pitch: 1.1, delay: 5}
    hit:
      - {sound: item.shield.block, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: entity.player.splash.high_speed, volume: 0.55, pitch: 1.1, delay: 0}
      - {sound: entity.player.attack.knockback, volume: 0.45, pitch: 0.9, delay: 1}
    end:
      - {sound: entity.generic.splash, volume: 0.35, pitch: 1.3, delay: 0}

  concrete_curing:       # 092 콘크리트 양생 — 물을 머금은 가루가 차례로 단단히 굳는 소리
    cast:
      - {sound: item.bucket.empty, volume: 0.45, pitch: 1.1, delay: 0}
      - {sound: block.sand.place, volume: 0.4, pitch: 0.9, delay: 3}
      - {sound: block.fire.extinguish, volume: 0.3, pitch: 1.5, delay: 6}
      - {sound: block.stone.break, volume: 0.45, pitch: 1.2, delay: 10}

  ripple_guard:          # 093 파문방벽 — 정면에 물 장막이 촤악 펼쳐지고 투사체가 퐁 하고 삼켜짐
    cast:
      - {sound: entity.player.splash.high_speed, volume: 0.55, pitch: 1.2, delay: 0}
      - {sound: block.conduit.activate, volume: 0.4, pitch: 1.4, delay: 2}
      - {sound: block.amethyst_block.resonate, volume: 0.35, pitch: 1.2, delay: 5}
    hit:
      - {sound: entity.generic.splash, volume: 0.45, pitch: 1.6, delay: 0}
      - {sound: block.bubble_column.bubble_pop, volume: 0.4, pitch: 1.3, delay: 1}
    end:
      - {sound: block.conduit.deactivate, volume: 0.35, pitch: 1.5, delay: 0}
      - {sound: block.water.ambient, volume: 0.3, pitch: 1.4, delay: 2}

  tidal_wave:            # 094 해일 — 낮게 밀려오는 거대한 파도가 솟구쳐 덮치는 묵직한 물살
    cast:
      - {sound: item.trident.riptide_2, volume: 0.7, pitch: 0.7, delay: 0}
      - {sound: block.bubble_column.whirlpool_inside, volume: 0.6, pitch: 0.6, delay: 3}
      - {sound: entity.player.splash.high_speed, volume: 0.7, pitch: 0.7, delay: 8}
    hit:
      - {sound: entity.generic.splash, volume: 0.75, pitch: 0.7, delay: 0}
      - {sound: entity.player.attack.knockback, volume: 0.55, pitch: 0.8, delay: 0}
      - {sound: entity.player.splash, volume: 0.45, pitch: 1.0, delay: 3}

  bouncing_droplet:      # 095 도약하는 물방울 — 통통 튀는 탄력 있는 물방울, 튈 때마다 짧은 '퐁', 마지막에 터짐
    cast:
      - {sound: entity.slime.jump_small, volume: 0.45, pitch: 1.5, delay: 0}
      - {sound: entity.squid.squirt, volume: 0.4, pitch: 1.7, delay: 1}
    hit:
      - {sound: entity.slime.squish_small, volume: 0.45, pitch: 1.6, delay: 0}
      - {sound: entity.generic.splash, volume: 0.35, pitch: 1.8, delay: 0}
    end:
      - {sound: block.bubble_column.bubble_pop, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: entity.player.splash, volume: 0.4, pitch: 1.4, delay: 1}

  abyssal_pressure:      # 096 심해의 압력 — 심연이 내려앉듯 낮게 울리는 압력과 심장박동, 짓눌리는 수압 (궁극)
    cast:
      - {sound: block.conduit.ambient, volume: 0.7, pitch: 0.6, delay: 0}
      - {sound: entity.elder_guardian.ambient, volume: 0.5, pitch: 0.6, delay: 6}
      - {sound: block.bubble_column.whirlpool_inside, volume: 0.7, pitch: 0.5, delay: 14}
      - {sound: entity.warden.heartbeat, volume: 0.8, pitch: 0.8, delay: 24}
      - {sound: block.heavy_core.place, volume: 0.8, pitch: 0.6, delay: 34}
    hit:
      - {sound: entity.warden.heartbeat, volume: 0.45, pitch: 1.0, delay: 0}
      - {sound: block.bubble_column.bubble_pop, volume: 0.35, pitch: 0.6, delay: 1}
    end:
      - {sound: ambient.underwater.exit, volume: 0.6, pitch: 0.8, delay: 0}
      - {sound: block.conduit.deactivate, volume: 0.6, pitch: 0.7, delay: 4}

  droplet_relay:         # 213 물방울 인계 — 몸에서 출발한 물방울이 날아가 거품 감옥으로 적을 띄워 올림
    cast:
      - {sound: entity.squid.squirt, volume: 0.5, pitch: 1.3, delay: 0}
      - {sound: block.note_block.chime, volume: 0.35, pitch: 1.6, delay: 2}
      - {sound: entity.dolphin.jump, volume: 0.4, pitch: 1.4, delay: 4}
    hit:
      - {sound: entity.puffer_fish.blow_up, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: block.bubble_column.upwards_inside, volume: 0.55, pitch: 1.2, delay: 2}
    end:
      - {sound: block.bubble_column.bubble_pop, volume: 0.55, pitch: 1.1, delay: 0}
      - {sound: entity.generic.splash, volume: 0.4, pitch: 1.3, delay: 1}

  folding_tideplane:     # 214 접히는 수면 — 바닥의 물막이 책장처럼 촤르륵 넘어가며 철썩 덮침
    cast:
      - {sound: block.water.ambient, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: item.book.page_turn, volume: 0.6, pitch: 0.7, delay: 4}
      - {sound: entity.player.splash.high_speed, volume: 0.6, pitch: 0.9, delay: 8}
    hit:
      - {sound: entity.generic.splash, volume: 0.6, pitch: 1.1, delay: 0}
      - {sound: entity.player.attack.sweep, volume: 0.4, pitch: 1.3, delay: 0}
    end:
      - {sound: block.bubble_column.bubble_pop, volume: 0.35, pitch: 1.3, delay: 0}

  water_level:           # 241 수위 조절 — 기둥 속 물이 한 칸 찰랑 오르내리는 짧고 가벼운 기믹음
    cast:
      - {sound: block.bubble_column.bubble_pop, volume: 0.35, pitch: 1.4, delay: 0}
      - {sound: item.bucket.fill, volume: 0.3, pitch: 1.5, delay: 1}

  crystal_orbit:         # 302 결정 공전탄 — 얼음 결정이 쨍그랑 돌며 맴돌다가 사방으로 흩뿌려짐
    cast:
      - {sound: block.amethyst_cluster.place, volume: 0.5, pitch: 1.6, delay: 0}
      - {sound: block.powder_snow.step, volume: 0.4, pitch: 1.3, delay: 2}
      - {sound: block.amethyst_block.resonate, volume: 0.4, pitch: 1.8, delay: 6}
      - {sound: entity.breeze.shoot, volume: 0.45, pitch: 1.5, delay: 12}
    hit:
      - {sound: block.glass.hit, volume: 0.45, pitch: 1.6, delay: 0}
      - {sound: block.powder_snow.hit, volume: 0.35, pitch: 1.3, delay: 0}

  fish_trap:             # 324 아공간 수조 — 아공간 수조 문이 열리며 물고기가 보글 헤엄치는 가벼운 UI음
    cast:
      - {sound: block.ender_chest.open, volume: 0.35, pitch: 1.5, delay: 0}
      - {sound: block.bubble_column.bubble_pop, volume: 0.3, pitch: 1.4, delay: 2}
      - {sound: entity.fish.swim, volume: 0.3, pitch: 1.3, delay: 4}

  # ===================== earth (45) =====================
  verdant_touch:         # 097 풍요의 손길 — 뼛가루 뿌리듯 부드러운 손길, 작물이 쑥 자라는 바스락
    cast:
      - {sound: item.bone_meal.use, volume: 0.5, pitch: 1.1, delay: 0}
      - {sound: block.azalea_leaves.place, volume: 0.4, pitch: 1.3, delay: 2}
      - {sound: block.amethyst_block.chime, volume: 0.3, pitch: 1.6, delay: 5}
    hit:
      - {sound: block.growing_plant.crop, volume: 0.45, pitch: 1.2, delay: 0}
      - {sound: block.grass.place, volume: 0.35, pitch: 1.4, delay: 2}

  ore_whisper:           # 098 땅의 속삭임 — 땅속으로 귀 기울이는 낮은 울림, 광석 위치가 맑게 울림
    cast:
      - {sound: block.deepslate.step, volume: 0.5, pitch: 0.7, delay: 0}
      - {sound: entity.sniffer.sniffing, volume: 0.4, pitch: 1.2, delay: 3}
      - {sound: block.amethyst_block.resonate, volume: 0.4, pitch: 1.4, delay: 8}
