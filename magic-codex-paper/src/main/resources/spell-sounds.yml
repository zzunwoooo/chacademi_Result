      - {sound: block.bell.use, volume: 0.4, pitch: 1.3, delay: 2}

  chain_arrow:             # 309 사슬 화살 — 금빛 사슬을 끌고 날아가 적을 휘감는 화살
    cast:
      - {sound: entity.arrow.shoot, volume: 0.55, pitch: 1.3, delay: 0}
      - {sound: block.chain.step, volume: 0.45, pitch: 1.3, delay: 1}
