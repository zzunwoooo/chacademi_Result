      - {sound: block.lava.pop, volume: 0.5, pitch: 0.7, delay: 6}
      - {sound: block.fire.ambient, volume: 0.5, pitch: 0.7, delay: 12}

  flame_lash:            # 042 화염 채찍 — 휙 휘두르는 채찍 + 감기는 불길, 낚아채 끌어당기는 소리
