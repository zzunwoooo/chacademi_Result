      - {sound: block.eyeblossom.open, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: block.sculk_sensor.clicking, volume: 0.35, pitch: 1.6, delay: 3}
      - {sound: block.amethyst_block.chime, volume: 0.4, pitch: 0.8, delay: 6}
    end:
      - {sound: block.eyeblossom.close, volume: 0.45, pitch: 1.1, delay: 0}

  shadow_bind:            # 166 그림자 매듭 — 짧은 그림자 휘감김 + 실/사슬 조이는 소리 (저쿨 짧게)
    cast:
      - {sound: entity.illusioner.cast_spell, volume: 0.4, pitch: 1.5, delay: 0}
      - {sound: block.sculk_vein.place, volume: 0.5, pitch: 0.8, delay: 1}
    hit:
      - {sound: block.chain.place, volume: 0.55, pitch: 0.7, delay: 0}
      - {sound: block.sculk.step, volume: 0.45, pitch: 0.6, delay: 2}

  faint_veil:             # 167 옅은 은신 — 몸이 흐려지는 환영술사 숨결 + 사라지는 바람
    cast:
      - {sound: entity.illusioner.prepare_mirror, volume: 0.5, pitch: 1.4, delay: 0}
      - {sound: entity.breeze.idle_air, volume: 0.3, pitch: 1.7, delay: 2}
      - {sound: block.amethyst_block.resonate, volume: 0.3, pitch: 1.8, delay: 5}
    end:
      - {sound: entity.illusioner.mirror_move, volume: 0.45, pitch: 1.3, delay: 0}

  shadow_double:          # 168 그림자 분신 — 거울 분신이 갈라지는 소리 + 그림자 잔향, 끝은 순간 귀환
    cast:
      - {sound: entity.illusioner.mirror_move, volume: 0.6, pitch: 0.9, delay: 0}
      - {sound: block.sculk.spread, volume: 0.45, pitch: 0.8, delay: 2}
      - {sound: block.respawn_anchor.set_spawn, volume: 0.3, pitch: 1.6, delay: 6}
    end:
      - {sound: entity.enderman.teleport, volume: 0.5, pitch: 1.3, delay: 0}
      - {sound: particle.soul_escape, volume: 0.6, pitch: 0.9, delay: 2}

  echo_reading:           # 169 잔향 읽기 — 책장 넘김 위로 속삭이는 소울 잔향과 스컬크 청취
    cast:
      - {sound: item.book.page_turn, volume: 0.6, pitch: 0.8, delay: 0}
      - {sound: block.sculk_sensor.clicking, volume: 0.35, pitch: 1.2, delay: 2}
      - {sound: particle.soul_escape, volume: 0.7, pitch: 1.3, delay: 5}
      - {sound: block.amethyst_block.resonate, volume: 0.3, pitch: 0.7, delay: 10}
    hit:
      - {sound: block.enchantment_table.use, volume: 0.45, pitch: 0.7, delay: 0}
      - {sound: block.chiseled_bookshelf.pickup.enchanted, volume: 0.5, pitch: 1.1, delay: 3}

  sealing_thread:         # 170 봉인의 실 — 실 걸리는 트립와이어 + 잠긴 상자 철컥
    cast:
      - {sound: block.tripwire.attach, volume: 0.55, pitch: 0.8, delay: 0}
      - {sound: block.sculk_vein.place, volume: 0.45, pitch: 1.1, delay: 2}
    hit:
      - {sound: block.chest.locked, volume: 0.6, pitch: 0.8, delay: 0}
      - {sound: item.lodestone_compass.lock, volume: 0.5, pitch: 0.7, delay: 3}

  shadow_exchange:        # 172 그림자 교환 — 두 번 겹치는 텔레포트(낮음·높음)로 위치가 뒤바뀌는 느낌
    cast:
