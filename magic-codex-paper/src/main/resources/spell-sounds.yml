      - {sound: block.furnace.fire_crackle, volume: 0.55, pitch: 0.9, delay: 0}
      - {sound: block.blastfurnace.fire_crackle, volume: 0.45, pitch: 1.1, delay: 3}
      - {sound: block.lava.pop, volume: 0.35, pitch: 1.3, delay: 8}
      - {sound: entity.experience_orb.pickup, volume: 0.3, pitch: 1.2, delay: 14}

