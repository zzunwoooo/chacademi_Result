# 차카데미 마법 효과음 (오픈 전 메모 #47, 2026-10-25 1차). 마인크래프트 1.21.4 기본 사운드만 사용.
# 서버가 재생하므로 주변 사람도 들림. 바꾼 뒤: /서버관리 새로고침 마법소리 · 들어 보기: /테스트 마법 효과음 <마법> [cast|hit|end]
#   cast = 시전 성공 (시전자 자리) · hit = 맞힌 순간 (맞은 자리) · end = 끝날 때 (사라진 자리)
#   sound = 사운드 이름 · volume 0.05~3 (1 = 16블록 거리) · pitch 0.5~2 (높을수록 가볍게) · delay = 틱 (20틱 = 1초)
#   같은 사람·마법·사건은 0.1초 안에 다시 울리지 않음. 사운드 이름 목록: https://minecraft.wiki/w/Sounds.json/Java_Edition_values
spells:

  # ===================== wind (38) =====================
  feather_fall:            # 001 페더 폴 — 깃털처럼 사뿐: 가벼운 엘리트라 펄럭 + 높은 차임
    cast:
      - {sound: item.armor.equip_elytra, volume: 0.5, pitch: 1.5, delay: 0}
      - {sound: entity.breeze.idle_air, volume: 0.35, pitch: 1.6, delay: 1}
      - {sound: block.amethyst_block.chime, volume: 0.4, pitch: 1.8, delay: 3}
    end:
      - {sound: entity.phantom.flap, volume: 0.3, pitch: 1.7, delay: 0}

  wind_basket:            # 002 바람바구니 — 휘이 빨아들이는 바람 + 아이템 줍는 톡톡
    cast:
      - {sound: entity.breeze.inhale, volume: 0.45, pitch: 1.3, delay: 0}
      - {sound: entity.breeze.whirl, volume: 0.35, pitch: 1.5, delay: 3}
      - {sound: entity.item.pickup, volume: 0.4, pitch: 1.2, delay: 10}
      - {sound: item.bundle.insert, volume: 0.4, pitch: 1.3, delay: 13}

  harvest_wind:            # 003 수확의 바람 — 들판을 쓰는 부드러운 바람 + 작물 사각사각
    cast:
      - {sound: entity.breeze.whirl, volume: 0.4, pitch: 1.2, delay: 0}
      - {sound: block.azalea_leaves.step, volume: 0.45, pitch: 1.1, delay: 3}
      - {sound: block.note_block.flute, volume: 0.3, pitch: 1.5, delay: 6}
    hit:
      - {sound: block.crop.break, volume: 0.45, pitch: 1.1, delay: 0}
      - {sound: block.sweet_berry_bush.pick_berries, volume: 0.35, pitch: 1.3, delay: 2}

  wind_push:            # 004 윈드 푸쉬 — 짧은 돌풍 발사 + 퍽 밀쳐내는 타격
    cast:
      - {sound: entity.wind_charge.throw, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: entity.breeze.shoot, volume: 0.4, pitch: 1.4, delay: 1}
    hit:
      - {sound: entity.wind_charge.wind_burst, volume: 0.6, pitch: 1.3, delay: 0}
      - {sound: entity.player.attack.knockback, volume: 0.5, pitch: 1.1, delay: 1}

  light_leap:            # 005 상승기류 — 발밑에서 솟구치는 브리즈 점프 + 위로 올라가는 바람
    cast:
      - {sound: entity.breeze.jump, volume: 0.6, pitch: 1.1, delay: 0}
      - {sound: entity.wind_charge.wind_burst, volume: 0.45, pitch: 1.5, delay: 1}
      - {sound: entity.phantom.flap, volume: 0.4, pitch: 1.3, delay: 4}

  flight:            # 006 비행 — 빗자루에 올라타 바람을 타는 이륙음
    cast:
      - {sound: item.armor.equip_elytra, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: entity.phantom.flap, volume: 0.5, pitch: 1.0, delay: 2}
      - {sound: entity.breeze.wind_burst, volume: 0.4, pitch: 1.4, delay: 4}
      - {sound: block.amethyst_block.chime, volume: 0.35, pitch: 1.6, delay: 8}
    end:
      - {sound: entity.breeze.land, volume: 0.45, pitch: 1.2, delay: 0}
      - {sound: entity.phantom.flap, volume: 0.3, pitch: 0.9, delay: 2}

  far_touch:            # 007 손길 너머 — 날아가는 바람 손 + 먼 곳의 딸깍
    cast:
      - {sound: entity.breeze.idle_air, volume: 0.35, pitch: 1.6, delay: 0}
      - {sound: block.amethyst_block.resonate, volume: 0.3, pitch: 1.8, delay: 2}
    hit:
      - {sound: block.lever.click, volume: 0.5, pitch: 1.3, delay: 0}
      - {sound: block.amethyst_cluster.hit, volume: 0.35, pitch: 1.7, delay: 1}

  wind_message:            # 009 바람의 전언 — 귓가를 스치는 작은 바람 + 종이 소리 (스팸 안전)
    cast:
      - {sound: entity.breeze.idle_air, volume: 0.25, pitch: 1.9, delay: 0}
      - {sound: item.book.page_turn, volume: 0.3, pitch: 1.4, delay: 2}

  storm_command:            # 010 폭풍의 지휘 — 영창으로 모으는 폭풍, 낮게 깔리는 천둥
    cast:
      - {sound: entity.evoker.prepare_attack, volume: 0.5, pitch: 1.3, delay: 0}
      - {sound: entity.breeze.charge, volume: 0.6, pitch: 0.9, delay: 4}
      - {sound: entity.breeze.whirl, volume: 0.6, pitch: 0.8, delay: 10}
      - {sound: item.trident.thunder, volume: 0.3, pitch: 1.4, delay: 18}
    hit:
      - {sound: entity.breeze.wind_burst, volume: 0.6, pitch: 0.9, delay: 0}
      - {sound: entity.player.attack.sweep, volume: 0.45, pitch: 1.2, delay: 1}
    end:
      - {sound: entity.breeze.idle_air, volume: 0.4, pitch: 0.7, delay: 0}
      - {sound: block.amethyst_block.resonate, volume: 0.3, pitch: 0.9, delay: 3}

  vacuum_cleave:            # 011 윈드 커터 — 날카로운 칼바람 쉭 + 관통 베기
    cast:
      - {sound: entity.player.attack.sweep, volume: 0.6, pitch: 1.6, delay: 0}
      - {sound: entity.breeze.shoot, volume: 0.45, pitch: 1.7, delay: 1}
    hit:
      - {sound: entity.player.attack.crit, volume: 0.45, pitch: 1.5, delay: 0}
      - {sound: block.chain.break, volume: 0.35, pitch: 1.4, delay: 1}

  gale_dash:            # 012 바람 걸음 — 1.5초 회피기: 아주 짧은 슬라이드 쉭
    cast:
      - {sound: entity.breeze.slide, volume: 0.45, pitch: 1.4, delay: 0}
      - {sound: entity.phantom.flap, volume: 0.25, pitch: 1.8, delay: 1}

  returning_wind:            # 013 되받는 바람 — 휘몰아 감싸는 결계 + 튕겨내는 디플렉트
    cast:
      - {sound: entity.breeze.whirl, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: block.amethyst_block.resonate, volume: 0.45, pitch: 1.5, delay: 1}
    hit:
      - {sound: entity.breeze.deflect, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: block.amethyst_cluster.hit, volume: 0.4, pitch: 1.6, delay: 1}
    end:
      - {sound: entity.breeze.idle_air, volume: 0.3, pitch: 1.5, delay: 0}

  wind_grooming:            # 014 바람 털빗 — 살랑 바람 빗질 + 양털 깎는 소리
    cast:
      - {sound: entity.breeze.idle_ground, volume: 0.3, pitch: 1.6, delay: 0}
      - {sound: item.brush.brushing.generic, volume: 0.4, pitch: 1.3, delay: 2}
    hit:
      - {sound: entity.sheep.shear, volume: 0.5, pitch: 1.1, delay: 0}
      - {sound: block.wool.hit, volume: 0.35, pitch: 1.3, delay: 2}

  weightless_zone:            # 015 중력지대 — 공기를 깊게 빨아들이며 생기는 소용돌이 장(궁극기급)
    cast:
      - {sound: entity.breeze.inhale, volume: 0.7, pitch: 0.7, delay: 0}
      - {sound: block.respawn_anchor.charge, volume: 0.5, pitch: 1.3, delay: 6}
      - {sound: entity.breeze.whirl, volume: 0.8, pitch: 0.6, delay: 14}
      - {sound: block.amethyst_block.resonate, volume: 0.5, pitch: 0.8, delay: 22}
      - {sound: entity.breeze.wind_burst, volume: 0.7, pitch: 0.6, delay: 30}
    hit:
      - {sound: entity.breeze.slide, volume: 0.45, pitch: 0.8, delay: 0}
      - {sound: entity.wind_charge.wind_burst, volume: 0.35, pitch: 0.9, delay: 1}
    end:
      - {sound: block.respawn_anchor.deplete, volume: 0.5, pitch: 1.4, delay: 0}
      - {sound: entity.breeze.idle_air, volume: 0.4, pitch: 0.7, delay: 3}

  trajectory_acceleration:            # 017 미라지 슈터 — 자동 발동 유도 바람 화살: 가볍고 짧게
    cast:
      - {sound: entity.arrow.shoot, volume: 0.35, pitch: 1.7, delay: 0}
      - {sound: entity.breeze.idle_air, volume: 0.2, pitch: 1.9, delay: 1}
    hit:
      - {sound: entity.arrow.hit, volume: 0.35, pitch: 1.6, delay: 0}

  dust_duster:            # 018 클린 — 휙 털어내는 작은 바람 + 거미줄 걷히는 소리
    cast:
      - {sound: entity.breeze.idle_ground, volume: 0.3, pitch: 1.7, delay: 0}
      - {sound: item.brush.brushing.generic, volume: 0.35, pitch: 1.5, delay: 2}
    hit:
      - {sound: block.cobweb.break, volume: 0.45, pitch: 1.2, delay: 0}
      - {sound: block.amethyst_block.chime, volume: 0.25, pitch: 1.9, delay: 2}

  leaf_cleanup:            # 019 잎새 청소 — 나무를 훑는 바람 + 잎 바스락
    cast:
      - {sound: entity.breeze.whirl, volume: 0.4, pitch: 1.3, delay: 0}
      - {sound: block.azalea_leaves.hit, volume: 0.4, pitch: 1.1, delay: 3}
    hit:
      - {sound: block.azalea_leaves.break, volume: 0.45, pitch: 1.0, delay: 0}
      - {sound: block.cherry_leaves.fall, volume: 0.35, pitch: 1.2, delay: 3}
      - {sound: entity.item.pickup, volume: 0.25, pitch: 0.9, delay: 6}

  feather_rustle:            # 020 깃털 털기 — 살랑 바람에 닭이 꼬꼬, 깃털 톡
    cast:
      - {sound: entity.breeze.idle_air, volume: 0.3, pitch: 1.7, delay: 0}
      - {sound: entity.parrot.fly, volume: 0.35, pitch: 1.3, delay: 2}
    hit:
      - {sound: entity.chicken.ambient, volume: 0.4, pitch: 1.3, delay: 0}
      - {sound: entity.item.pickup, volume: 0.3, pitch: 1.4, delay: 3}

  cross_breeze:            # 021 바람 화살 — 2초간 바람을 모으는 충전음 뒤 폭발적 발사
    cast:
      - {sound: item.crossbow.loading_start, volume: 0.45, pitch: 1.2, delay: 0}
      - {sound: entity.breeze.charge, volume: 0.5, pitch: 1.2, delay: 6}
      - {sound: item.crossbow.loading_end, volume: 0.45, pitch: 1.3, delay: 30}
      - {sound: entity.breeze.shoot, volume: 0.7, pitch: 1.1, delay: 38}
      - {sound: entity.wind_charge.throw, volume: 0.5, pitch: 1.3, delay: 40}
    hit:
      - {sound: entity.wind_charge.wind_burst, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: entity.arrow.hit, volume: 0.45, pitch: 1.1, delay: 1}

  returning_blade:            # 022 되돌이 칼날 — 큰 칼날이 부웅 날아갔다 돌아오는 부메랑
    cast:
      - {sound: entity.player.attack.sweep, volume: 0.6, pitch: 0.9, delay: 0}
      - {sound: item.trident.throw, volume: 0.5, pitch: 1.2, delay: 1}
      - {sound: item.trident.return, volume: 0.4, pitch: 1.4, delay: 18}
    hit:
      - {sound: entity.player.attack.sweep, volume: 0.45, pitch: 1.3, delay: 0}
      - {sound: entity.player.attack.strong, volume: 0.35, pitch: 1.2, delay: 1}

  pressure_press:            # 023 윈드 프레스 — 위에서 짓누르는 바람 압력 + 쿵 낙하
    cast:
      - {sound: entity.breeze.inhale, volume: 0.45, pitch: 0.9, delay: 0}
      - {sound: entity.phantom.swoop, volume: 0.45, pitch: 1.2, delay: 3}
    hit:
      - {sound: item.mace.smash_air, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: entity.breeze.land, volume: 0.5, pitch: 0.8, delay: 2}

  wind_decoy:            # 024 바람 미끼 — 바람으로 만든 종이 땡땡 울려 몹을 유인
    cast:
      - {sound: entity.breeze.whirl, volume: 0.4, pitch: 1.4, delay: 0}
      - {sound: block.bell.use, volume: 0.5, pitch: 1.5, delay: 4}
      - {sound: block.bell.resonate, volume: 0.35, pitch: 1.6, delay: 8}
    end:
      - {sound: block.amethyst_cluster.break, volume: 0.35, pitch: 1.5, delay: 0}
      - {sound: entity.breeze.idle_air, volume: 0.25, pitch: 1.8, delay: 2}

  air_step:            # 025 허공 디딤 — 발밑에 굳는 공기 발판: 단단한 크리스탈 착지음
    cast:
      - {sound: entity.breeze.land, volume: 0.45, pitch: 1.3, delay: 0}
      - {sound: block.amethyst_block.place, volume: 0.5, pitch: 1.4, delay: 1}
      - {sound: block.amethyst_block.chime, volume: 0.3, pitch: 1.8, delay: 4}
    end:
      - {sound: block.amethyst_cluster.break, volume: 0.4, pitch: 1.6, delay: 0}
      - {sound: entity.breeze.idle_air, volume: 0.25, pitch: 1.8, delay: 2}

  lightning_needle:            # 026 라이트닝 쇼크 — 바람이 끌어온 번개: 정전기 충전 + 낙뢰(작게)
    cast:
      - {sound: entity.breeze.charge, volume: 0.5, pitch: 1.4, delay: 0}
      - {sound: block.respawn_anchor.charge, volume: 0.4, pitch: 1.7, delay: 4}
    hit:
      - {sound: entity.lightning_bolt.impact, volume: 0.6, pitch: 1.2, delay: 0}
      - {sound: item.trident.thunder, volume: 0.35, pitch: 1.3, delay: 1}
      - {sound: entity.breeze.wind_burst, volume: 0.4, pitch: 1.1, delay: 3}

  air_stacking:            # 027 허공 쌓기 — 바람에 실려 착착착 놓이는 블록
    cast:
      - {sound: entity.breeze.whirl, volume: 0.35, pitch: 1.5, delay: 0}
      - {sound: block.stone.place, volume: 0.45, pitch: 1.2, delay: 3}
      - {sound: block.stone.place, volume: 0.4, pitch: 1.35, delay: 6}
      - {sound: block.stone.place, volume: 0.35, pitch: 1.5, delay: 9}
      - {sound: block.amethyst_block.chime, volume: 0.25, pitch: 1.8, delay: 12}

  arrested_orbit:            # 028 퍼붓는 화살 — 화살 5개가 떠오르고 타타타탁 연사
    cast:
      - {sound: entity.breeze.charge, volume: 0.5, pitch: 1.3, delay: 0}
      - {sound: entity.arrow.shoot, volume: 0.45, pitch: 1.4, delay: 8}
      - {sound: entity.arrow.shoot, volume: 0.45, pitch: 1.5, delay: 11}
      - {sound: entity.arrow.shoot, volume: 0.45, pitch: 1.6, delay: 14}
      - {sound: entity.breeze.shoot, volume: 0.45, pitch: 1.5, delay: 17}
      - {sound: entity.arrow.shoot, volume: 0.45, pitch: 1.75, delay: 20}
    hit:
      - {sound: entity.arrow.hit, volume: 0.35, pitch: 1.4, delay: 0}
      - {sound: entity.wind_charge.wind_burst, volume: 0.2, pitch: 1.7, delay: 0}

  crossfire:            # 029 크로스 애로우 — 처형 궁극기: 하늘 양쪽에 맺히는 화살, 동시 내리꽂기
    cast:
      - {sound: entity.illusioner.prepare_mirror, volume: 0.6, pitch: 1.1, delay: 0}
      - {sound: entity.breeze.charge, volume: 0.7, pitch: 0.9, delay: 6}
      - {sound: item.crossbow.quick_charge_3, volume: 0.6, pitch: 1.0, delay: 18}
      - {sound: block.amethyst_block.resonate, volume: 0.6, pitch: 1.3, delay: 24}
      - {sound: entity.phantom.swoop, volume: 0.7, pitch: 0.9, delay: 34}
    hit:
      - {sound: item.trident.hit_ground, volume: 0.9, pitch: 0.8, delay: 0}
      - {sound: entity.player.attack.crit, volume: 0.8, pitch: 0.9, delay: 0}
      - {sound: entity.wind_charge.wind_burst, volume: 0.8, pitch: 0.7, delay: 2}
      - {sound: entity.player.attack.sweep, volume: 0.7, pitch: 0.8, delay: 4}
      - {sound: block.bell.resonate, volume: 0.4, pitch: 0.8, delay: 8}

  resonant_arrow:            # 030 미스틱 슈터 — 자동 추가 화살: 공명하는 짧은 쉭(스팸 안전)
    cast:
      - {sound: entity.arrow.shoot, volume: 0.3, pitch: 1.5, delay: 0}
      - {sound: block.amethyst_block.hit, volume: 0.25, pitch: 1.8, delay: 1}
    hit:
      - {sound: entity.arrow.hit, volume: 0.3, pitch: 1.4, delay: 0}
      - {sound: block.amethyst_cluster.hit, volume: 0.2, pitch: 1.7, delay: 0}

  pressure_rupture:            # 031 토네이도 스핀 — 몸 주위로 휘몰아치는 회오리 + 밀쳐내는 폭발
    cast:
      - {sound: entity.breeze.whirl, volume: 0.7, pitch: 1.0, delay: 0}
      - {sound: entity.player.attack.sweep, volume: 0.5, pitch: 1.0, delay: 2}
      - {sound: entity.player.attack.sweep, volume: 0.45, pitch: 1.25, delay: 5}
      - {sound: entity.breeze.wind_burst, volume: 0.6, pitch: 0.9, delay: 8}
    hit:
      - {sound: entity.player.attack.knockback, volume: 0.55, pitch: 1.0, delay: 0}
      - {sound: entity.wind_charge.wind_burst, volume: 0.4, pitch: 1.2, delay: 1}

  storm_crown:            # 032 삼중 탄환 — 색이 다른 세 화살: 음높이가 다른 세 번의 발사(대형)
    cast:
      - {sound: entity.breeze.charge, volume: 0.6, pitch: 1.0, delay: 0}
      - {sound: block.amethyst_block.resonate, volume: 0.5, pitch: 1.2, delay: 6}
      - {sound: entity.breeze.shoot, volume: 0.6, pitch: 1.0, delay: 14}
      - {sound: entity.breeze.shoot, volume: 0.6, pitch: 1.25, delay: 22}
      - {sound: entity.breeze.shoot, volume: 0.6, pitch: 1.5, delay: 30}
      - {sound: block.amethyst_block.chime, volume: 0.45, pitch: 1.7, delay: 32}
    hit:
      - {sound: entity.arrow.hit, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: entity.wind_charge.wind_burst, volume: 0.45, pitch: 1.3, delay: 1}
      - {sound: block.amethyst_cluster.hit, volume: 0.35, pitch: 1.6, delay: 1}

  landing_airbrake:            # 203 빗자루 차원이동 — 빗자루가 휙 사라졌다 앞에서 나타남
    cast:
      - {sound: entity.phantom.flap, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: entity.enderman.teleport, volume: 0.45, pitch: 1.5, delay: 1}
      - {sound: entity.breeze.wind_burst, volume: 0.45, pitch: 1.4, delay: 3}
      - {sound: block.amethyst_block.chime, volume: 0.3, pitch: 1.8, delay: 5}

  binding_pull:            # 315 끌어오기 — 바람 고리가 감기는 체인음 + 휙 끌려오는 바람
    cast:
      - {sound: entity.breeze.shoot, volume: 0.5, pitch: 1.1, delay: 0}
      - {sound: block.chain.place, volume: 0.45, pitch: 1.2, delay: 2}
    hit:
      - {sound: entity.breeze.inhale, volume: 0.5, pitch: 1.2, delay: 0}
      - {sound: block.chain.hit, volume: 0.45, pitch: 0.9, delay: 1}
      - {sound: entity.breeze.slide, volume: 0.45, pitch: 1.0, delay: 4}

  moon_wind:            # 317 반달 바람날 — 날개 차듯 쉭쉭 두 번 베어 날리는 바람날
    cast:
      - {sound: entity.phantom.flap, volume: 0.45, pitch: 1.4, delay: 0}
      - {sound: entity.player.attack.sweep, volume: 0.5, pitch: 1.5, delay: 1}
      - {sound: entity.player.attack.sweep, volume: 0.45, pitch: 1.7, delay: 4}
    hit:
      - {sound: entity.player.attack.knockback, volume: 0.45, pitch: 1.3, delay: 0}
      - {sound: entity.wind_charge.wind_burst, volume: 0.3, pitch: 1.6, delay: 1}

  gale_wings:            # 318 돌풍 날갯짓 — 거대한 날개를 내려치는 묵직한 펄럭 + 돌풍
    cast:
