      - {sound: ui.cartography_table.take_result, volume: 0.35, pitch: 1.4, delay: 0}
      - {sound: block.note_block.pling, volume: 0.3, pitch: 1.8, delay: 2}

  luminous_handover:       # 156 빛의 교대 — 우렁찬 섬광 종소리로 적의 시선을 끌어오는 도발
