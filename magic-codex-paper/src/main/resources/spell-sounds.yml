      - {sound: entity.generic.burn, volume: 0.5, pitch: 1.1, delay: 1}
      - {sound: entity.phantom.flap, volume: 0.35, pitch: 1.5, delay: 3}

  lava_suture:           # 060 용암 봉합 — 용암이 치익 식어 흑요석으로 굳는 소리
    cast:
