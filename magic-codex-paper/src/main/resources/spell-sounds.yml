      - {sound: block.bell.use, volume: 0.4, pitch: 1.7, delay: 2}

  seal_talismans:          # 307 봉인 부적 — 종이 부적 세 장이 휙휙 날아가 '착' 붙음
    cast:
      - {sound: entity.illusioner.cast_spell, volume: 0.4, pitch: 1.6, delay: 0}
      - {sound: item.book.page_turn, volume: 0.45, pitch: 1.6, delay: 1}
      - {sound: entity.allay.item_thrown, volume: 0.4, pitch: 1.4, delay: 3}
    hit:
      - {sound: item.book.put, volume: 0.45, pitch: 1.5, delay: 0}
      - {sound: block.amethyst_cluster.hit, volume: 0.35, pitch: 1.7, delay: 1}

  shield_slam:             # 308 방패 내려찍기 — 빛의 방패가 땅을 쾅, 기절시키는 금속 충격
