      - {sound: item.dye.use, volume: 0.45, pitch: 1.3, delay: 0}
      - {sound: block.note_block.iron_xylophone, volume: 0.35, pitch: 1.6, delay: 1}

  domain_stomp:            # 305 영역 선포 — 마력 발굽이 쿵 내리찍어 적을 튕겨 올리는 진동
