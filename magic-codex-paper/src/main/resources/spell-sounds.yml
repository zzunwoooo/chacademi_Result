    end:
      - {sound: block.stone.break, volume: 0.6, pitch: 0.8, delay: 0}
      - {sound: block.gravel.fall, volume: 0.4, pitch: 1.0, delay: 3}

  earth_elemental:       # 104 그놈 — 땅이 갈라지며 큰 흙 골렘이 일어나는 웅장한 소환
