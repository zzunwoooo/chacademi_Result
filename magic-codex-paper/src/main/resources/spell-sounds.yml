      - {sound: block.amethyst_cluster.hit, volume: 0.4, pitch: 1.9, delay: 1}
    end:
      - {sound: block.bell.resonate, volume: 0.35, pitch: 1.6, delay: 0}
      - {sound: block.amethyst_cluster.break, volume: 0.35, pitch: 1.4, delay: 3}

  solar_judgment:          # 147 태양의 심판 — 영창이 쌓이며 별이 이어지고 하늘의 태양 레이저가 내려꽂히는 궁극기
    cast:
      - {sound: entity.evoker.prepare_summon, volume: 0.7, pitch: 1.2, delay: 0}
      - {sound: block.beacon.activate, volume: 0.8, pitch: 0.9, delay: 6}
      - {sound: block.note_block.chime, volume: 0.6, pitch: 1.0, delay: 14}
      - {sound: block.note_block.chime, volume: 0.6, pitch: 1.33, delay: 20}
      - {sound: block.note_block.chime, volume: 0.6, pitch: 1.78, delay: 26}
      - {sound: block.bell.use, volume: 0.9, pitch: 0.8, delay: 34}
    hit:
      - {sound: entity.warden.sonic_boom, volume: 0.5, pitch: 1.6, delay: 0}
      - {sound: entity.generic.explode, volume: 0.7, pitch: 1.3, delay: 1}
      - {sound: entity.firework_rocket.large_blast, volume: 0.8, pitch: 0.9, delay: 2}
      - {sound: block.amethyst_block.resonate, volume: 0.7, pitch: 0.9, delay: 6}
    end:
      - {sound: block.beacon.deactivate, volume: 0.8, pitch: 0.8, delay: 0}
      - {sound: block.bell.resonate, volume: 0.5, pitch: 1.0, delay: 4}
      - {sound: entity.firework_rocket.twinkle_far, volume: 0.5, pitch: 1.2, delay: 10}

  firefly_mark:            # 148 반딧불 표식 — 작은 빛벌레가 파르르 날아오르는 소리
