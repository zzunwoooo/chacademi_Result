# 확성기 (오픈 전 메모 #102). 확성기를 손에 들고 우클릭 → 입력 창 → 보내면 1개를 쓰고 모든 서버 화면 위쪽에 공지.
# 반대 손에 든 아이템이 있으면 공지 위에 그 아이콘이 같이 뜨고, Ctrl(키 설정 "마우스 포인터")로 커서를 꺼내 올리면 아이템 설명이 보인다.
# 학교·야생·아레나·튜토리얼 모든 서버에 같은 파일을 둔다 (보낸 서버의 설정으로 검사, 표시 시간도 보낸 서버 값).
# 바꾼 뒤: /서버관리 새로고침 확성기
# 미리보기: /테스트 확성기 공지 (나에게만, 왼손 아이템) · /테스트 확성기 창 (입력 창, 소모 없음, 나에게만)

# 확성기 ItemsAdder 아이템 (namespace:id). ItemsAdder 정의는 docs/handoff/CLAUDE_OPENING_FINAL_PATCHES_20261026.md 참고.
item: "item:megaphone"

# 한 사람이 다시 쓰기까지 기다리는 초 (0~3600). 서버마다 따로 센다 (서버를 옮기면 처음부터).
cooldown-seconds: 30

# 문장 최대 글자 수 (10~100, 글자 하나 = 한글·영문·이모지 각 1자). 입력 창도 이 글자 수까지만 받는다.
max-length: 80

# 화면 위 공지를 띄워 두는 초 (2~30). 여러 개가 겹치면 받은 순서대로 하나씩 띄운다.
show-seconds: 6

# 다른 서버에도 보내기 (Velocity BungeeCord 채널, /공지 와 같은 방식). false 면 이 서버 접속자에게만.
cross-server: true

# 입력 창을 열어 두고 보내지 않을 수 있는 최대 초 (10~600). 지나면 다시 써야 한다 (확성기는 그대로).
prompt-timeout-seconds: 120

# true 면 ChacaNPC 의 금칙어(plugins/ChacaNPC/filter.yml banned-words)도 같이 막는다.
use-chacanpc-filter: true

# 막을 말. 띄어쓰기·기호를 무시하고 "포함"으로 검사한다. 걸리면 보내지 않고 확성기도 그대로.
banned-words:
  - 시발
  - 씨발
  - ㅅㅂ
  - ㅆㅂ
  - 병신
  - ㅂㅅ
  - 지랄
  - 좆
  - 존나
  - 개새끼
  - 미친놈
  - 미친년
  - 니애미
  - 느금
  - 섹스
  - 야동
  - 자살
  - 죽어버려
