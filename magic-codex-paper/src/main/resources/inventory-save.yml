# 인벤세이브 (오너 2026-10-26) — 학교·야생 모든 서버에 같은 파일을 둡니다.
# 고친 뒤: /서버관리 새로고침 인벤세이브   (서버마다)
#
# 인벤토리(핫바·지금 배낭 쪽 27칸·갑옷·왼손)에 인벤세이브가 있으면 죽어도 인벤토리와 경험치가 그대로 남고, 1개만 자동으로 씁니다.
# 아공간 배낭의 다른 쪽도 그대로 남아요. (지금 보이지 않는 배낭 쪽에 넣어 둔 인벤세이브는 세지 않습니다.)
# 큐디치·결투 경기 중 사망은 경기 규칙대로 — 인벤세이브를 쓰지 않습니다. keepInventory 게임룰이 켜진 세계도 쓰지 않습니다.

# ItemsAdder 아이템 id. 이 플러그인의 PDC 표식 magiccodexbridge:inventory_save (byte) 이 붙은 아이템도 인벤세이브로 봅니다.
item: "item:inventory_save"
item-name: "인벤세이브"

# 인벤세이브·배낭 떨어뜨리기를 쓰는 서버 (travel.yml server-id). 아레나는 넣지 마세요.
servers: [school, wild1, wild2]

# 인벤세이브 없이 죽으면 아공간 배낭의 다른 쪽(지금 안 보는 쪽) 아이템도 죽은 자리에 전부 떨어뜨립니다.
# 공유 DB 에서 먼저 비운 뒤에만 떨어뜨려서 복제가 생기지 않습니다. false = 다른 쪽은 그대로 (예전 동작).
drop-bag-pages-on-death: true
