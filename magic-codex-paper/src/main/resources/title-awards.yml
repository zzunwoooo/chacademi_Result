affinity:
  # 아무 NPC와 처음 이 점수에 닿으면 한 번 (오너 결정 2026-10-24: 30 친구 · 60 단짝 · 90 연인)
  first-any:
    30: suffix_affinity_friend
    60: suffix_affinity_bestie
    90: suffix_affinity_lover
  # NPC별 칭호 (오너 결정 2026-10-25): 그 NPC와 이 점수에 처음 닿으면 접두 "<NPC 이름>의" (예: 리아의). 접미 친구·단짝·연인과 붙여 "리아의친구".
  npc-threshold: 30
  # 자동 칭호: ChacaNPC 의 npcs/*.yml (id·name) 마다 prefix_npc_<id> 칭호를 만든다. format 을 비우면 자동 칭호를 끈다.
  # NPC 를 추가·이름 변경한 뒤: /서버관리 새로고침 칭호. titles.yml 에 같은 ID(prefix_npc_<id>)가 있으면 그쪽이 우선.
  npc-prefix:
    format: '{npc}의'
    color: '#96E4EC'
  # 특정 NPC만 다른 칭호를 주고 싶을 때: <NPC 등록 ID>: <titles.yml 칭호 ID>  (예: ria: prefix_custom_ria)
  npc: {}

# 낚시: 규칙 ID 아래 min-cm 이상(fish 를 적으면 그 물고기만)을 잡아 수조에 넣으면 한 번. 오너 기획 (수치 임시, 2026-10-25)
fishing:
  big_catch:
    min-cm: 100
    fish: ''                              # 비우면 모든 물고기
    title: suffix_ach_fishing_big_catch   # 대물
  monster_catch:
    min-cm: 200
    fish: ''
    title: prefix_ach_fishing_monster_catch   # 괴물같은
