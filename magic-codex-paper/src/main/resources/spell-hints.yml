# 마법별 힌트 문장 (마법 힌트권 타로 · 깨달음의 빛 · NPC 힌트가 같이 씀) — 오너 2026-10-26
# 1 = 1성: 아주 막연하게 (원소·느낌만 비유로)
# 2 = 2성: 무엇을 하면 될지 돌려서 암시 (숫자·정확한 이름 없이)
# 3성은 코드가 발견 조건(condition-text) + 지금 진행도로 자동으로 만듦 — 여기 쓰지 않음
# 발견 조건(magic-discovery-paper discoveries.yml)을 바꾸면 그 마법의 줄도 같이 고칠 것 (docs/plans/spell-hints.md)
spells:
  # ── 바람 ──
  feather_fall:   # 깃털 낙하 (바람) — 낙하 피해를 받은 뒤 1회 사망하기.
    1: "높은 곳의 바람은 가끔 아프게 등을 떠밀어요…"
    2: "떨어져 다친 몸으로 쓰러져 본 적이 있나요? 그 뒤엔 바람이 받쳐 줄 거예요."
  wind_push:   # 윈드 푸쉬 (바람) — 하르바 교수의 바람 마법 기초 수업 듣기.
    1: "처음 만나는 바람은 등을 살짝 밀어 주는 손 같아요…"
    2: "바람을 가르치는 선생님의 첫 수업에 앉아 보면 밀어내는 힘을 배울 거예요."
  wind_message:   # 바람의 전언 (바람) — 1명과 친구가 되기.
    1: "바람은 혼자 부는 것보다 누군가에게 닿을 때 즐거워해요…"
    2: "마음이 통하는 동무를 사귀어 보세요. 바람이 서로의 말을 실어 줄 거예요."
  gale_dash:   # 바람 걸음 (바람) — 달리기로 누적 1,000블록 이동하기.
    1: "멈추지 않는 바람은 언제나 발끝에서 시작돼요…"
    2: "숨이 차도록 멀리멀리 달려 보세요. 발밑에 바람이 깃들 거예요."
  wind_grooming:   # 바람 털빗 (바람) — 가위로 양털을 10번 깎기.
    1: "포근한 무언가를 쓰다듬는 부드러운 바람이 있어요…"
    2: "복슬복슬한 친구들의 털을 가위로 다듬어 주다 보면 바람이 빗질을 배워요."
  trajectory_acceleration:   # 미라지 슈터 (바람) — 활로 몬스터를 30번 맞히기.
    1: "바람은 날아가는 것의 등을 밀어 주길 좋아해요…"
    2: "시위를 당겨 괴물들을 꾸준히 맞혀 보세요. 화살 끝에 바람이 올라탈 거예요."
  dust_duster:   # 클린 (바람) — 기숙사 배정받기.
    1: "새 보금자리에 부는 바람은 먼지부터 털어 내요…"
    2: "머물 방이 정해지는 날, 바람이 방 청소하는 법을 알려 줄 거예요."
  wind_needle:   # 바람 송곳 (바람) — 20블록 넘게 떨어진 적을 마법으로 20번 맞히기.
    1: "가늘고 날카로운 바람은 아주 먼 곳까지 닿아요…"
    2: "멀찍이 떨어진 적을 마법으로 거듭 맞혀 보세요. 바람이 뾰족해질 거예요."
  mini_twister:   # 작은 회오리 (바람) — 윈드 푸쉬를 50번 사용하기.
    1: "작은 바람도 자꾸 밀다 보면 빙글빙글 돌기 시작해요…"
    2: "처음 배운 밀어내는 바람을 지치도록 써 보면 바람이 돌돌 말릴 거예요."
  season_sense:   # 계절 예보 (바람) — 도서관에서 「계절 관측 일지」 책 읽기.
    1: "바람은 계절이 바뀌는 냄새를 누구보다 먼저 맡아요…"
    2: "도서관 어딘가, 계절의 변화를 꼼꼼히 적어 둔 기록을 찾아 읽어 보세요."
  light_leap:   # 상승기류 (바람) — 달리면서 점프한 횟수를 30번 채우기.
    1: "그 바람은 무척 빠르고 통통 튀어요…"
    2: "통통 튀는 바람 같은 속도로 달려 보면 바람을 이해하게 될 거예요."
  far_touch:   # 손길 너머 (바람) — 학교 도서관에서 '기계에 대한 이해' 책을 읽기.
    1: "손이 닿지 않는 곳도 바람은 살며시 건드릴 수 있어요…"
    2: "도서관에서 톱니와 장치의 원리를 풀어 쓴 책을 읽으면 손이 길어질 거예요."
  moon_wind:   # 반달 바람날 (바람) — 페가수스를 처치하면 5% 확률로 습득합니다.
    1: "달빛 아래 휘어진 바람은 칼날처럼 반짝여요…"
    2: "날개 달린 하얀 말을 쓰러뜨리다 보면, 언젠가 그 바람을 얻을지도 몰라요."
  light_step:   # 사뿐한 발걸음 (바람) — 농지를 밟아 흙으로 10번 망가뜨리기.
    1: "가벼운 바람도 너무 세게 디디면 땅이 놀라요…"
    2: "일궈 둔 밭을 뛰어올라 밟아 흙으로 되돌려 보면 발걸음의 무게를 알게 돼요."
  wind_basket:   # 바람바구니 (바람) — 아이템 300개 줍기.
    1: "바람은 흩어진 것들을 모아 담는 걸 좋아해요…"
    2: "길에 떨어진 물건들을 부지런히 주워 모아 보세요. 바람이 바구니가 돼 줄 거예요."
  harvest_wind:   # 수확의 바람 (바람) — 자라지 않은 밀·당근·감자를 각각 12개씩 잘라내기.
    1: "때 이른 바람이 밭을 스치면 아직 푸른 것들이 흔들려요…"
    2: "덜 여문 밀과 당근, 감자를 성급하게 베어 보면 바람이 거둠을 기억해요."
  vacuum_cleave:   # 윈드 커터 (바람) — 하르바 교수의 바람 마법 중급 수업 듣기.
    1: "바람도 날을 세우면 무엇이든 가를 수 있어요…"
    2: "바람 선생님의 조금 더 깊은 수업을 들으면 바람을 벼리는 법을 배워요."
  feather_rustle:   # 깃털 털기 (바람) — 닭에게 씨앗을 누적 16번 먹이기.
    1: "보송한 깃털 사이로 바람이 간질간질 지나가요…"
    2: "꼬꼬댁 우는 친구들에게 씨앗을 넉넉히 나눠 주다 보면 바람이 털을 골라 줘요."
  cross_breeze:   # 바람 화살 (바람) — 하르바 교수의 바람 마법 기초 수업 듣기.
    1: "곧게 뻗은 바람 줄기가 과녁을 찾아 날아가요…"
    2: "바람을 가르치는 분의 기초 시간, 칠판 구석에 과녁 그림이 그려져 있대요."
  returning_blade:   # 되돌이 칼날 (바람) — 윈드 커터를 50번 사용하기.
    1: "멀리 떠난 바람의 날은 꼭 주인 곁으로 돌아와요…"
    2: "바람을 벼린 칼날을 지겹도록 날려 보세요. 언젠가 돌아오는 길을 익힐 거예요."
  landing_airbrake:   # 빗자루 차원이동 (바람) — 빗자루를 타고 누적 1,000블록 날기.
    1: "하늘길을 오래 달린 바람은 지름길을 알아요…"
    2: "빗자루에 올라 아주 멀리까지 날아 보세요. 하늘이 접히는 순간을 만날 거예요."
  gale_wings:   # 돌풍 날갯짓 (바람) — 페가수스를 처치하면 5% 확률로 습득합니다.
    1: "커다란 날개가 퍼덕일 때마다 숲이 통째로 흔들려요…"
    2: "구름 위를 달리는 날개 달린 말과 겨뤄 보세요. 그 날갯짓이 옮아올지도 몰라요."
  feather_storm:   # 깃털 폭풍 (바람) — 히포그리프를 처치하면 5% 확률로 습득합니다.
    1: "흩날리는 보드라운 것들이 소용돌이치며 하늘을 덮어요…"
    2: "독수리 머리에 말의 몸을 한 짐승을 쓰러뜨리면 그 바람을 주울지도 몰라요."
  roar_leap:   # 포효 도약 (바람) — 만티코어를 처치하면 5% 확률로 습득합니다.
    1: "울부짖음과 함께 뛰어오르는 거친 바람이 있어요…"
    2: "사람 얼굴에 전갈 꼬리를 단 사자를 사냥하다 보면 그 도약을 배울 수도 있어요."
  gale_combo:   # 질풍 연격 (바람) — 근접 공격으로 몬스터 50마리 처치하기.
    1: "쉬지 않고 몰아치는 바람은 주먹처럼 매서워요…"
    2: "마법 없이 손에 든 무기로 괴물들을 거듭 쓰러뜨려 보세요. 바람이 연달아 몰아쳐요."
  herding_breeze:   # 몰이 바람 (바람) — 끈으로 동물을 묶어 끌고 누적 100블록 걷기.
    1: "바람은 길 잃은 동물들을 살살 모아 데려가요…"
    2: "동물에게 끈을 매어 나란히 오래 걸어 보세요. 바람이 몰이꾼이 돼 줄 거예요."
  resonant_arrow:   # 미스틱 슈터 (바람) — 미라지 슈터의 바람 화살로 적을 300번 맞히기.
    1: "바람이 실린 화살은 맞힐수록 맑은 소리로 울려요…"
    2: "신기루처럼 빨라지는 화살로 적을 끝없이 맞히면 화살이 노래하기 시작해요."
  binding_pull:   # 끌어오기 (바람) — 하늘뱀을 처치하면 5% 확률로 습득합니다.
    1: "하늘을 휘감는 길쭉한 바람이 무언가를 당겨 와요…"
    2: "구름 사이를 헤엄치는 긴 뱀을 쓰러뜨리면 당기는 바람을 얻을지도 몰라요."
  tailwind:   # 순풍 (바람) — 빗자루에서 10번 떨어지기.
    1: "넘어져도 등 뒤에서 다시 불어 주는 바람이 있어요…"
    2: "빗자루에서 미끄러져 떨어지는 일을 거듭 겪다 보면 바람이 등을 받쳐 줘요."
  flight:   # 비행 (바람) — 도서관에서 「비행 연구 기록」 책 읽기.
    1: "바람은 언젠가 당신을 하늘로 데려가고 싶어 해요…"
    2: "도서관 어딘가 하늘을 나는 법을 적은 기록이 잠들어 있대요."
  returning_wind:   # 되받는 바람 (바람) — 하르바 교수의 바람 마법 중급 수업 듣기.
    1: "날아든 것을 고스란히 돌려보내는 바람이 있어요…"
    2: "바람 선생님의 중간 단계 수업에서 막아 내고 돌려주는 바람을 다뤄요."
  leaf_cleanup:   # 잎새 청소 (바람) — 종류와 관계없이 묘목 20개 심기.
    1: "바람은 떨어진 잎을 쓸어 새싹 자리를 만들어 줘요…"
    2: "어린 나무를 여기저기 심어 보세요. 잎을 쓰는 바람이 찾아올 거예요."
  pressure_press:   # 윈드 프레스 (바람) — 바람 교실에서 「떨어지는 것들의 역학」 책 읽기.
    1: "위에서 아래로 내리누르는 묵직한 바람도 있어요…"
    2: "바람 교실 책장에서 떨어지는 것들의 이치를 다룬 책을 펼쳐 보세요."
  wind_decoy:   # 바람 미끼 (바람) — 반경 7블록 안에 몬스터 10마리와 함께 있기.
    1: "바람은 가끔 위험한 무리 한가운데에서 웃어요…"
    2: "괴물 떼에 둘러싸인 채 버텨 보세요. 바람이 그들의 눈을 홀릴 거예요."
  pressure_rupture:   # 토네이도 스핀 (바람) — 바람 교실에서 「회오리의 축」 책 읽기.
    1: "빙글빙글 도는 바람에도 가운데 중심이 있어요…"
    2: "바람 교실에 꽂힌, 소용돌이의 중심을 연구한 책을 찾아 읽어 보세요."
  vacuum_burst:   # 진공 폭발 (바람) — 바람 마법으로 몬스터 100마리 처치하기.
    1: "숨을 꾹 참은 바람이 한꺼번에 터지는 순간이 와요…"
    2: "바람 마법으로 괴물들을 아주 많이 쓰러뜨려 보면 바람이 터지는 법을 알아요."
  air_cannon:   # 공기 포탄 (바람) — 바람 화살로 적을 100번 맞히기.
    1: "뭉친 공기는 대포알만큼 단단해져요…"
    2: "곧게 쏘는 바람의 화살로 적을 수없이 맞혀 보세요. 공기가 뭉쳐질 거예요."
  air_step:   # 허공 디딤 (바람) — 비행 마법을 50번 사용하기.
    1: "하늘 위에도 발 디딜 곳은 있어요…"
    2: "하늘을 나는 마법을 자주자주 써 보세요. 허공에서 발판을 느끼게 될 거예요."
  air_stacking:   # 허공 쌓기 (바람) — 높이 150 이상 하늘에서 블록 64개 설치하기.
    1: "구름 높이에서 부는 바람은 무언가를 쌓고 싶어 해요…"
    2: "구름보다 높은 곳에 블록을 차곡차곡 놓아 보세요. 바람이 받쳐 줄 거예요."
  air_choke:   # 숨 막힘 (바람) — 1:1 결투에 10번 참가하기.
    1: "마주 선 사람들 사이의 바람은 숨죽여 있어요…"
    2: "다른 마법사와 맞서는 결투에 자주 나가 보세요. 상대의 숨결이 보일 거예요."
  storm_eye:   # 폭풍의 눈 (바람) — 되받는 바람을 50번 사용하기.
    1: "가장 거센 바람의 한가운데는 오히려 고요해요…"
    2: "날아든 것을 돌려보내는 바람을 수없이 펼쳐 보면 고요한 중심을 찾을 거예요."
  storm_command:   # 폭풍의 지휘 (바람) — 하르바 교수와 친해진 뒤(호감도 30) 바람 비전 수업 듣기.
    1: "거센 바람도 마음을 연 사람의 손짓은 따라요…"
    2: "바람 선생님과 깊이 친해지면 아무에게나 열리지 않는 비밀 수업에 불러 줘요."
  lightning_needle:   # 라이트닝 쇼크 (바람) — 번개가 내리치는 장면을 가까이(32블록 안)에서 보기.
    1: "먹구름 속 바람이 번쩍이는 바늘을 숨기고 있어요…"
    2: "번개가 내리꽂히는 순간을 아주 가까이에서 지켜보세요. 그 떨림이 남을 거예요."
  arrested_orbit:   # 퍼붓는 화살 (바람) — 하르바 교수의 바람 마법 고급 수업 듣기.
