    1: "견딘 아픔은 어둠 속에 잠시 맡겨 놓을 수 있어요…"
    2: "어떤 상처든 정말 많이, 오래도록 견뎌 보세요."
  night_lullaby:   # 밤의 자장가 (어둠) — 팬텀 30마리 처치하기.
    1: "밤하늘을 맴도는 것들도 자장가엔 잠들어요…"
    2: "잠 못 이룬 밤 찾아오는 날개 달린 괴물을 아주 많이 쓰러뜨려 보세요."
  shadow_scales:   # 어둠의 저울 (어둠) — 체력이 하트 1칸 이하인 상태에서 몬스터 처치하기.
    1: "생과 사의 저울은 아슬아슬할 때 기울어요…"
    2: "목숨이 겨우 붙어 있을 때 괴물을 쓰러뜨려 보세요."
  ghost_tool:   # 유령 도구 (어둠) — 곡괭이·도끼·삽을 각각 1개씩 내구도를 다 써서 부수기.
    1: "닳아 사라진 도구는 유령이 되어 곁에 남아요…"
    2: "곡괭이와 도끼, 삽을 모두 다 닳아 부서질 때까지 써 보세요."
  bell_of_fear:   # 공포의 종 (어둠) — 밤에 종을 10번 울리기.
    1: "밤에 울리는 종소리는 등골을 서늘하게 해요…"
    2: "어두운 밤에 마을의 종을 자꾸 울려 보세요."
  night_chain:   # 밤의 사슬 (어둠) — 그레고르 교감의 어둠 마법 고급 수업 듣기.
    1: "밤은 보이지 않는 사슬로 모든 것을 묶어요…"
    2: "어둠을 가르치는 분의 고급 수업에서 밤으로 묶는 법을 배워요."
  shadow_nail:   # 그림자 못 (어둠) — 1:1 결투에서 10번 이기기.
    1: "그림자에 박힌 못은 상대를 그 자리에 묶어 둬요…"
    2: "다른 마법사와 맞붙는 결투에서 거듭 이겨 보세요."
  warning_thread:   # 경고의 실 (어둠) — 도서관에서 「경계를 긋는 실」 책 읽기.
    1: "가느다란 실이 넘지 말아야 할 선을 알려 줘요…"
    2: "도서관에서 넘어서는 안 될 선을 실로 긋는 법을 적은 책을 찾아보세요."
  fate_link:   # 운명의 실 (어둠) — 밤의 사슬로 적을 100번 맞히기.
    1: "엮인 운명은 어둠 속에서도 끊어지지 않아요…"
    2: "밤으로 묶는 사슬 마법을 적에게 끝없이 맞혀 보세요."
  forbidden_contract:   # 금서의 계약 (어둠) — 그레고르 교감와(과) 친해진 뒤(호감도 30) 어둠 비전 수업 듣기.
    1: "봉해진 책장 너머 어둠이 손을 내밀어요…"
    2: "어둠을 가르치는 분과 깊이 친해지면 금지된 비밀 수업에 불러 줄지도 몰라요."
  void_maw:   # 공허의 입 (어둠) — 도서관에 숨겨진 「텅 빈 것의 식욕」 책 읽기.
    1: "텅 빈 어둠은 모든 것을 삼키고도 배고파해요…"
    2: "도서관 깊숙이 숨겨진, 텅 빈 것의 허기를 다룬 책을 찾아보세요."
  wraith_march:   # 망령의 행진 (어둠) — 어둠 마법으로 몬스터 300마리 처치하기.
    1: "쓰러진 것들의 그림자가 줄지어 걸어가요…"
    2: "어둠의 마법으로 괴물들을 셀 수 없이 쓰러뜨려 보세요. 망령들이 뒤를 따라요."
  eclipse_eye:   # 월식의 눈 (어둠) — 최대 마나 1,500 달성하기.
    1: "달이 가려지는 밤, 깊은 마력 속에서 눈이 떠져요…"
    2: "몸에 담기는 마나를 아주 크게 키워 보세요. 그때 달이 가려질 거예요."
  abyss_gate:   # 심연의 문 (어둠) — 어둠 마법 30종 습득하기.
    1: "가장 깊은 어둠 끝에 굳게 닫힌 문이 있어요…"
    2: "어둠의 마법을 거의 모두 익힌 이 앞에 바닥 없는 문이 열린대요."
