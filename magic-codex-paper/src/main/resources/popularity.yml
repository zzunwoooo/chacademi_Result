# 인기도 (메모 #87, 오너 2026-10-26)
# - 정보창에서 다른 플레이어의 인기도를 올리거나 내릴 수 있어요. 자기 자신은 안 돼요.
# - 같은 상대에게 하루 1번 (올리기든 내리기든). 상대마다 따로 세요.
# - 오늘 이미 조절한 상대에게 한 번 더 누르면 인기도 제한 해제권 1개를 자동으로 써서 한 번 더 해요. 없으면 거절 안내.
# - 하루 기준은 NPC 일일 제한과 같아요 (affinity.yml timezone, 기본 Asia/Seoul 자정).
# - 점수와 오늘치 기록은 공유 DB (MariaDB codex_popularity · codex_popularity_daily / SQLite popularity.db).
# 관리: /유저관리 <닉> 인기도 보기 | 설정 <값> | 초기화 · /유저관리 <닉> 일일제한 보기 | 초기화 인기도

# 인기도 제한 해제권 (ItemsAdder 아이템 ID)
unlock-item: "item:popularity_reset"
# NPC 호감도 기능이 꺼져 있을 때만 쓰는 하루 기준 시간대
timezone: Asia/Seoul
# 오늘치 기록을 며칠 보관할지 (서버 켤 때 더 오래된 줄을 지워요)
keep-days: 30

# 누른 사람에게 보이는 문구
messages:
  up: "인기도를 올렸어요"
  down: "인기도를 내렸어요"
  ticket-used: "인기도 제한 해제권 1개를 썼어요"
  limit: "오늘은 이미 이 사람의 인기도를 조절했어요. 인기도 제한 해제권이 있으면 한 번 더 할 수 있어요"
  self: "자신의 인기도는 조절할 수 없어요"
  busy: "처리 중이에요. 잠시 후 다시 눌러 주세요"
  failed: "인기도를 저장하지 못했어요. 잠시 후 다시 시도해 주세요"

# 대상에게 보이는 알림 (접속 중일 때, 공통 알림창). {player} = 올린 사람 닉네임
notify:
  up: "{player}님이 인기도를 올렸어요"
  down: "누군가 인기도를 내렸어요"
