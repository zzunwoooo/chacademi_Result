# 피피 튜토리얼 전용 재료 상점 (오픈 메모 #12, 2026-10-25)
# 고친 뒤: /서버관리 새로고침 튜토리얼상점   (학교·튜토리얼 서버마다)
#
# 동작
#  - 튜토리얼 대상 유저가 general-shops 의 상점(피피 잡화점)을 열면, 그 대신 shop 의 상점이 열립니다.
#    (대상 여부를 읽지 못하면 일반 상점도 열지 않습니다)
#  - 튜토리얼 대상 지정·해제는 스토리 단계의 시작명령으로 합니다:
#      /대화관리 단계 <재료를 사는 단계> 시작명령 추가 유저관리 {player} 튜토리얼상점 시작
#      /대화관리 단계 <그 다음 단계>     시작명령 추가 유저관리 {player} 튜토리얼상점 끝
#  - required 의 재료를 "대상이 된 뒤" 전부 산 상태로 상점 창을 닫으면 스토리 신호(signal)를 보냅니다.
#      /대화관리 단계 <재료를 사는 단계> 조건 추가 신호 튜토리얼재료구매 1 "재료 모두 사기"
#    (일부만 사면 보내지 않습니다. 결제가 끝난 구매만 셉니다 — 물건은 우편으로 옵니다)
#  - 대상·구매 기록은 상점 DB(shop-mailbox-database.properties)에 있어 서버끼리 같이 씁니다.

# 튜토리얼 전용 상점 ID. /상점관리 만들기 <ID> <이름> 으로 만들고 /상점관리 편집 으로 재료를 올리세요.
# 비워 두면 이 기능은 꺼져 있습니다 (모두 일반 상점).  — 오너 결정 필요: 상점 ID·이름
shop: "pipi_tutorial"   # 2026-10-25 오너: 1장 ch1-14 준비물 단계. /상점관리 만들기 pipi_tutorial 피피의 잡화점 → 편집에서 아래 이름으로 상품 등록

# 튜토리얼 대상에게 숨길 일반 상점 (대신 위 상점이 열림)
general-shops:
  - pipi

# 꼭 사야 하는 재료: 전용 상점의 상품 이름: 수량.  — 오너 결정 필요: 재료 목록·수량
# 예)
#   교복: 1
#   견습 지팡이: 1
required:
  교복: 1
  견습 지팡이: 1
  빈 마법서: 1

# 다 사고 창을 닫았을 때 보내는 스토리 신호 키 (steps.yml 의 조건 "신호" 대상과 같게)
signal: 튜토리얼재료구매
