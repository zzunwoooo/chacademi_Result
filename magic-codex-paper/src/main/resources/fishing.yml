# 차카데미 낚시 설정 (2026-10-20). 물고기는 fishing-fish.yml, 장비는 fishing-gear.yml, 보물은 fishing-treasure.yml.
# 바꾼 뒤 /서버관리 새로고침 낚시
settings:
  # 바닐라 낚싯대(장비 정보 없음)로 낚시할 때도 기본 세트로 미니게임을 연다
  enabled: true
  # 물 넓이 측정 상한 (칸). 이 이상은 전부 '대형'
  water-scan-limit: 4096
  # 입질까지 기다리는 시간 (초) 범위. 미끼 wait-reduction 이 줄여 줌
  wait-seconds: [3.0, 9.0]
  # 진짜 입질 전 '약올리기'(툭 건드리기) 횟수 범위
  teases: [1, 3]
  # 보물상자 기본 확률 (0~1)
  treasure-chance: 0.03
  # 줄이 끊겼을 때 낚싯줄 추가 내구도 감소
  snap-line-damage: 10

# 아공간 수조 (2026-10-20): 잡은 물고기는 인벤토리가 아니라 수조에 들어감. 가득 차면 낚시를 못 함.
tank:
  capacity: 100

# 미니게임 깊이 구간 (m)
zones:
  얕은: [0, 10]
  중층: [10, 25]
  깊은: [25, 50]
  심해: [50, 999]

# 실제 물 깊이(칸)에 따른 미니게임 최대 깊이 (m). 0 = 제한 없음(낚싯줄 길이만)
depth-cap:
  - {blocks: 1, meters: 10}
  - {blocks: 4, meters: 25}
  - {blocks: 8, meters: 50}
  - {blocks: 15, meters: 0}

# 물 크기 분류 (수면으로 이어진 물 칸 수의 최대값)
water-classes:
  웅덩이: 9
  연못: 100
  호수: 1000
  대형: 999999

# 구간별 등급 확률 (%). 미끼 rare-bonus 는 고급 이상 확률에 곱해짐 (1 + bonus/100)
rarity:
  얕은: {일반: 76.0, 고급: 20.0, 유일: 3.9, 전설: 0.1}
  중층: {일반: 57.0, 고급: 30.0, 유일: 12.5, 전설: 0.5}
  깊은: {일반: 43.0, 고급: 35.0, 유일: 20.5, 전설: 1.5}
  심해: {일반: 32.0, 고급: 35.0, 유일: 30.0, 전설: 3.0}

# 보물상자 등급 확률 (%) 구간별
treasure-rarity:
  얕은: {일반: 80, 고급: 17, 유일: 2.8, 전설: 0.2}
  중층: {일반: 65, 고급: 27, 유일: 7.5, 전설: 0.5}
  깊은: {일반: 50, 고급: 34, 유일: 14, 전설: 2}
  심해: {일반: 38, 고급: 37, 유일: 21, 전설: 4}

# 시간대 (마인크래프트 시간 0~24000)
times:
  새벽: [22500, 24000]
  낮: [0, 12000]
  황혼: [12000, 13500]
  밤: [13000, 23000]

