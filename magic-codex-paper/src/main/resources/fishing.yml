# 도감 완성 보상 (25·50·75·100%). commands 는 콘솔로 실행 ({player} = 이름, {uuid}), items 는 아이템 키:개수
# 도감 달성 보상. items: [아이템:개수], commands: 콘솔 명령 ({player}), display: 명령 보상을 도감 툴팁에 보여 줄 글 (예: "골드 5,000")
codex-rewards:
  25: {commands: [], items: [], display: []}
  50: {commands: [], items: [], display: []}
  75: {commands: [], items: [], display: []}
  100: {commands: [], items: [], display: []}

