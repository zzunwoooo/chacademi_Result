# 손에 든 등록된 마법봉·장신구만 강화합니다. 모든 수치는 서버에서 계산합니다.
maximum-attempts: 10
consume-attempt-on-failure: true
cost: 2000
# 성공 1회 상승량 = 단계값 × 아래 gain × 코어 성향 배율 (CoreAffinity: 지능 중심 코어 = 지능·마나·가속 모두 ×1,
# 마나 중심 = 지능 ×0.5 · 마나 ×2 · 가속 ×1, 가속 중심 = 지능 ×0.5 · 마나 ×1 · 가속 ×2).
# 단계값 = n번째 성공의 값 (전투 스펙 2026-10-26 오너 승인: 1~7단계 +5, 8~10단계 +2 = 지능 중심 코어의 지능 상승).
# 섞기 (오너 2026-10-26): 단계값 × 코어 품질 배율(아래 core-quality-multiplier, 노드 수별). 품질은 성공 확률·스타캐치 보너스에도 그대로 영향.
# 목록이 시도 횟수보다 짧으면 마지막 값을 계속 씁니다.
# 이 항목을 지우면 예전처럼 코어에 저장된 core_stat_gain 을 단계값 대신 씁니다.
stage-gains: [5, 5, 5, 5, 5, 5, 5, 2, 2, 2]
# 코어 노드 수 → 상승량 배율 (마법봉·장신구 공통). 3노드 = 1.0 기준, 10노드 1.15 (1.3 이면 적당↔한계 2.04배, 1.15 = 1.90배). 지우면 이 기본값.
core-quality-multiplier: {1: 0.9, 2: 0.95, 3: 1.0, 4: 1.02, 5: 1.04, 6: 1.06, 7: 1.09, 8: 1.11, 9: 1.13, 10: 1.15}
gain:
  power: 1.0
  mana: 2.5
  haste: 0.5
# 1코어에서 시작, 코어가 많을수록 더 짧은 타이밍 판정.
starcatch:
  interval-ms: 1100
  minimum-window-ms: 65
  first-window-ms: 155
  window-decrease-ms: 9
# 0 이상이면 감정 코어의 저장값 대신 이 성공 확률/보너스를 사용합니다.
# 예: 0.6 = 60%. 기본 -1은 코어 저장값 사용.
base-chance-override: -1
bonus-chance-override: -1

# 등급별 마법봉 (/아이템관리 마법봉 주기 <등급> [닉네임]). stats = [지능, 추가 마나, 마법 가속].
# 전투 스펙 2026-10-26: 지능 수습 20 · 일반 30 · 고급 45 · 유일 50 · 전설 55 (추가 마나는 제안서 §5 표).
# '/아이템관리 마법봉 주기' (등급 없이) = 수습.
wand-grades:
  수습: {name: "수습 마법봉", stats: [20, 50, 0]}
  일반: {name: "일반 마법봉", stats: [30, 50, 0]}
  고급: {name: "고급 마법봉", stats: [45, 120, 0]}
  유일: {name: "유일 마법봉", stats: [50, 135, 0]}
  전설: {name: "전설 마법봉", stats: [55, 150, 0]}

# 장신구(반지·귀걸이·목걸이) 강화 — 마법봉과 같은 강화 창(/강화)·마력코어·스타캐치·시도 횟수 규칙, 오르는 폭만 작습니다.
# 아티팩트 칸 아이템은 강화하지 않습니다. 장착 중인 장신구는 강화할 수 없고, 주 손에 들어야 합니다.
# 성공 1회 상승량 = 단계값 × gain × 코어 성향 배율. 코어 성향 → 장신구에서 중심이 되는 능력치:
#   지능 중심 코어 → 지능(작게)  ·  마나 중심 코어 → 최대 마나  ·  가속 중심 코어 → 초당 마나 회복 (장신구 강화는 가속을 올리지 않음)
# 기본값은 마법봉의 40~50% (단계값 5→2 · 2→1, 시도 10→5, 비용 2000→1000), 지능은 gain 0.5 로 한 번 더 작게.
# 5번 모두 성공했을 때 장신구 하나:
#   지능 중심 코어: 지능 +4 · 최대 마나 +20 · 회복 +1.2   마나 중심: 지능 +2 · 마나 +40 · 회복 +1.2   가속 중심: 지능 +2 · 마나 +20 · 회복 +2.4
accessory:
  enabled: true
  maximum-attempts: 5
  cost: 1000
  stage-gains: [2, 2, 2, 1, 1]
  gain:
    power: 0.5
    mana: 2.5
    regen: 0.15

# 등급별 장신구 기본 수치 (/아이템관리 장비 등급등록 <칸> <등급>: 손에 든 아이템을 그 등급 수치로 장신구 등록).
# [지능, 체력, 최대 마나, 초당 마나 회복, 마법 가속]. 전투 스펙 2026-10-26: 지능 3/6/7/9 · 체력 1/3/3/3 (마나·회복은 제안서 §5 표).
accessory-grades:
  일반: [3, 1, 30, 0.5, 0]
  고급: [6, 3, 60, 1.3, 0]
  유일: [7, 3, 80, 1.7, 0]
  전설: [9, 3, 100, 2.3, 0]
