# 지도 이동 (/지도) 설정 — 학교·야생 모든 서버에 "같은 파일"을 두고, server-id 한 줄만 서버마다 다르게 씁니다.
# 고친 뒤: /서버관리 새로고침 이동   (서버마다 한 번씩)
# 파일이 서버끼리 다르면 /서버관리 상태 · /컨텐츠관리 이동지점 목록 에 "travel.yml 다름" 이 표시됩니다.

# 이 서버의 서버 ID (아래 servers 의 키). 학교 서버 = school, 야생1 서버 = wild1, 야생2 서버 = wild2 ...
server-id: school

# 서버 목록. 키 = DB 에 저장되는 서버 ID (오너 2026-10-26: 야생 = wild1·wild2. 바꾸지 마세요 — 바꾸면 저장된 개인 지점이 "지도에서 빠진 서버" 가 됩니다).
#   proxy   = Velocity 서버 이름 (velocity.toml [servers] 의 이름)
#   enabled = false 면 그 서버로의 이동만 막고 지점·기록은 그대로 둡니다 ("이동할 수 없어요" 로 표시).
# 서버를 빼고 싶으면 지우지 말고 enabled: false 로 두는 걸 권장합니다 (지우면 그 서버 지점은 "지도에서 빠진 서버" 로 표시).
servers:
  school:
    proxy: school
    label: 학교
  wild1:
    proxy: wild1
    label: 야생1
  wild2:
    proxy: wild2
    label: 야생2
    enabled: true             # 오너 2026-10-26: 야생2 연결 (false 로 바꾸면 이동만 막고 closed-text 표시)
    closed-text: 준비 중입니다

# 지도 탭 (위에서부터 순서대로, 오너 결정: 학교 / 야생1 / 야생2).
#   server, world = 그 탭이 보여 주는 서버·세계
#   map: image   = 고정 그림 지도 (학교 타운맵). 그림은 리소스팩에, 아래 image 설정만 바꾸면 교체 끝 (코드 수정 없음)
#   map: terrain = 미니맵 지형 (각자 클라이언트가 다녀온 곳을 그려 저장, 서버 부담 없음)
#   map: none    = 좌표 격자 위에 지점만 표시
#   bounds (선택) = 지도에서 볼 수 있는 범위 (월드 보더 등). image 는 그림 범위를 씁니다.
tabs:
  school:
    label: 학교
    server: school
    world: world
    map: image     # 학교 타운맵 그림 (오픈 전 메모 #53, 2026-10-25)
    image:
      texture: magiccodex:textures/gui/travel/maps/school.png   # 리소스팩 안 경로 (PNG)
      size: [1479, 1064]                                         # 그림 가로·세로 픽셀
      # 그림 모서리 3곳이 가리키는 월드 좌표 [x, z] (그림의 왼쪽 위 / 오른쪽 위 / 왼쪽 아래 모서리).
      # 손으로 고치지 말고 게임 안에서 맞추세요: /컨텐츠관리 이동지점 지도 보기 (방법 안내)
      #   동상 한가운데 서서 → 지도 기준        (그림 동상 픽셀 493,432 = 지금 위치)
      #   멀리 알아보기 쉬운 곳에 서서 → 지도 두번째 <그림X> <그림Y>   (크기·회전까지 맞춤)
      #   조금씩 → 지도 밀기 <x> <z> · 지도 배율 <블록/픽셀> · 지도 회전 <도>
      # 처음 값: 동상 = 월드 32.5, 12.5, 1픽셀 = 0.25블록 (추정), 북쪽이 위
      top-left: [-90.75, -95.5]
      top-right: [279.0, -95.5]
      bottom-left: [-90.75, 170.5]
      anchor: [493.0, 432.0]   # 기준 픽셀 (배율·회전할 때 이 점은 제자리)
  wild1:
    label: 야생1
    server: wild1
    world: world
    map: terrain
    # bounds: { min-x: -5000, min-z: -5000, max-x: 5000, max-z: 5000 }
  wild2:
    label: 야생2
    server: wild2
    world: world
    map: terrain

# 공개 이동 지점. 키 = 지점 ID (영문 소문자·숫자·_·-, DB 해금 기록에 쓰이니 바꾸지 마세요).
#   name   = 표시 이름 (32자까지)
#   server, world, x, y, z, yaw, pitch = 도착 위치이자 발견(해금) 위치
#   radius = 처음 이만큼(블록) 가까이 오면 해금 (1~32, 기본 3)
#   enabled: false = 지도에서 이동 막기 (해금 기록은 남음)
# 게임 안에서: /컨텐츠관리 이동지점 추가 <ID> <반경> <이름>  (지금 서 있는 곳, 이 서버 파일만 바뀜)
points:
  # 야생 기본 스폰 (2026-10-24): 도착 = 그 세계의 스폰 (Multiverse /mv setspawn 으로 정함). 발견 필요 없음, 쿨타임 없음,
  # 학교에 있을 때만 (from), 야생에서는 못 감. 월드 이름이 world 가 아니면 world 를 바꾸세요.
  wild_spawn:
    name: 야생 스폰
    server: wild1
    world: world
    spawn: true
    from: [school]
  # 야생2 기본 스폰 (오너 2026-10-26 "타운맵이랑 야생2 연결"): 야생1 스폰과 같은 규칙 (학교 타운맵에서만 이동)
  wild2_spawn:
    name: 야생2 스폰
    server: wild2
    world: world
    spawn: true
    from: [school]
#  harbor_town:
#    name: 항구 마을
#    server: school
#    world: world
#    x: 120.5
#    y: 64
#    z: -340.5
#    yaw: 90
#    radius: 4

# 이동 규칙 — 오너 미정 사항이라 기본은 모두 꺼짐 (켜려면 오너 확인 후).
rules:
  block-in-combat: false   # (예전 설정) true = 아티팩트 전투 판정(최근 5초)으로도 막기. 전투 중 이동 막기(메모 #91)는 combat-lock.yml 에서 따로 켜고 끕니다
  cooldown-seconds: 0      # 이동 뒤 다음 이동까지 대기 (0 = 없음, 야생 스폰은 항상 없음)
  # 개인 지점으로 이동 (공간 도약으로 새긴 곳). 새기기는 무료, 이동할 때만 (오너 2026-10-24)
  personal-travel-mana: 100
  personal-travel-cooldown-seconds: 60
# 큐디치 경기 중 이동, 사망·관전 상태 이동, 캐릭터 정보 로딩 전 이동은 항상 막습니다 (기존 제한).

# 사망 귀환 (오너 2026-10-26): from 서버에서 죽으면 침대·리스폰 앵커와 상관없이 무조건 to-server 의 to-world 스폰
# (Multiverse /mv setspawn 으로 정한 곳)으로 보냅니다. 되살아나는 순간 그 세계 스폰에 잠깐 섰다가 곧바로 이동.
# from 에 없는 서버(학교·아레나)는 아무 일 없음 — 큐디치·결투 경기 중 사망은 경기 규칙대로. 끄려면 from: []
# 학교 서버가 닫혀 있거나 이동이 막히면 몇 번 다시 시도하고, 그래도 안 되면 알림 (그 자리에서 지도로 이동).
death-return:
  from: [wild1, wild2]
  to-server: school
  to-world: world

display:
  reveal-locked-names: false   # false = 미발견 지점은 "미발견 지점" 으로 표시

storage:
  # 해금·개인 지점은 공유 MariaDB(player-state-database.properties 또는 database.properties)에만 저장합니다.
  # MariaDB 가 없으면 지도 이동은 꺼집니다. 서버 한 대 테스트에만 true (로컬 travel.db, 다른 서버와 공유 안 됨).
  allow-local-test-db: false
