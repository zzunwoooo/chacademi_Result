# 운영 기록 (감사 로그, 메모 #92) — 누가 어떤 마법을 얻었다 / 무엇을 팔았다 / 어떤 퀘스트를 깼다 … 를 남겨
# 가끔 복구가 필요할 때 찾아본다. 학교·야생·아레나·튜토리얼 모든 서버에 같은 파일을 두고 server-name 만 다르게 써도 된다.
#
# 서버 부담: 게임 스레드는 메모리 대기열에 한 줄 넣기만 하고, 기록 스레드가 batch-seconds 마다 묶어서 DB 에 쓴다.
# 저장소: database.properties (일반 도메인과 같은 DB 설정 파일) — MariaDB 면 모든 서버가 공유 표 codex_audit_log 에 쓰고,
#        파일이 없으면 이 서버의 audit.db(SQLite). DB 가 안 되면 audit/yyyy-MM-dd.log 파일에 남긴다.
# 보기: /유저관리 <닉> 기록 [종류|전체] [일수] [쪽]   ·   /서버관리 기록 검색 <글자>   ·   /서버관리 기록 상태
# 바꾼 뒤: /서버관리 새로고침 운영기록 (queue-limit·batch-seconds 는 서버를 다시 켤 때 적용)

enabled: true

# 기록에 남길 서버 이름 (영문·숫자·_·- 48자). 비우면 quests.yml 의 server-id 를 쓴다.
server-name: ""

# 이 일수가 지난 기록은 하루 한 번 기록 스레드가 지운다 (DB 표와 audit 폴더 파일 모두).
retention-days: 90

# 몇 초마다 묶어서 쓸지 (1~60).
batch-seconds: 5

# 메모리 대기열 최대 줄 수. 넘으면 minor-kinds 의 오래된 줄부터 버리고 콘솔 경고 한 번.
queue-limit: 20000

# /서버관리 기록 검색 이 훑는 최근 일수 (오래된 줄까지 다 훑지 않게).
search-days: 7

# "돈" 종류: 관리자·상점 외 지급처럼 큰 변동만. 이 금액 이상일 때만 남긴다 (관리 명령 자체는 '관리자' 종류로 항상 남음).
money-threshold: 10000

# 대기열이 넘칠 때 먼저 버릴 사소한 종류.
minor-kinds: [접속, 낚시]

# 종류별 켜기/끄기 (false 로 두면 그 종류는 남기지 않는다).
kinds:
  마법: true       # 마법 획득(발견·수업·책 신호 포함)·잊기·관리자 배우기/잊기·발견 조건 지급/회수·기증
  상점: true       # 일반 상점(피피 잡화점 등·튜토리얼 상점) 구매·판매, 물고기 판매
  마일리지: true   # 마일리지샵 구매, 마일리지 지급/회수
  우편: true       # 우편 첨부 수령 (아이템 이름·개수)
  퀘스트: true     # 의뢰 수락·완료·보상
  스토리: true     # 스토리 단계 완료 (ChacademyStory)
  호감도: true     # NPC 호감도 변화 (선물·AI 대화·퀘스트·관리자), 선물 성공
  아티팩트: true   # 아티팩트 뽑기 결과·천장
  펫: true         # 교화(펫 획득), 펫 주기·회수
  강화: true       # 장비 강화 결과
  감정: true       # 감정 결과
  연금술: true     # 연금술 제작 (레시피에 등급이 없어 제작 전부)
  낚시: true       # 고급 이상 물고기·보물상자만 (일반 물고기는 통계 숫자로만)
  돈: true         # 상점 외 큰 재화 변동 (money-threshold 이상)
  관리자: true     # 바꾸는 관리 명령 실행 (/유저관리·/컨텐츠관리·/서버관리 … 보기·목록·상태·검색은 빼고)
  기숙사: true     # 기숙사 배정
  칭호: true       # 칭호 지급·회수
  접속: true       # 접속·퇴장 한 줄, 서버 이동 요청
  사망: true       # 사망 (원인·위치·아이템 잃음 여부)
  확성기: true     # 확성기 공지 (보낸 사람·문장·같이 보인 아이템 이름, 메모 #102)
  뽑기상자: true   # 뽑기 상자(API 상자) 개봉 — 상자·횟수·결과 (2026-10-26)
  후원: true       # 별풍선 후원 보상 (donation 플러그인·/후원관리) — 받은 사람·후원자 닉·종류·개수·금액·보상 (2026-10-26)

# 서버 통계 누적 카운터 (메모 #96): 화면 없음, codex_player_stats 표에 플레이어 × 항목 누적만 쌓는다.
# 메모리에서 세다가 flush-minutes 마다·나갈 때·서버가 꺼질 때 한 번에 DB 에 더한다 (사건마다 DB 쓰기 없음).
stats:
  enabled: true
  flush-minutes: 5
