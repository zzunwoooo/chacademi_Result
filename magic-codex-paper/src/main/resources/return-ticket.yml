# 귀환권 (오픈 메모 #14, 2026-10-25) — 우클릭하면 1개 쓰고 학교 스폰으로 이동합니다.
# 고친 뒤: /서버관리 새로고침 귀환권   (서버마다)
#
# 이동은 지도 이동(/지도)과 같은 길을 씁니다: 다른 서버면 서버를 옮긴 뒤 그 세계의 스폰(/mv setspawn)에 도착합니다.
# 큐디치 경기 중·사망·관전·캐릭터 불러오는 중에는 못 쓰고, travel.yml rules(이동 쿨타임)도 똑같이 적용됩니다.
# 전투 중(combat-lock.yml, 기본 10초)이면 귀환권을 쓰기 전에 막습니다 — 귀환권은 그대로 남아요.
# 이동이 실패하면 귀환권을 돌려줍니다 (접속 중이면 인벤토리, 아니면 우편).

# 귀환권 ItemsAdder 아이템 id (namespace:id).  — 오너 결정 필요: 실제 아이템 id (아이템 정의·텍스처는 오너 제작)
# 이 플러그인의 PDC 표식 magiccodexbridge:return_ticket (byte) 이 붙은 아이템도 귀환권으로 봅니다.
item: "item:home_ticket"
# 알림 문구에 쓰는 이름
item-name: "귀환권"

# 도착: travel.yml servers 의 서버 ID 와 그 서버의 세계 이름 (도착 위치 = 그 세계의 스폰)
server: school
world: world
