# 낚시 장비 (2026-10-20). id 는 아이콘 파일 이름과 같음 (textures/gui/fishing/equipment/<종류>/<id>.png).
# 등급: 일반·고급·유일·전설. 내구도 0 = 고장(장착 불가). special 은 특수 효과 코드, special-text 는 화면에 보일 설명.
# 각 종류의 default: true 장비가 '아무것도 없을 때' 기본 세트 (내구도·개수가 줄지 않음).
# rods: reel-power(감는 힘), hook-window(챔질 판정 초) / floats: sink-speed(m/초), sensitivity(입질 예고 초)
# itemsadder: 이 장비인 ItemsAdder 아이템 (낚싯대는 원본 재질 minecraft:fishing_rod). 내구도·끼운 부품은 DB(codex_fishing_gear)
# lines: length(최대 길이 m), max-tension(최대 장력) / baits: rare-bonus(%), wait-reduction(%)
