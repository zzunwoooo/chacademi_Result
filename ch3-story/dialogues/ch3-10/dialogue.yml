      - {who: isolde, face: "기본", text: "…이번 일은 같은 일이 아니었으면 좋겠네요."}
      - {who: me, face: "", text: "(호로겐…? 설마 이번에도 제물인가.)"}
      - {who: me, face: "", text: "(하지만 그때는 악마 소환의 제물이었다고 했어. 이번엔 딱히 그런 기미는 없는데.)"}
