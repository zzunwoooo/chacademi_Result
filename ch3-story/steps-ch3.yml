# 3장 「지워진 이름」 단계 — Claude 2026-11-03 (오너 확정 대본: 3장_스토리_설계.md)
# 학교 plugins/ChacademyStory/steps.yml 의 "단계:" 아래, ch2_5-end 다음에 그대로 붙인다.
# 신호: 포악한몬스터처치(야생 스크립트 story-ch3-hunt.sk) · 노엘메모(책 noel_memo) · 승급성공(기존)
