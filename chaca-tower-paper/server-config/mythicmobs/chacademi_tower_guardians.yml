# 탑 수문장 초안 (읽기 전용 조사 결과, 서버 미적용). Mobs 부분과 Skills 부분을 각각 Mobs/ , Skills/ 파일로 나눠 넣을 것.
# 피해 숫자 = 원본(YAML 또는 Java strike) 값 그대로. 탑은 (탑 공격력 / 이 몹 Damage) 배율을 모든 피해(chatelegraph 포함)에 곱한다
#   (TowerService.mobHitsPlayer: e.getDamage() * floors.damageMult(mob), damageMult = dmg / ATTACK_DAMAGE 기본값).
#   그래서 Damage 는 "패턴 대표 피해" 로 맞춰 둠 → 패턴 간 비율 유지.
# 공통 잠금: caster.busy (모르바스 방식). ~onTimer 로 고르고 패턴 끝에 풀림.

# ============================================================ Mobs
CA_Tower_Archlich:
  Type: ZOMBIE
  Display: '&5&l무덤의 대현자 &d모르바스'
  Health: 2700
  Damage: 12
  Armor: 12
  Faction: archlich
  Options: {MovementSpeed: 0.28, FollowRange: 40, KnockbackResistance: 1, PreventOtherDrops: true, PreventItemPickup: true, PreventSunburn: true, Silent: true, Despawn: false, Collidable: true}
  AIGoalSelectors: [clear, float, meleeattack, randomstroll]
  AITargetSelectors: [clear, players, attacker]
  Variables: {phase: 2, busy: 0}
  Skills:
  - addtag{t=chacademia_boss} @self ~onSpawn
  - model{mid=ca_archlich_p2;hb=true;n=false} @self ~onSpawn      # 2페이즈 모델 고정 (변신 없음). 1페이즈 모양이면 ca_archlich
  - state{s=spawn;li=0;lo=3} @self ~onSpawn
  - skill{s=CHA_ARCHLICH_SPAWN_LOCK} @self ~onSpawn
  - skill{s=CHA_TWR_ARCHLICH_AI} @target ~onTimer:40 ?variableequals{var=caster.busy;value=0} ?targetwithin{d=30}
  - state{s=death;li=0;lo=0} @self ~onDeath
  Drops: []

