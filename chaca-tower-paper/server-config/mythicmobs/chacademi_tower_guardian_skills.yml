# 탑 수문장 초안 (읽기 전용 조사 결과, 서버 미적용). Mobs 부분과 Skills 부분을 각각 Mobs/ , Skills/ 파일로 나눠 넣을 것.
# 피해 숫자 = 원본(YAML 또는 Java strike) 값 그대로. 탑은 (탑 공격력 / 이 몹 Damage) 배율을 모든 피해(chatelegraph 포함)에 곱한다
#   (TowerService.mobHitsPlayer: e.getDamage() * floors.damageMult(mob), damageMult = dmg / ATTACK_DAMAGE 기본값).
#   그래서 Damage 는 "패턴 대표 피해" 로 맞춰 둠 → 패턴 간 비율 유지.
# 공통 잠금: caster.busy (모르바스 방식). ~onTimer 로 고르고 패턴 끝에 풀림.

# ============================================================ Mobs
CHA_TWR_BUSY_ON:
  Skills:
  - setvariable{var=caster.busy;value=1;type=INTEGER} @self
CHA_TWR_BUSY_OFF:
  Skills:
  - setvariable{var=caster.busy;value=0;type=INTEGER} @self

# ---- 모르바스: 원본 YAML 스킬 그대로 (소환·변신만 뺌). 원본 스킬이 BEGIN/END 로 busy 를 직접 다룸.
CHA_TWR_ARCHLICH_AI:
  Skills:
  - randomskill{skills=CHA_ARCHLICH_BOLT_P2,CHA_ARCHLICH_BOLT_P2,CHA_ARCHLICH_CURSE_P2,CHA_ARCHLICH_STORM,CHA_ARCHLICH_REAP} @target

# ---- 재의 그림자 (AshShadowBoss.java claw/dash/slam/rain/sink/grasp/veil/ring 안쪽 원 → chatelegraph, 장치 배율 1.0 기준 피해)
