# 치유 물약으로 줄 아이템애더 아이템 (효과·재사용은 ChAcademiaMagicMythic health-potion)
potion-item: item:health_potion
potion-item-big: item:health_potion_big

# 층마다의 수치. 체력·공격력은 몹 원래 값에 곱한다. (층 1 = 아래 base, 층이 하나 오를 때마다 per-floor 만큼 더함)
balance:
  # 일반 몹을 정예 몹과 같은 체력대로 맞추기 위한 기준 체력 (원래 체력 대신 이 값에 배율을 곱함)
  # (11/12 밸런스) 한 층이 20~45초쯤 걸리게 체력을 낮췄다 (예전 40·150 은 1층부터 1분 가까이 걸림).
  normal-health: 26
  elite-health: 100
  # ★ 난이도 손잡이: 실제로 해 보고 너무 아프거나 안 아프면 이 두 값만 같은 비율로 고치면 된다 (예: 둘 다 ×0.8).
  normal-damage: 4
  elite-damage: 9
  health-base: 1.0
  health-per-floor: 0.09
  # 층마다 곱해지는 값 (1.02 = 층마다 2% 더). 체력 배율 = (health-base + health-per-floor × 지난 층) × health-growth^지난 층
  #   → 1·10·25·50층 = 1.0·2.3·5.7·18.1배. 최대 체력 2000 을 넘는 몫은 "받는 피해 나누기"로 들어간다 (체력바는 2000 까지만 보임).
  #   (마릿수·정예 비율까지 합치면 50층 한 층의 체력 합계는 1층의 약 170배 — 증강을 잘 쌓은 판의 피해가 그쯤 된다)
  health-growth: 1.025
  damage-base: 1.0
  damage-per-floor: 0.03
  # 공격력 배율 = (damage-base + damage-per-floor × 지난 층) × damage-growth^지난 층 → 1·10·25·50층 = 1.0·1.4·2.2·4.0배
  damage-growth: 1.01
  # 이동 속도: 층마다 speed-per-floor 씩 빨라져 최대 speed-max 배 (46층부터 최대). 신속·광폭 특성까지 합쳐도 원래의 speed-max-total 배를 넘지 않는다.
  speed-per-floor: 0.01
  speed-max: 1.45
  speed-max-total: 1.8
  # 마릿수 = count-base + 층 × count-per-floor (최대 count-max)
  count-base: 3
  count-per-floor: 0.18
  count-max: 11
  # 정예 비율: elite-from 층부터 elite-per-floor 씩 올라 최대 elite-max
  elite-from: 4
  elite-per-floor: 0.015
  elite-max: 0.55
  # 10층마다 수문장(정예 1마리, 체력 × guardian-health, 공격력 × guardian-damage, 보스바).
  # 수문장 체력 배수는 뒤로 갈수록 guardian-health-per-tier 씩 커진다 (10·20·30·40·50층 = 2.0·2.5·3.0·3.5·4.0)
  guardian-every: 10
  guardian-health: 2.0
  guardian-health-per-tier: 0.5
  guardian-damage: 1.5
  # 층이 이만큼 오를 때마다 한 번에 두 무리로 나뉘어 나온다 (앞 무리를 다 잡으면 다음 무리)
  second-wave-from: 15
  # ── 증강 계산 ──
  # 마법 피해를 탑 지능 기준으로 다시 맞출 때 쓰는 값. 서버 피해 공식이 (기본 + 계수 × 지능) 이고 기본/계수 평균이 약 12 라서 12.
  power-offset: 12
  # 생명 흡수 합계 상한, 생명 흡수 1.00 일 때 한 층을 다 잡으면 차는 체력 (예: 5% 카드 = 한 층에 4)
  lifesteal-cap: 0.15
  lifesteal-floor-heal: 80
  # 승전의 숨결(층을 깰 때 회복) 합계 상한
  vigor-cap: 0.5

# 몹 특성(패턴): from 층부터 chance (+ per-floor × 지난 층) 확률로 붙는다. 한 마리에 최대 max-affixes 개.
max-affixes: 2
affixes:
  swift:   {name: 신속, from: 6,  chance: 0.15, per-floor: 0.006}
  shield:  {name: 보호막, from: 11, chance: 0.12, per-floor: 0.006}
  vampire: {name: 흡혈, from: 16, chance: 0.12, per-floor: 0.005}
  split:   {name: 분열, from: 21, chance: 0.10, per-floor: 0.005}
  blast:   {name: 폭발, from: 26, chance: 0.10, per-floor: 0.005}
  frenzy:  {name: 광폭, from: 31, chance: 0.10, per-floor: 0.005}
  regen:   {name: 재생, from: 36, chance: 0.10, per-floor: 0.005}
  thorns:  {name: 가시, from: 41, chance: 0.08, per-floor: 0.005}

# ───── 카드 ─────
# 등급 (차카데미 아이템 등급과 같은 이름·색: 일반 · 고급 · 유일 · 전설). 확률 (%): 층이 오를수록 높은 등급이 잘 나온다. 1층 값 → 50층 값 사이로 선형.
grades:
  common:    {name: 일반, color: '#DCE3EA', floor1: 70, floor50: 35}
  rare:      {name: 고급, color: '#71E5F2', floor1: 24, floor50: 37}
  epic:      {name: 유일, color: '#D2A8FF', floor1: 5,  floor50: 21}
  legendary: {name: 전설, color: '#FFD582', floor1: 1,  floor50: 7}
# 탑 안 지능: 시작 값. 탑 안에서는 원래 지능(마법봉·장신구 포함) 대신 "시작 값 + 지능 카드" 로 친 것처럼 피해를 맞춘다.
start-intelligence: 20
# 탑 안 마나 최대치 (장신구·펫·아티팩트 보너스는 모두 빠지고 이 값으로 고정). 초당 회복은 규칙대로 최대치의 10% (start-mana-regen 에 값을 적으면 그 값)
start-mana: 300
start-mana-regen: 0
# 시작 때 주는 회복 포션 개수 (즉시 회복 투척 포션)
start-potions: 3
# 시작할 때 고르는 마법 수 (1~3)
start-spell-picks: 2
# 판마다 다시 뽑기 횟수
rerolls: 1
# 첫 카드에서 기본 공격 마법이 아닌 다른 마법이 섞일 확률
first-card-other-spell-chance: 0.1
# 기본 공격 마법 (첫 카드 3장 후보). 비우면 마법 목록에서 1서클 공격 마법
basic-spells: []
# 탑 마법 카드에서 빼는 마법 id
excluded-spells: []

# 보상은 인게임 /탑관리 보상 창에서 넣는다 (rewards.yml 에 저장): 도달 보상(5층마다 구간, 가장 높은 것 하나) · 첫 도달(10·20·30·40·50층) · 수문장(확률).

# 기록 DB: MagicCodexBridge 공용 MariaDB 설정 (없거나 sqlite 면 이 폴더의 records.db)
database-file: ../MagicCodexBridge/player-state-database.properties

# 탑 안에서 막을 모드 화면 채널 (소지품·능력치·위치가 바뀌는 것). 적지 않으면 기본 목록 (배낭 쪽 넘기기·우편·상점·강화·연금·아티팩트·장신구·펫·의뢰·이동 등).
# 다른 사람의 요청은 그대로 통과한다. 목록을 비우려면 locked-channels: []
# locked-channels:
# - magiccodex:bag_request
