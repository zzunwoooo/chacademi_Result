# ChacaTower — 1인 로그라이크 탑 (오너 2026-11-09).
# 위치·방 구역은 인게임 /탑관리 로 찍는다 (설정도구 · 시작 · 출구 · 입구). 숫자는 여기서 고치고 /탑관리 다시불러오기.

# 탑 이름 (안내 문구에 쓰임)
name: 무한의 탑
floors: 50

# 입장권 (ItemsAdder id). amount 0 = 무료
ticket:
  item: item:dungeon_ticket
  amount: 1

# 아래 위치들은 /탑관리 로 채워진다. "월드,x,y,z,yaw,pitch"
locations:
  # 판이 끝나면 돌아가는 자리 (비우면 입구)
  exit: ''
  # 입구 (이 반경 안에 들어오면 입장 안내가 뜸). 비우면 /탑 입장 명령으로만
  portal: ''
  portal-radius: 2.0
# 전투방 (여러 개 = 동시에 여러 판, 다 차면 대기열). 인게임: /탑관리 방 <이름> 으로 고를 방을 정하고 (기본 1)
#   설정도구 좌·우클릭 = 구역 두 모서리 "x,y,z", /탑관리 시작 = 층마다 서는 자리, /탑관리 소환자리 = 몹 나오는 자리 (없으면 구역 안 아무 데나).
# 예전 locations.start / room.corner1·2 는 켤 때 방 "1" 로 옮겨진다.
rooms: {}

# 층이 시작되기 전 대기 (초) / 층을 깬 뒤 카드가 뜨기까지 (초)
floor-start-seconds: 3
card-delay-seconds: 1
# 카드 고르는 시간 (초). 지나면 첫 번째 카드가 골라진다
card-seconds: 30
# 방 구역 밖에 이만큼 (초) 있으면 판이 끝난다
leave-grace-seconds: 5
# 대기열: 자리가 났을 때 입장까지 기다리는 시간 (초)
queue-offer-seconds: 30

# ───── 몹 ─────
# 몹 목록 (MythicMobs 내부 이름). normal = 일반, elite = 정예. 층이 오르면 정예 비율이 올라간다.
# 11/12 오너 "스킬 있는 몹 위주": 평타만 있는 11종(멧돼지·아기 설인·개구리 3·눈사람·도마뱀 2·늑대 2·이끼 멧돼지) 빼고, 스킬 있는 야생 몹(요정·늑대매·히포그리프·불사조·유령·천마·유니콘·빙핵) 추가.
# 11/12 밤 오너 "유도 몹은 적당히 배치": 따라오는 투사체 쓰는 몹(homing-mobs)은 homing-from 층부터, 한 층에 1 + (층 / homing-per-floors) 마리까지만.
mobs:
  normal: [CA_Wild_bear, CA_Wild_bear_black, CA_Wild_bear_polar, CA_Wild_crocodile, CA_Wild_raptor_red,
    CA_Wild_ncr_archer_skeleton, CA_Wild_ncr_spear_skeleton, CA_Wild_ncr_warrior_skeleton, CA_Wild_ogre_axe, CA_Wild_ogre_club,
    CA_Wild_sabertooth_arctic, CA_Wild_sabertooth_midnight, CA_Wild_sabertooth_savanna, CA_Wild_tusker_dreamlight, CA_Wild_tusker_forest,
    CA_Wild_wolfhawk_dire, CA_Wild_wolfhawk_fallen, CA_Wild_wolfhawk_fullmoon, CA_Wild_wolfhawk_stormcloud,
    CA_Wild_lostasset_mob2_flowersprite, CA_Wild_lostasset_mob2_lakefairy, CA_Wild_lostasset_mob2_leaffairy, CA_Wild_lostasset_mob2_mushroomfairy]
  elite: [CA_Wild_basilisk_obsidian, CA_Wild_basilisk_snowstorm, CA_Wild_basilisk_wild, CA_Wild_golem_arcane, CA_Wild_golem_corrupted,
    CA_Wild_golem_magma, CA_Wild_golem_royal, CA_Wild_ice_knight,
    CA_Wild_lostasset_mob3_herbgolem, CA_Wild_manticore_aether, CA_Wild_manticore_dusk, CA_Wild_manticore_soul, CA_Wild_manticore_venom,
    CA_Wild_mf_warden_archer, CA_Wild_mf_warden_knight, CA_Wild_mf_warden_tank, CA_Wild_ncr_mage_skeleton, CA_Wild_ogre_hammer,
    CA_Wild_raptor_nightmare, CA_Wild_raptor_undead, CA_Wild_stag_demonic, CA_Wild_stag_heavenly, CA_Wild_stag_rune, CA_Wild_stag_void, CA_Wild_tusker_demonic,
    CA_Wild_hippogryph_common, CA_Wild_hippogryph_crystal, CA_Wild_hippogryph_fallen, CA_Wild_hippogryph_royal,
    CA_Wild_phantom_ender, CA_Wild_phantom_ghost, CA_Wild_horse_pegasus, CA_Wild_horse_unicorn, CA_Wild_glacialcore,
    CA_Wild_phoenix_darkflame, CA_Wild_phoenix_flame, CA_Wild_phoenix_light, CA_Wild_phoenix_thunder,
    CA_Wild_kitsune_demonic, CA_Wild_kitsune_inferno, CA_Wild_kitsune_normal, CA_Wild_mf_warden_mage]
homing-mobs: [CA_Wild_lostasset_mob2_flowersprite, CA_Wild_lostasset_mob2_lakefairy, CA_Wild_lostasset_mob2_leaffairy, CA_Wild_lostasset_mob2_mushroomfairy,
  CA_Wild_phoenix_darkflame, CA_Wild_phoenix_flame, CA_Wild_phoenix_light, CA_Wild_phoenix_thunder,
  CA_Wild_kitsune_demonic, CA_Wild_kitsune_inferno, CA_Wild_kitsune_normal, CA_Wild_mf_warden_mage]
homing-from: 8
homing-per-floors: 15

