appId: kr.remyu.launcher
productName: '레뮤의 썰매라이더'
executableName: 'Remyu Launcher'
artifactName: 'Remyu-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '!library-transfer-current/**'
  - '!distribution-assets/**'
  - '!*-result.json'
  - '!release-files.json'
  - '!*.log'
  - '!dist*/**'
  - '!tools/**'
  - '!release-input*'
  - '!payload/**'
  - '!release-output/**'
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win:
  signAndEditExecutable: true
  icon: build/icon.png
  target: 
    - target: 'zip'
      arch: 'x64'
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  uninstallDisplayName: '레뮤의 썰매라이더'
  shortcutName: '레뮤의 썰매라이더'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages: [ko_KR]
  language: '1042'

# macOS Configuration
mac:
  icon: build/icon.png
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Remyu-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  icon: build/icon.png
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: '레뮤의 썰매라이더 마인크래프트 런처'
  description: '레뮤의 썰매라이더 서버 접속에 필요한 모드와 설정을 자동으로 준비하는 런처입니다.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

publish:
  # 런처 전용 업데이트 목록 (같은 저장소의 다른 런처와 "최신 릴리스"가 겹치지 않게 1.0.3부터 따로 둠)
  provider: generic
  url: https://raw.githubusercontent.com/zzunwoooo/chacademi_Result/refs/heads/claude/remyu-launcher-distro/launcher

forceCodeSigning: false

afterPack: tools/verify-packaged-dependencies.cjs
