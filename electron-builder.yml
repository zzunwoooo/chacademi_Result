appId: kr.rinko.launcher
productName: '린코 빚갚기'
executableName: 'Rinko Launcher'
artifactName: 'Rinko-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '!library-transfer-current/**'
  - '!distribution-assets/**'
  - '!*-result.json'
  - '!release-files.json'
  - '!*.log'
  - '!dist*/**'
  - '!app/assets/images/backgrounds/**'
  - '!tools/**'
  - '!release-input*'
  - '!payload/**'
  - '!release-output/**'
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win:
  signAndEditExecutable: true
  icon: build/icon.png
  target: 
    - target: 'zip'
      arch: 'x64'
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  uninstallDisplayName: '린코 빚갚기'
  shortcutName: '린코 빚갚기'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages: [ko_KR]
  language: '1042'

# macOS Configuration
mac:
  icon: build/icon.png
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Rinko-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  icon: build/icon.png
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: '린코 빚갚기 마인크래프트 런처'
  description: '린코 빚갚기 서버 접속에 필요한 모드와 설정을 자동으로 준비하는 런처입니다.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

publish:
  provider: github
  owner: zzunwoooo
  repo: chacademi_Result
  releaseType: release

forceCodeSigning: false

afterPack: tools/verify-packaged-dependencies.cjs
