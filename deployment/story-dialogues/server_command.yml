# 차카데미 스토리 — 대화가 "끝까지 정상으로" 끝났을 때 실행할 콘솔 명령 (2026-10-26 1장)
# 위치: 학교(school) plugins/ChacademyStory/dialogues/server_command.yml
# 고친 뒤: /서버관리 새로고침 스토리
#
# 2026-10-26 오너: 단계 시작명령이 안 돼서 전부 "앞 대화가 끝날 때" 실행으로 옮김.
# steps.yml 의 시작명령은 비울 것 (안 비우면 낚싯대 2개·분류창 2번):
#   (2026-10-27: steps.yml 의 시작명령은 이미 전부 비움)
#
# 키 = 대화 ID. {player} = 계정 이름, {ending} = 서버가 확인한 결말 장면.

commands:
  # 1-1 깨어남 끝 → 이름 정하기 창
  ch1-1:
    - "유저관리 {player} 닉네임 창열기"

  # 1-3 엘레나 인사 끝 → 하수구(구덩이). ★ 좌표 X Y Z 를 넣고 앞의 # 를 지울 것
  # ch1-3:
  #   - "minecraft:execute in minecraft:overworld run tp {player} X Y Z"

  # 1-7 브람 "출항이다!" 끝 → 항구 (배 컷신이 화면을 덮는 동안 옮김)
  ch1-7:
    - "minecraft:execute in minecraft:overworld run tp {player} 32.5 71 143.5 0 0"

  # 1-11 올레 첫 만남 끝 → 낚싯대
  ch1-11:
    - "아이템관리 낚시장비 bamboo_common 1 {player}"

  # 1-12 올레에게 물고기 보여 줌 끝 → 길잡이 별 마법 조건
  ch1-12:
    - "유저관리 {player} 마법조건 주기 guiding_star"

  # 1-13·1-14: 명령 없음 (2026-10-27 오너: 피피 준비물 사기·튜토리얼 상점 없앰)

  # 1-17 그레고르 "가고 싶은 곳이 있나?" 끝 → 희망 기숙사 기억 ({ending} = w_arkeon/w_lumina/w_bestiaz/w_noxer, 분류 점수 +1)
  ch1-17:
    - "기숙사분류 희망 {player} {ending}"

  # 1-18 분류의 거울 앞 끝 → 6문항 시작 (코드가 대화 ch1-19 를 띄움)
  ch1-18:
    - "기숙사분류 시작 {player}"

  # 분류의 거울 6문항(ch1-19) 끝 → 기숙사 배정 + 결과 대사(ch1-19r/m/f-*). 필수 (없으면 1장 멈춤)
  ch1-19:
    - "기숙사분류 결정 {player} {ending}"
