# 차카데미 대화 — Claude 작성 2026-10-20 · 2026-10-26 1장 다시 짜기 (저장소 ch1-14) · 2026-10-27 ch1-17 → ch1-19 (앞에 그레고르·거울 앞 단계가 생김, 첫 두 줄은 ch1-18 로)
format: 1
id: "ch1-19"
title: "1-19. 분류의 거울"
description: "분류의 거울 앞에 서서 네 기숙사 중 하나를 배정받으세요."
chapter: "1장 · 차카데미아"
start: a
dim: 0.35
type_speed: 0.03
type_sound: default
type_sound_volume: 0.5
speakers:
  me:
    name: "{player}"
  gregor:
    name: "그레고르 교감"
    npc: "vice_gregor"
    portraits:
      "기본": "vice_gregor-neutral.png"
  mirror:
    name: "분류의 거울"
scenes:
  a:
    name: "거울 앞"
    lines:
      - {who: mirror, face: "", text: "여섯 가지를 묻겠다. 생각하지 말고, 마음이 먼저 가는 쪽을 골라라."}
    next: q1
  q1:
    name: "1. 두 개의 문"
    lines:
      - {who: mirror, face: "", text: "끝에 문이 두 개 있다. 한쪽은 오래된 길, 한쪽은 아무도 가 본 적 없는 길이다."}
    choices:
      - {text: "오래된 길.", to: "q2_10_1"}
      - {text: "아무도 가 본 적 없는 길.", to: "q2_00_2"}
  q2_00_2:
    name: "2. 쓰러진 사람"
    lines:
      - {who: mirror, face: "", text: "아무도 가 본 적 없는 길이라… 바람 냄새가 나는구나."}
      - {who: mirror, face: "", text: "좋다. 다음."}
      - {who: mirror, face: "", text: "길 위에 누군가 쓰러져 있다. 주위에는 아무도 없다."}
    choices:
      - {text: "당장 달려가 일으킨다.", to: "q3_01_1"}
      - {text: "다가가기 전에 주위부터 살핀다. 왜 쓰러졌는지 알아야 하니까.", to: "q3_00_2"}
  q3_00_2:
    name: "3. 두 권의 책"
    lines:
      - {who: mirror, face: "", text: "흠, 눈이 먼저 움직였구나."}
      - {who: mirror, face: "", text: "계속하지."}
      - {who: mirror, face: "", text: "책 두 권을 주마. 백 년 동안 이어 써 온 책과, 아무것도 적히지 않은 새 책."}
    choices:
      - {text: "이어 써 온 책에 다음 장을 쓴다.", to: "q4_10_1"}
      - {text: "새 책에 처음부터 내 이야기를 쓴다.", to: "q4_00_2"}
  q4_00_2:
    name: "4. 잠긴 상자"
    lines:
      - {who: mirror, face: "", text: "처음부터 쓰는 자. 겁이 없구나."}
      - {who: mirror, face: "", text: "흐음… 하나 더."}
      - {who: mirror, face: "", text: "잠긴 상자가 있다. 열면 무언가를 잃는다고 한다."}
    choices:
      - {text: "일단 열어 본다. 잃는 건 그때 생각한다.", to: "q5_01_1"}
      - {text: "무엇을 잃는지부터 알아낸다.", to: "q5_00_2"}
  q5_00_2:
    name: "5. 오래된 규칙"
    lines:
      - {who: mirror, face: "", text: "값을 먼저 묻는구나. 영리한 건지, 조심스러운 건지."}
      - {who: mirror, face: "", text: "거의 다 왔다."}
      - {who: mirror, face: "", text: "모두가 지켜 온 규칙이 네 앞을 막아선다. 이유는 아무도 기억하지 못한다."}
    choices:
      - {text: "규칙에는 이유가 있었을 것이다. 따른다.", to: "q6_10_1"}
      - {text: "이유를 모르는 규칙이라면, 넘는다.", to: "q6_00_2"}
  q6_00_2:
    name: "6. 숲으로 간 친구"
    lines:
      - {who: mirror, face: "", text: "벽 너머가 궁금한 눈이로군."}
      - {who: mirror, face: "", text: "마지막이다."}
      - {who: mirror, face: "", text: "친구가 해 질 녘 금지된 숲으로 들어갔다. 돌아오지 않는다."}
    choices:
      - {text: "바로 뒤쫓아 들어간다.", to: "v_01_1"}
      - {text: "지도를 펴고, 친구가 갔을 길부터 짚어 본다.", to: "v_00_2"}
  q6_10_1:
    name: "6. 숲으로 간 친구"
    lines:
      - {who: mirror, face: "", text: "지켜 온 것을 지키는구나."}
      - {who: mirror, face: "", text: "마지막이다."}
      - {who: mirror, face: "", text: "친구가 해 질 녘 금지된 숲으로 들어갔다. 돌아오지 않는다."}
    choices:
      - {text: "바로 뒤쫓아 들어간다.", to: "v_11_1"}
      - {text: "지도를 펴고, 친구가 갔을 길부터 짚어 본다.", to: "v_10_2"}
