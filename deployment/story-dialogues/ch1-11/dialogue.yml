# 차카데미 대화 — Claude 작성 2026-10-20, 2026-10-25 실서버 번호(ch1-11)·셀마로 고침 · 2026-10-26 1장 다시 짜기 (실서버본 그대로)
format: 1
id: "ch1-11"
title: "1-11. 어부 올레"
description: "항구의 어부 올레에게 낚싯대를 받고 낚시로 돈을 벌어 보세요."
chapter: "1장 · 차카데미아"
start: a
dim: 0.35
type_speed: 0.03
type_sound: default
type_sound_volume: 0.5
speakers:
  me:
    name: "{player}"
  ole:
    name: "올레"
    npc: "vl_ole"
    portraits:
      "기본": "vl_ole-neutral.png"
scenes:
  a:
    name: "어부"
    lines:
      - {who: ole, face: "기본", text: "…피피가 보냈나. 학생 얼굴이구만."}
      - {who: me, face: "", text: "여비가 하나도 없어서요. 낚시를 배우고 싶어요."}
      - {who: ole, face: "기본", text: "그래. 이거 받아. 대나무 낚싯대다. 처음엔 이걸로 충분하다."}
      - {who: ole, face: "기본", text: "물가에서 찌를 던지고, 찌가 가라앉으면 기다려. 물고기가 약 올리듯 툭툭 건드릴 거다."}
      - {who: ole, face: "기본", text: "확 물면 그때 챔질. 욕심부려 너무 깊이 넣으면 줄이 끊긴다. 바다 얕보지 마."}
    choices:
      - {text: "잡은 물고기는 어떻게 해요?", to: "b"}
      - {text: "어디서든 낚을 수 있나요?", to: "c"}
  b:
    name: "물고기"
    lines:
      - {who: ole, face: "기본", text: "잡은 건 아공간 수조 마법으로 연 수조에 들어간다. 꽉 차면 더는 못 낚아."}
    next: e
  c:
    name: "물가"
    lines:
      - {who: ole, face: "기본", text: "물만 있으면 어디든. 바다, 강, 얼음물, 동굴마다 사는 놈이 다르다."}
    next: e
  e:
    name: "셀마"
    lines:
      - {who: ole, face: "기본", text: "어느 정도 잡으면 마을의 셀마한테 가져가. 물고기 사 주는 사람이다."}
      - {who: ole, face: "기본", text: "큰 놈일수록 값을 더 쳐준다. …여비 정도야 금방 모을 거다."}
