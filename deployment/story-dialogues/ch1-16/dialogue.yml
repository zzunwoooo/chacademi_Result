      - {who: luka, face: "기본", text: "눈썹이 이~만하고, 웃는 걸 본 사람이 아무도 없대. 틀리면 첫날부터 벌점이고…"}
    choices:
      - {text: "설마… 그 정도야?", to: "b"}
