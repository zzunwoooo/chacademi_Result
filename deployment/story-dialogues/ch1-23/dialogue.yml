      - {who: elena, face: "기쁨", text: "다들 안녕! 마법 이론을 맡은 엘레나야. 아, {player}도 있네?"}
      - {who: elena, face: "기본", text: "오늘은 딱 하나만 기억하면 돼. 같은 이론을 배워도, 그걸 마법으로 떠올리는 건 사람마다 달라."}
