      - {who: pipi, face: "기본", text: "학교 들어가서도 이것저것 다 돈이라구. 빈손으로는 못 버텨~"}
      - {who: pipi, face: "기본", text: "그래! 저기 항구 물가에 올레 아저씨 보이지? 가서 낚시라도 배워 볼래?"}
      - {who: pipi, face: "기본", text: "잡은 물고기는 셀마 씨가 사 준다구. 여비 좀 벌면 다시 들러!"}
