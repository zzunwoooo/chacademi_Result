# 동행 펫 (오너 2026-10-26, 메모 #81) - 자동 생성: magic-mythic-paper/tools/pet_companions.py
# 여기 있는 펫은 MCPets 몹을 소환하지 않고 클라가 작게 그립니다 (모든 사람에게 보임). 없는 펫(바닐라)은 예전 그대로.
# collection-health: 도감 체력 — 교화해 보유한 펫 등급 점수(points) 합이 많을수록 최대 체력 증가. 체력 = max × (보유 점수 / 전체 점수)^curve (전체 = 변색종 뺀 모든 펫)
# interval-seconds: 전투 중 스킬·특수 능력 주기 / combat-seconds: 마지막으로 때리거나 맞은 뒤 이만큼 = 전투 중
# blocked-matches: 이 경기 중에는 펫을 꺼낼 수 없음 (꺼내 둔 펫은 경기 시작 때 들어감)
# pets.<펫ID>: stars · motion(ground/fly/swim) · size(보이는 크기, 블록) · skills(CHA_PET_*, 무작위 1개) 또는 special · info(펫 창 설명)
#   permission(보유 권한) · mythic(예전 MCPets MythicMob, 변신 가면용) · icon(펫 창 아이콘: material·name·lore) — MCPets 없이 동작 (2026-10-26)
collection-health:
  points:
    '1': 1
    '2': 3
    '3': 6
  max: 20
  curve: 0.38
interval-seconds:
  '2': 60
  '3': 40
combat-seconds: 8
skill-range: 24
blocked-matches:
- quidditch
- duel
