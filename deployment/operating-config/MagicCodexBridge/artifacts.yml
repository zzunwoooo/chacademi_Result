#     description: 상세 패널에 보이는 짧은 설명 (최대 3줄, 200자). 줄바꿈은 \n
#     effect: 상세 효과. 설명에 마우스를 올리면 툴팁으로 전부 보임 (최대 600자)
#     icon: 아이콘 이미지 경로. 비워 두면 빈칸 (예: magiccodex:textures/artifact/sturdy_vest.png)
#     use: true면 사용형 (아티팩트 사용 키), cooldown: 재사용 대기 초 (0~86400)
#     order: 같은 등급 안에서의 정렬 순서 (작을수록 앞). 검수 목록 번호 × 10
