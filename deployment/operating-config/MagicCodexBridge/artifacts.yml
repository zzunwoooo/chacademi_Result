# 차카데미 아티팩트 도감 정의 (검수 완료 목록, 2026-10-15)
#
# 이 파일만 고치면 도감 내용이 바뀝니다. 고친 뒤 /서버관리 새로고침 아티팩트 (접속 중인 플레이어 도감도 바로 갱신).
# 모드(클라이언트)는 다시 배포할 필요 없습니다. 서버가 이 내용을 접속자에게 보내 줍니다. (아이콘 그림만 모드에 들어 있음)
#
# 보유: 권한 magiccodex.artifact.own.<아이디>  (전부: magiccodex.artifact.own.*)
#   예) /lp user 닉네임 permission set magiccodex.artifact.own.sturdy_vest true
# 장착: 도감에서 [장착]/[해제]. 장착 개수는 settings.max-equipped.
# 사용: use: true 인 아티팩트는 장착한 채 아티팩트 사용 키(기본 X)로 씁니다. cooldown = 재사용 대기(초, 0 = 없음).
# 효과: 150개 전부 구현 (2026-10-26 보류 29개 추가; ArtifactEffects / ArtifactActions / ArtifactLife, 2026-10-15, CC·원소 반응 개편 2026-10-20). 아이디가 효과와 묶여 있으니 아이디는 바꾸지 마세요.
#   (2026-10-21 보류 29개는 enabled: false 였으나 2026-10-26 모두 구현해 켬 — 모션·빗자루·마법 규칙·소환 묶음, docs/handoff/CLAUDE_ARTIFACTS29_*.md)

settings:
  max-equipped: 1          # 동시에 장착할 수 있는 아티팩트 수 (1~8)
  test-owns-all: false     # true면 모든 플레이어가 전부 보유한 것으로 표시 (UI 확인용, 운영 중에는 false)

# 유물함 소환 (/아티팩트소환 으로 창 열기 → [소환하기] 를 누르면 열쇠를 쓰고 결과는 서버가 정함)
summon:
  item: "item:random_artifact"   # 소모 아이템 (아이템애더 네임스페이스:아이디)
  item-name: "유물함 열쇠"        # 소환 창 안내문에 보이는 이 아이템의 이름 (아이템애더 표시 이름과 맞춰 주세요)
  cost: 1                        # 한 번에 쓰는 개수
  weights:                       # 등급 확률 비율 (합에 대한 비율, 5:3:1:0.1 = 일반 55% / 고급 33% / 유일 11% / 전설 1.1%)
    common: 5
    rare: 3
    unique: 1
    legendary: 0.1
  decoy-weights:                 # 고르지 않은 4상자에 잠깐 보이는 등급 (연출용, 실제 보상 없음). 4:3:2:1 = 전설 10%로 "아깝다" 느낌
    common: 4
    rare: 3
    unique: 2
    legendary: 1
  duplicate:                     # 이미 가진 아티팩트가 나오면 조각을 우편으로 보냄
    item: "item:artifact_shard"
    amount: {common: 1, rare: 1, unique: 1, legendary: 1}
    mail-title: "아티팩트 조각"
    mail-body: "이미 가진 아티팩트가 나와 조각으로 바꿔 드렸습니다."
  # 천장(pity)은 폐기 (2026-10-26 오너 결정 #98). 중복 조각은 상점 "아티팩트 교환소"(shops/artifact_exchange.yml)에서
  # 아래 등급 확정 뽑기권으로 바꾼다.
  tickets:                       # 등급 확정 뽑기권: 우클릭하면 소환 창이 열리고 그 등급으로 1회 뽑기 (중복이면 위 조각, 열쇠 뽑기와 같음)
                                 # 등급 키: common/rare/unique/legendary. 줄을 빼면 그 등급 확정권 없음. 그림은 ItemsAdder 쪽에서.
    common:    {item: "item:artifact_ticket_common",    name: "일반 확정 뽑기권"}
    rare:      {item: "item:artifact_ticket_rare",      name: "고급 확정 뽑기권"}
    unique:    {item: "item:artifact_ticket_unique",    name: "유일 확정 뽑기권"}
    legendary: {item: "item:artifact_ticket_legendary", name: "전설 확정 뽑기권"}


# 항목 형식
