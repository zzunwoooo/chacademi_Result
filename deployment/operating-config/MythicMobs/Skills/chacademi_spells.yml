# 피해량 <skill.var.damage> 는 MagicCodexBridge spell-runtime.yml 의 base-damage + power-ratio x 마력 으로 전달됩니다.
# cha* 메커닉은 ChAcademiaMagicMythic 플러그인이 제공합니다.

