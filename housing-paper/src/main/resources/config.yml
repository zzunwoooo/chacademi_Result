# 차카데미 하우징 (기숙사 내 방 꾸미기). /서버관리 새로고침 하우징 으로 다시 읽습니다.
# DB 는 plugins/ChacaHousing/database.properties (MagicCodexBridge 와 같은 형식, 공용 MariaDB 를 써야 학교·야생에서 같은 방이 보입니다).

# 이 서버 이름 (구경 중 명단·접속 표시에만 씀). 학교 서버는 school, 야생은 wild 처럼.
server-name: school

# 처음 방 크기 (N×N 칸, 최대 32)
start-size: 7

# 방 확장: 넓힐 크기 → 그 크기로 넓히는 비용 (Vault 돈). 위에서부터 차례로 한 단계씩 넓어집니다. 마지막 단계가 최대 크기 (지금 15×15).
# ※ 비용은 임시 값입니다. 오너가 정해 주세요.
expansion:
  9: 10000
  11: 25000
  13: 50000
  15: 100000

# /방구경 <닉네임> 을 기숙사실 밖에서도 쓸 수 있게 할지 (2026-10-21: 이 값과 상관없이 친구 방만 구경 가능 · 내 방·OP 예외)
visit-command: true

guestbook:
  cooldown-seconds: 10   # 한 사람이 글을 연달아 쓸 수 있는 간격
  keep: 100              # 방마다 남겨 두는 글 수 (오래된 것부터 지움)

# 좋아요(추천) 1회 제한 (2026-10-25 #78): 한 번 누르면 취소·다시 누르기 없음. 내 방에는 누를 수 없음.
#   room   = 방마다 한 번 (기본)
#   global = 모든 방을 통틀어 한 번만
like:
  limit: room

# 누적 방문 수 세는 기준 (방문 순위 /하우징관리 방문순위 에 쓰임)
#   day  = 같은 사람은 하루(한국 시간)에 한 번만 셈 (기본, 예전과 같음)
#   ever = 같은 사람은 그 방에 평생 한 번만 셈
visits:
  count-once-per: day

# 구경 중 명단·방 변경을 다른 서버와 맞추는 주기 (틱, 20틱 = 1초)
presence-interval-ticks: 40
