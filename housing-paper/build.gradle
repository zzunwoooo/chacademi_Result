plugins { id 'java' }
group = 'school.chacademia'
version = '0.1.2-usersearch.1'
base { archivesName = 'chaca-housing' }
repositories {
    if (findProperty('localDependencyRepo')) maven { url = uri(property('localDependencyRepo')) }
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    // Vault: reflection only (same as MagicCodexBridge ShopBridge).
    implementation files('../magic-codex-database/lib/mariadb-java-client-3.5.10.jar')
    testImplementation files('C:/Chacademi/network/school/libraries/org/xerial/sqlite-jdbc/3.47.0.0/sqlite-jdbc-3.47.0.0.jar')
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'com.h2database:h2:2.3.232'   // ExpandLedgerTest (in-memory SQL)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Shared wire format / layout rules with the MagicCodex client (HousingProtocol, HousingRules) and the shared DB helper.
sourceSets.main.java.srcDir '../magic-codex-protocol/src/main/java'
sourceSets.main.java.srcDir '../magic-codex-database/src/main/java'
jar {
    from { zipTree('../magic-codex-database/lib/mariadb-java-client-3.5.10.jar') }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
test { useJUnitPlatform() }
processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}
