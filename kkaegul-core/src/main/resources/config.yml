    amazing:     { name: "&d[님 개쩔어요]",   gacha-roll: 15, statue: true, statue-commands: [], description: "가챠 15/15/15 첫 달성 + 전용 동상" }
    jail_home:   { name: "&7[집이 깜빵]",       condition: "jail >= 50",        description: "깜빵 50회" }
    jail_server: { name: "&8[이분은 깜빵서버]", condition: "jail >= 100",       description: "깜빵 100회" }

