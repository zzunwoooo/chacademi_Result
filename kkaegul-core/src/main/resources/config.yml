  trigger-blocks: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, IRON_ORE, DEEPSLATE_IRON_ORE, GOLD_ORE, DEEPSLATE_GOLD_ORE, COAL_ORE, DEEPSLATE_COAL_ORE, REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE, LAPIS_ORE, DEEPSLATE_LAPIS_ORE, EMERALD_ORE, DEEPSLATE_EMERALD_ORE, COPPER_ORE, DEEPSLATE_COPPER_ORE]
  daily-moves: 3
  treasure-chance: 10           # 나머지 90% 는 제한맵
  stay-seconds: 300             # ★ 머무는 시간 (0 = 자동 복귀 없음)
  regen-blocks-per-tick: 4000
  auto-setup: true              # ★ 아래 구역의 월드(빈 월드)·바닥·벽·스폰을 처음 켤 때 자동으로 만듦
  generator: VoidGen
