# ─────────────────────────────────────────────────────────────
#  깨굴이의 위험한 초대 : 운빨깨굴랜드 — 코어 설정
#  (★ = 기획서에 숫자가 없어서 임시로 넣은 값. 의뢰인 확인 후 조정)
# ─────────────────────────────────────────────────────────────

server:
  start-date: "2026-11-10"      # 1일차
  end-date: "2026-11-20"
  timezone: "Asia/Seoul"
  daily-reset-hour: 0           # 하루 초기화 시각 (운세/접속보상/광산 횟수)

data:
  autosave-minutes: 3

# ItemsAdder emote 네임스페이스 글리프 (메시지에서 {e:이름} 으로 사용)
emote:
  enabled: true
  symbols:
    system: "⨏"
    error: "⨁"
    money: "⨀"
    right: "⨃"
    left: "⨆"
    shift: "⨉"
    npc: "⨌"
    jump: "⨍"
    w: "⑺"
    a: "⑹"
    s: "⑸"
    d: "⑷"
    star1: "⨄"
    star2: "⨇"
    star3: "⨊"
    broadcast: "⁜"

ui:
  force-fallback: false         # true 면 렌더러가 있어도 채팅/타이틀로만 출력 (테스트용)
  # 렌더러가 실제로 그리는 화면만 (나머지는 중앙 멘트/토스트/채팅/월드 전광판으로 대체)
  renderer-screens: [hud, gauge, diamond, fever, gacha, menu, player_select, nickname, submit, shop, frog_jump, race, race_hud, minigame, wasd, jail, jail_exit, quiz, fortune, mail, withdraw, donation_board, discord_link, land]
  fallback-debug-open: false    # 렌더러 없을 때 화면 열기 데이터를 채팅에 JSON 으로 찍기 (개발용)
  hud-refresh-ticks: 40
  fallback-hud-actionbar: true  # 렌더러 없는 클라에 액션바로 HUD 표시
  fallback-hud-format: "&b남은 다이아 &f{debt} &8| &e운빨 &f{gauge} &8| &a코인 &f{coins}{jail}"

# ── 다이아 장부 ──────────────────────────────────────────────
# "다이아" = 제출까지 남은 다이아. 증가 API는 늘리고, 감소 API·제출은 줄인다.
diamond:
  starting-debt-min: 500        # ★ 처음 시작할 때 목표(남은) 다이아 = min~max 랜덤
  starting-debt-max: 1500

# 보유 다이아: 주운 다이아(블록=9)는 인벤토리 대신 여기로. /인출 [개수], /입금
wallet:
  enabled: true
  blocks: true

# 강제졸업 방지: 1~2일차엔 남은 다이아가 threshold 미만이면 감소가 안 됨 (threshold 아래로도 안 내려감)
protection:
  enabled: true
  days: 2
  threshold: 500
  active-before-open: true      # 오픈 전(테스트 기간)에도 보호 적용
  force: "auto"                 # "auto" | "on" | "off"  ← 따옴표 필수 (/kg protection on|off|auto)

graduation:
  enabled: true
  revoke-on-increase: false     # 졸업 후 증가가 들어오면 졸업 취소할지
  ignore-increase: true         # ★ 졸업한 사람에게는 증가(룰렛·API)가 붙지 않음
  kick-after-seconds: 30        # ★ 졸업하면 N초 뒤 퇴장 (0 = 끔)
  kick-message: "&6졸업을 축하합니다! &f다이아를 모두 제출했어요."
  broadcast: "&6[졸업] &e{name}&f님이 다이아를 모두 제출하고 졸업했습니다!"
  commands: []                  # 예: "lp user {player} parent add graduated"

# ── 룰렛 ─────────────────────────────────────────────────────
roulette-defaults:
  spin-ms: 3000                 # 연출 시간 (피버 중엔 줄어듦)
  gap-ticks: 10                 # 같은 사람 룰렛 사이 간격
  stack-extras: false           # 게이지 1+1 과 피버 1+1 을 합칠지(false면 큰 쪽만)

roulette:
  increase:       { type: increase, min: 10,  max: 189,  label: "증가 룰렛" }
  decrease:       { type: decrease, min: 10,  max: 189,  label: "감소 룰렛" }
  big_increase:   { type: increase, min: 200, max: 2000, label: "빅증가 룰렛", spin-ms: 4500 }
  big_decrease:   { type: decrease, min: 200, max: 2000, label: "빅감소 룰렛", spin-ms: 4500 }
  small_increase: { type: increase, min: 1,   max: 50,   label: "소소 증가 룰렛" }   # ★
  small_decrease: { type: decrease, min: 1,   max: 50,   label: "소소 감소 룰렛" }   # ★
  tiny_increase:  { type: increase, min: 1,   max: 20,   label: "작은 증가 룰렛", allow-extra: false }  # ★ 부동산 개똥손

# ── 후원 API ─────────────────────────────────────────────────
# /kapi <플레이어> <번호>  (개인)   /ksapi <번호>  (섭주)
# 액션 문법은 docs/ACTIONS.md
api:
  announce: true
  queue-offline: true           # 오프라인 대상은 접속 시 실행
  labels:
    personal:
      "33": "음식"
      "50": "증가"
      "51": "감소"
      "500": "빅증가"
      "510": "빅감소"
      "111": "일반상자"
      "1111": "일반상자 세트"
      "555": "고급상자"
      "5555": "고급상자 세트"
      "112": "깜빵에서 운동하세요"
      "333": "개인 괴롭히기"
      "1000": "순회공연"
      "4444": "즉사"
    server:
      "189": "전체 일반상자"
      "350": "전체 랜덤상자"
      "500": "전체 고급상자"
      "333": "전체 괴롭히기"
      "1000": "다이아 증감 피버"
      "1289": "상자 피버 + 고급상자"
  personal:
    "33":   ["food"]
    "50":   ["roulette increase"]
    "51":   ["roulette decrease"]
    "500":  ["roulette big_increase"]
    "510":  ["roulette big_decrease"]
    "111":  ["box normal 1"]
    "1111": ["set normal"]
    "555":  ["box premium 1"]
    "5555": ["set premium"]
    "112":  ["jail"]
    "333":  ["harass"]
    "1000": ["tour"]
    "4444": ["death"]
  server:
    "189":  ["all box normal 1"]
    "350":  ["all box random 1"]
    "500":  ["all box premium 1"]
    "333":  ["harass-all"]
    "1000": ["fever diamond"]
    "1289": ["fever box", "all box premium 1"]

food:
  min: 3
  max: 11

# ── 상자 ─────────────────────────────────────────────────────
boxes:
  rare-broadcast: "&d[대박] &f{name}님이 {box}에서 &e{item}&f 획득!"
  normal:
    label: "일반상자"
    rolls: 1                    # 한 번 열 때 뽑는 횟수 (상자 피버 중 ×2)
    set-label: "일반상자 세트"
    set:                        # API 1111
      - "item cola 11"
      - "item inven_save_ticket 1"
      - "item coin_pouch 1"
      - "item teleport_ticket 1"
      - "item return_ticket 1"
      - "item gauge_random 1"
      - "chance 1 item SHULKER_BOX 1"          # ★ 극악 확률
      - "chance 1 item gacha_protect 1"
      - "chance 1 item farm_ticket 1"
    pool:                       # ★ 가중치는 임시
      cola:        { weight: 30, label: "콜라 3~11개", action: "food" }
      incen:       { weight: 12, label: "인벤세이브권", action: "item inven_save_ticket 1" }
      pouch:       { weight: 20, label: "깨굴코인 주머니", action: "item coin_pouch 1" }
      user_tp:     { weight: 10, label: "텔레포트권", action: "item teleport_ticket 1" }
      return:      { weight: 10, label: "귀환권", action: "item return_ticket 1" }
      gauge_rand:  { weight: 15, label: "랜덤 게이지 변동권", action: "item gauge_random 1" }
      shulker:     { weight: 1,  label: "셜커상자", action: "item SHULKER_BOX 1", rare: true }
      protect:     { weight: 1,  label: "가챠 파괴 방지권", action: "item gacha_protect 1", rare: true }
      farm:        { weight: 1,  label: "농사 금액 변동권", action: "item farm_ticket 1", rare: true }
  premium:
    label: "고급상자"
    rolls: 1
    set-label: "고급상자 세트"
    set:                        # API 5555
      - "item inven_save_ticket 4-8"
      - "item coin_pouch 5"
      - "item teleport_ticket 4-8"
      - "item return_ticket 4-8"
      - "chance 1 item SHULKER_BOX 1"
      - "chance 1 item invite_ticket 1"
      - "chance 5 box lucky 1"
      - "chance 10 item gacha_protect 1"
      - "chance 10 item gauge_ticket 1"
      - "chance 10 item farm_ticket 1"
      - "chance 10 item treasure_ticket 1"
    pool:
      incen:     { weight: 15, label: "인벤세이브권 4~8개", action: "item inven_save_ticket 4-8" }
      pouch:     { weight: 15, label: "깨굴코인 주머니 5개", action: "item coin_pouch 5" }
      user_tp:   { weight: 12, label: "텔레포트권 4~8개", action: "item teleport_ticket 4-8" }
      return:    { weight: 12, label: "귀환권 4~8개", action: "item return_ticket 4-8" }
      protect:   { weight: 10, label: "가챠 파괴 방지권", action: "item gacha_protect 1" }
      gauge:     { weight: 10, label: "게이지 변동권", action: "item gauge_ticket 1" }
      farm:      { weight: 8,  label: "농사 금액 변동권", action: "item farm_ticket 1" }
      mine:      { weight: 8,  label: "보물광산 이동권", action: "item treasure_ticket 1" }
      lucky:     { weight: 5,  label: "행운상자", action: "box lucky 1", rare: true }
      shulker:   { weight: 2,  label: "셜커상자", action: "item SHULKER_BOX 1", rare: true }
      invite:    { weight: 1,  label: "초대권", action: "item invite_ticket 1", rare: true }
  lucky:
    label: "행운상자"
    rolls: 1
    broadcast: "&6{name}님이 행운상자를 오픈!"
    pool:                       # 연 사람 보상
      pouch:   { weight: 40, label: "깨굴코인 주머니 10개", action: "item coin_pouch 10" }
      shulker: { weight: 25, label: "셜커상자", action: "item SHULKER_BOX 1" }
      mending: { weight: 20, label: "수선", action: "mending 1" }
      block:   { weight: 15, label: "다이아 블록 64개", action: "item DIAMOND_BLOCK 64", rare: true }
    # 전체 유저 이벤트 (하나만 발생)
    global-events:
      miss:      { weight: 20, label: "꽝" }
      buff:      { weight: 15, label: "1분간 행운/효율 +1", effect: buff, seconds: 60 }
      debuff:    { weight: 15, label: "1분간 행운/효율 -1", effect: debuff, seconds: 60 }
      diamond:   { weight: 15, label: "다이아 1~3개", actions: ["item DIAMOND 1-3"] }
      block:     { weight: 10, label: "다이아 블록 1~2개", actions: ["item DIAMOND_BLOCK 1-2"] }
      coin:      { weight: 15, label: "깨굴코인 1개", actions: ["coins 1"] }
      fatigue:   { weight: 5,  label: "채굴 피로 1분", effect: fatigue, seconds: 60 }
      freeze:    { weight: 5,  label: "3초 자리 고정", effect: freeze, seconds: 3 }

items:
  use-itemsadder: true          # ItemsAdder 가 있으면 item:<id> 아이템을 지급/인식 (없으면 아래 바닐라 방식)
  itemsadder-namespace: "item"
  use-item-model: false         # 리소스팩에 kkaegul:<id> 모델을 넣은 뒤 true (없을 때 켜면 보라/검정 텍스처로 보임)
  # 리소스팩에 모델이 있는 아이템 (ItemsAdder 안 쓸 때만 사용)
  model-ids: [cola, kkaekkaero, normal_box, premium_box, lucky_box, gacha_protect, teleport_ticket, coin_pouch, return_ticket, gauge_ticket,
              gauge_random, farm_ticket, treasure_ticket, invite_ticket, land_ticket, inven_save_ticket, fail_paper]
  coin_pouch:
    coins: "3-8"                # ★ 주머니 1개당 코인
  gauge_ticket:
    step: 10
  gauge_random:
    min: -10
    max: 10
  inven_save_ticket:                  # 인벤세이브권: 죽을 때 1장 자동 사용 → 아이템·레벨 유지
    keep-inventory: true
  # 아이템별 이름/설명/모델 덮어쓰기 예:
  # cola:
  #   name: "&c깨굴 콜라"
  #   lore: ["&7시원한 콜라 한 캔"]
  #   model: "kkaegul:cola"
  #   custom-model-data: 0

# ── 피버 ─────────────────────────────────────────────────────
fever:
  diamond:
    seconds: 90                # ★
    extra: 1                    # 1+1
    spin-factor: 0.5            # 룰렛 연출 시간 ×0.5 (빨라짐)
    triple-check-seconds: 30    # 피버 중 30초마다
    triple-chance: 15           # ★ 15% 확률로 3배 피버 발생
    triple-seconds: 30
    triple-extra: 2             # 1+2
    triple-spin-factor: 0.35
  box:
    seconds: 90                # ★
    multiplier: 2               # 상자 내용물 1+1

# ── 운빨 게이지 ──────────────────────────────────────────────
gauge:
  start: 50                     # ★ 서버 공용 게이지 시작값 (global.yml 에 저장, 모두가 같은 게이지)
  max: 99
  tiers:
    low:     { from: 0,  to: 40, bonus-diamond-min: 1, bonus-diamond-max: 2 }
    mid:     { from: 41, to: 51, diamond-block-chance: 30 }     # ★ 블록 드랍 확률
    high:    { from: 52, to: 91, destroy-factor: 0.6, roulette-extra: 1 }
    jackpot: { from: 92, to: 99, destroy-factor: 0.4, high-roll-factor: 2.0, roulette-extra: 2 }

# ── 채굴 ─────────────────────────────────────────────────────
mining:
  diamond-ores: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
  fortune-scale: 1.0            # 드랍 = 1 + 랜덤(0~행운) × scale
  fortune-cap: 1000000
  max-drops-per-ore: 64         # ★ 원석 1개당 최대 드랍

# ── 곡괭이 가챠 (3칸 슬롯) ───────────────────────────────────
# "555" = 행운·효율·내구성이 각각 1~5, "999" = 1~9, "151515" = 1~15
# 돌릴 때마다 세 칸을 새로 뽑아 덮어씀. 세 칸 모두 최대면 잭팟.
gacha:
  broadcast-destroy: true
  # ★ 돌리면 행운·효율·내구성이 각각 1 ~ 기계 max 중 하나로 "바뀜" (더하지 않음). 세 칸 모두 max = 잭팟.
  #   숫자별 확률을 바꾸려면 machines.N.levels: { "1": 10, "2": 10, ..., "15": 2 } (비우면 균등)
  #   운빨 게이지 92+ 면 위쪽 절반 숫자 가중치 ×2 (최대값 자체는 그대로)
  real-cap:                     # 실제로 붙는 인챈트 레벨 상한
    fortune: 255
    efficiency: 255
    unbreaking: 255
  machines:
    "1":
      label: "1번 기계 (555)"
      max: 5
      cost: 5
      destroy-chance: 0
      # levels 를 비우면 1~max 균등 확률. 숫자별 가중치를 주려면 예: levels: { "1": 30, "2": 25, "3": 20, "4": 15, "5": 10 }
    "2":
      label: "2번 기계 (999)"
      max: 9
      cost: 9
      destroy-chance: 4         # ★ % (중간)
    "3":
      label: "3번 기계 (151515)"
      max: 15
      cost: 15
      destroy-chance: 10        # ★ % (높음)

# ── 안전 구역 ── PK 금지 · 괴롭히기 몬스터 소환 금지 · 죽어도 아이템 유지
safe-zones:
  worlds: [lobby]               # 월드 전체가 안전 구역
  places:                       # 저장한 위치 둘레 반경(블록)
    village: 150
  keep-inventory: true

# ── 경제 ─────────────────────────────────────────────────────
economy:
  sell:                         # ★ 판매 = 다이아로 받음. 숫자 = "아이템 1개당 다이아" (금 1개 = 다이아 0.08개)
    COAL: 0.015                 #   소수점은 개인별로 쌓였다가 1이 넘으면 다이아 1개로 들어간다 (버려지는 것 없음)
    RAW_IRON: 0.04
    IRON_INGOT: 0.05
    RAW_COPPER: 0.015
    COPPER_INGOT: 0.02
    RAW_GOLD: 0.08
    GOLD_INGOT: 0.1
    REDSTONE: 0.008
    LAPIS_LAZULI: 0.015
    EMERALD: 0.5
    QUARTZ: 0.02
    AMETHYST_SHARD: 0.03
  farm-reroll-minutes: 60
  farm:                         # ★ 작물 시세 = 1개당 다이아 범위, 1시간마다 랜덤
    WHEAT: { min: 0.008, max: 0.03 }
    CARROT: { min: 0.008, max: 0.03 }
    POTATO: { min: 0.008, max: 0.03 }
    BEETROOT: { min: 0.01, max: 0.04 }
    MELON_SLICE: { min: 0.005, max: 0.015 }
    PUMPKIN: { min: 0.03, max: 0.12 }
    SUGAR_CANE: { min: 0.008, max: 0.03 }
  coin:
    currency: diamond           # diamond = 다이아로 구매 (보유 다이아 → 인벤 다이아 순) / money = 돈
    price-diamonds: 15           # ★ 코인 1개 = 다이아 몇 개
    price: 1000                 # (currency: money 일 때) 코인 1개 가격
    click-amount: 1             # 코인 상점 NPC 클릭
    sneak-amount: 10            # 웅크리고 클릭
    max-per-buy: 100
    outcomes:
      fail:   { chance: 10, multiplier: 0, message: "&c구매 실패..." }
      normal: { chance: 79, multiplier: 1, message: "&a깨굴코인 {got}개 구매" }
      double: { chance: 10, multiplier: 2, message: "&e2배 구매! 깨굴코인 {got}개" }
      triple: { chance: 1,  multiplier: 3, message: "&63배 구매!! 깨굴코인 {got}개" }
  diamond-exchange:             # 의뢰인 고민 중 → 기본 꺼짐
    enabled: false
    coins-per-diamond: 1

# ── 개구리 경주 / 개구리 점프 (다이아 걸기) ──────────────────
casino:
  frog-race:                    # 개구리 4~6마리 경주, 번호에 다이아 걸기 — 건 사람끼리 나눠 갖기(수수료) + 못 맞히면 이월
    enabled: true
    frogs: 6
    cycle-minutes: 10            # ★ 몇 분마다 한 회차 (배팅 → 경주 → 결과). 아무도 안 걸어도 진행
    bet-seconds: 120            # 배팅 시간 (cycle 안에서)
    race-seconds: 18            # 우승 개구리 기준 대략 시간
    result-seconds: 10
    min-bet: 1
    max-bet: 100                # 한 사람이 한 경기에 걸 수 있는 최대 (여러 번호 합)
    fee-percent: 10             # ★ 배팅 합계에서 떼는 수수료(%) — 이게 다이아가 무한으로 늘지 않게 함
    seed: 0                     # 매 회차 서버가 상금에 보태는 다이아 (0 = 안 보탬)
    lane-spacing: 2.0           # 레인 사이 간격 (race-start 기준 옆으로)
    track-length: 19            # race-finish 를 안 정했을 때 결승선까지 블록 수
    announce-win: 100           # 이만큼 이상 따면 결과 알림에 이름
    watch-radius: 48            # 이 안에 있으면 경주 진행 막대가 화면에 뜸 (건 사람은 어디서든)
    model: ""                   # ModelEngine 개구리 모델 id (비우면 바닐라 개구리)
    names: [깨굴, 개굴, 뚱굴, 초록이, 폴짝, 연잎, 왕눈이, 꾸르]
    # 맵 위치: /깨굴 위치 저장 race-start (출발선 가운데에서 달릴 방향을 보고) · 선택: race-finish (결승선)
    # 안 정하면 맵 개구리 없이 창 속 경주로만 진행
  frog-jump:                    # 혼자 하는 버티기: 누를 때마다 한 칸, 멀리 갈수록 배수↑ 확률↓
    enabled: true
    min-bet: 1
    max-bet: 100
    announce-step: 7            # 이 칸 이상 가면 전체 알림
    machine-radius: 2.0         # frog-jump-machine.N 위치에서 이 거리 안의 블록을 우클릭하면 열림
    machine-block: ""           # 특정 블록만 (예: LODESTONE). 비우면 아무 블록
    steps:                      # ★ 칸별 성공 확률(%)과 그 칸까지 갔을 때 받는 총 배수
      1:  { chance: 85, multiplier: 1.1 }
      2:  { chance: 80, multiplier: 1.35 }
      3:  { chance: 75, multiplier: 1.8 }
      4:  { chance: 70, multiplier: 2.5 }
      5:  { chance: 65, multiplier: 3.8 }
      6:  { chance: 60, multiplier: 6.3 }
      7:  { chance: 55, multiplier: 11 }
      8:  { chance: 50, multiplier: 22 }
      9:  { chance: 45, multiplier: 49 }
      10: { chance: 40, multiplier: 120 }
      # 기댓값(누적확률×배수): 1칸 0.94 · 2칸 0.92 · 5칸 0.88 · 10칸 0.83 → 어디서 정산해도 장기적으로 손해

