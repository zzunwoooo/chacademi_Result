# ── 스타트 ───────────────────────────────────────────────────
nickname:
  min: 2
  max: 8
  pattern: "^[가-힣a-zA-Z0-9_]+$"   # 완성형 한글·영문·숫자·_ (자음/모음만은 불가)
  rule-text: "한글·영문·숫자 {min}~{max}글자"
  banned: [운영자, 관리자, admin, 섭주]
  allow-change: true              # /닉네임 으로 다시 바꾸기 허용
  force-on-join: true             # 처음 접속 + 렌더러 있으면 닉네임 창 자동 (닫기 불가)
  first-completes-profile: true   # 첫 닉네임 저장 = 프로필 완료
  client-nameplate: true         # 머리 위 이름표를 모드가 바꿀지. false = UnlimitedNametags 사용
  # UnlimitedNametags 설정 예: displayed-lines 에 "%kkaegul_title%" / "%kkaegul_nickname%" (또는 한 줄 "%kkaegul_display%")

# Colla-Bot mc-donation (donation 플러그인) 후원 → API 자동 실행
donation:
  enabled: true
  server-owners: []               # OP 가 받은 후원 = 섭주 API(api.server). 여기 적은 계정(이름/UUID)도 섭주로 봄. 나머지 = 받은 사람 개인 API
  chzzk-won-per-unit: 100         # 치즈 100원 = 1개 (SOOP 은 별풍선 개수 그대로)
  allow-test: true                # 치지직 테스트 후원도 실행
  ignore-types: []                # BALLOON, ADBALLOON, BATTLE_MISSION, CHALLENGE_MISSION, VIDEO_BALLOON, CHEESE, VIDEO_DONATION
  cancel-original: true           # donation 플러그인 기본 동작(콘솔 'api ...' 명령) 막기
  cancel-unknown: true            # 등록 안 된 개수도 기본 동작 막기
  announce: true
  announce-format: "&8[&d후원&8] &f{donor}님이 &e{target}&f님에게 &d{count}개 &7→ {label}"

profile:
  prompt-on-join: true
  max-name-length: 12
  on-complete-commands: []      # 예: 보이스 플러그인 설정 명령 ("{player}", "{voice}")

starter:
  give-pickaxe: false           # ★ 최초 장비에 곡괭이도 줄지
