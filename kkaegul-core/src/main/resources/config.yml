    none:      { chance: 18, message: "&7꽝이쥬~?", name: "없음" }
    leather:   { chance: 28, prefix: LEATHER,   pickaxe: WOODEN_PICKAXE,  message: "&f이거라도 어디야", name: "가죽 갑옷" }
    chainmail: { chance: 24, prefix: CHAINMAIL, pickaxe: STONE_PICKAXE,   message: "&7시스루 좋아하세요?", name: "사슬 갑옷" }
    iron:      { chance: 17, prefix: IRON,      pickaxe: IRON_PICKAXE,    message: "&f그나마 사람이네", name: "철 갑옷" }
    gold:      { chance: 10, prefix: GOLDEN,    pickaxe: GOLDEN_PICKAXE,  message: "&e지옥가선 맞진않겠어요", name: "금 갑옷" }
    diamond:   { chance: 3,  prefix: DIAMOND,   pickaxe: DIAMOND_PICKAXE, message: "&b아 이걸 뽑네;", name: "다이아 갑옷" }

land:
  allow-release: false         # ★ 땅 회수(땅문서 돌려받기) 허용 여부
  success-chance: 70
  fail-message: "&c와 개똥손ㅋ"
  fail-roulette: tiny_increase
  # ── 땅문서(= 토지 구매권) 청크 땅 ── 들면 경계·상태, 들고 우클릭 = 서 있는 청크 구매, 내 땅 안 오른쪽 위 카드 → 관리 창
  worlds: [world]               # ★ 땅을 살 수 있는 월드 (나머지는 전부 "제한")
  max-per-player: 0             # 1인당 최대 청크 수 (0 = 제한 없음)
  view-radius: 1                # 들었을 때 보여 줄 범위 (1 = 3×3 청크)
  excluded-places:              # ★ 저장한 위치 둘레 반경(블록) 안 청크는 제한 (위치가 그 월드에 있을 때만)
    village: 48
    gacha: 32
  excluded: []                  # 직접 원 지정: - { world: world, x: 0, z: 0, radius: 200 }
  # 보호 우회 권한: kkaegul.land.bypass (OP 기본)

wild:
