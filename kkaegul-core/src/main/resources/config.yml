    double: { chance: 10, factor: 2.0, message: "&e운이 좋네요. 2배 제출 성공" }
    minus30: { chance: 10, factor: 0.7, message: "&d다이아 기부 감사합니다." }
    minus50: { chance: 10, factor: 0.5, message: "&d다이아 기부 감사합니다." }

