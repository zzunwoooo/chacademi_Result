  max-total-bonus: 15           # 버프 합계 최대 15
  gauge-delta: { good: 3, bad: -3 }   # ★ 운세에 따라 운빨 게이지 오르내림 (0이면 끔)
  buff:
    min: 1
    max: 5
    messages: ["오늘은 곡괭이가 춤을 춥니다", "깨굴이가 당신을 응원해요", "다이아 냄새가 나요"]
