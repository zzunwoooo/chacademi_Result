# ── 미니게임 (깨굴이의 위험한 초대) ──────────────────────────
events:
  pepero:
    from: "2026-11-09"
    to: "2026-11-13"

minigame:
  load-worlds: []  # 서버 폴더에 있는 미니게임 월드 폴더를 켤 때 불러옴
  invite-min: 2
  invite-max: 6
  invite-delay-ticks: 100       # 초대장 띄우고 이동까지
  # OP 와 kkaegul.minigame.exempt 권한은 어떤 초대에도 뽑히지 않음. 감옥·광산·다른 게임 중인 사람도 빠짐
  auto:
    enabled: true
    from-day: 1                 # 이 일차부터 자동 진행 (/깨굴 게임 일정 으로 다음 시각 확인·변경)
  schedule:                     # ★ 게임마다 따로 돌아감 (동시에 열릴 수 있음, 한 사람은 한 게임만)
    invite:   { enabled: true, every-minutes: 30 }                      # 위험한 초대: 의자 수만큼, 1분 전 회색 예고
    treasure: { enabled: true, every-minutes: 180 }                     # 보물찾기
    casino:   { enabled: true, every-minutes: 180, offset-minutes: 90 } # 홀덤·섯다 번갈아, 보물찾기와 1시간 30분 어긋나게
  casino:
    accept-seconds: 60          # 초대장 수락 받는 시간 (/수락 또는 채팅의 [수락])
    min-held: 50                # ★ 초대장 받는 최소 보유 다이아
  games:
    pepero:
      enabled: false            # 이벤트 한정 — 필요할 때 켜기
      min-players: 2
      seconds: 15
      target-clicks: 60
      break-chance-per-click: 1.3   # 성공률 약 45% (성공 < 실패)
      success-actions: ["box premium 1"]
      fail-actions: ["roulette big_increase"]
    invite:
      enabled: true
      min-players: 1
      invite-min: 4                 # 의자 수만큼 (새로 뽑을 사람이 이보다 적으면 그 판은 건너뜀, 지난 판 사람은 빠짐)
      invite-max: 4
      wait-seconds: 20              # ★ 의자에 앉은 뒤 정신 차리는 시간
      length: 7
      seconds: 7
      per-key-seconds: 3            # ★ 키 하나마다 제한시간(초)
      naked: true                   # ★ 맨몸으로 초대 (아이템은 맡겼다가 끝나면 돌려줌)
      kill-after-ticks: 40          # ★ 실패하면 날아간 뒤 이 틱 후 사망 (아이템 유지, 0 = 안 죽임)
      countdown-ticks: 60
      chair-model: true             # 의자 그림 (클라이언트 모드의 flying_chair 모델)
      chair-me-model: flying_chair  # ModelEngine 모델 id (plugins/ModelEngine/blueprints/flying_chair.bbmodel). 비우면 클라이언트 모드 모델
      chair-me-animation: animation
      seat-height: 0.5              # 앉는 높이 (의자 위치 기준)
      launch-back: 3.5              # 실패 시 등 뒤로 날아가는 세기 (원본: 1.4)
      launch-up: 1.3                # 위로 뜨는 세기 (원본: 0.5 x 1.4)
      drop-delay-ticks: 40          # invite-drop 위치를 정했으면 날아간 뒤 그리로 이동 (안 정하면 수영장에 그대로)
      success-actions: []           # 비우면 우편함으로 고급상자
      fail-actions: ["roulette big_increase"]
    poker:                          # 텍사스 홀덤 — 수락한 사람끼리 3인/2인 테이블, 창에서 진행 (이동 없음)
      enabled: true
      min-players: 2
      duration-minutes: 15          # ★ 최대 게임 시간 (중간에 나가기 가능, 칩 다 잃으면 퇴장)
      big-blind: 1                  # ★ 판돈 1다이아 (스몰도 1)
      buyin-all: true               # ★ 가진 다이아 전부 칩으로 (칩 1개 = 다이아 1개, 제한 없음)
      turn-seconds: 20
      break-seconds: 5
      rake-percent: 5               # 이긴 칩에서 떼는 수수료(%)
      seat-interval-ticks: 12
      summary-seconds: 6
    seotda:                         # 섯다 — 수락한 사람끼리
      enabled: true
      min-players: 2
      duration-minutes: 15          # ★
      ante: 1                       # ★ 턴마다 내는 판돈 1다이아
      buyin-all: true               # ★ 가진 다이아 전부 칩으로
      max-raise-mult: 4
      max-raises: 2
      turn-seconds: 20
      break-seconds: 4
      rake-percent: 5
      seat-interval-ticks: 12
      summary-seconds: 6
    treasure:                       # 보물찾기 — treasure-start 둘레 땅 위에 상자를 숨김, 끝나면 그 월드 블록 전부 원래대로
      enabled: true
      min-players: 1
      invite-min: 30                # ★ 최대 30명
      invite-max: 30
      wait-seconds: 30              # ★ 도착 후 대기 (이 동안 반경 wait-radius 칸 안에서만)
      wait-radius: 15
      seconds: 60                   # ★ 찾는 시간
      area-radius: 170              # 상자 숨기는 범위 (treasure-start 에서 ±칸)
      spacing: 20                   # 상자끼리 최소 간격
      chests:                       # ★ 개수 · 알림 이름 · 보상 (important = 흰 글씨 알림, 아니면 회색)
        normal:  { count: 10, label: "일반 상자", actions: ["box normal 1"] }
        premium: { count: 5,  label: "고급 상자", actions: ["box premium 1"], important: true }
        coin:    { count: 20, label: "깨굴코인 5개", actions: ["coins 5"] }
        lucky:   { count: 1,  label: "행운 상자", actions: ["box lucky 1"], important: true }

# ── 디스코드 보이스 자동 이동 (kkaegul-discord-bot) ─────────
# 포커·섯다 테이블이 정해지면 같은 테이블 사람끼리 테이블별 음성 채널로 옮기고, 끝나면 원래 채널로 돌려보냄.
# 유저는 /디코연동 → 디스코드에서 /연동 <코드> 한 번만. 디스코드 음성 채널에 들어가 있는 사람만 옮길 수 있음.
discord:
  enabled: false
  bot-url: "http://127.0.0.1:8787"   # 봇 config.json 의 port 와 맞추기
  secret: "여기에-봇과-같은-비밀값"    # 봇 config.json 의 secret 과 같게 (아무 긴 문자열)

# 카드뽑기 (규칙 미정 → 임시, 기본 꺼짐). NPC 동작: card-draw
cards:
  enabled: false
  cost-coins: 3
  cards: 5
  outcomes:
    miss:    { weight: 40, label: "꽝" }
    coins:   { weight: 25, label: "깨굴코인 5개", actions: ["coins 5"] }
    normal:  { weight: 15, label: "일반상자", actions: ["box normal 1"] }
    down:    { weight: 10, label: "소소 감소", actions: ["roulette small_decrease"] }
    up:      { weight: 8,  label: "소소 증가", actions: ["roulette small_increase"] }
    premium: { weight: 2,  label: "고급상자", actions: ["box premium 1"], rare: true }

# 월드 전광판 (/kg setloc board.donation, board.farm, board.increased, board.breaks, board.deaths, board.remaining, board.donated, board.jail)
boards:
  refresh-ticks: 600

# ── NPC 사용자 정의 동작 (선택) ──────────────────────────────
# /kg npc bind <이름> 으로 연결. 기본 동작 목록은 /kg npc
npc-actions: {}

# ── 위치 (게임 안에서 /kg setloc <이름> 으로 저장하는 게 편함) ──
# 필요한 위치: lobby, start, village, gacha, jail, wild(선택),
#   mine.<구역>, pepero 또는 pepero.N.a/b,
#   invite-chair.1~N, invite-drop, treasure-start, gacha-machine.1~3
locations:                      # /kg setloc 으로 바꾸면 그쪽이 우선
  # 위험한 초대 맵(kkaegul_invite 월드) 의자 4개 — 원본 서버 chairs.yml 좌표, 무대(북쪽)를 바라봄. 실패하면 뒤쪽 수영장으로.
  invite-chair.1: "kkaegul_invite,-65.5,66.0,-36.5,180,0"
  invite-chair.2: "kkaegul_invite,-63.5,66.0,-36.5,180,0"
  invite-chair.3: "kkaegul_invite,-58.5,66.0,-36.5,180,0"
  invite-chair.4: "kkaegul_invite,-56.5,66.0,-36.5,180,0"
