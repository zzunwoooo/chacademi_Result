plugins { id 'java' }

group = 'school.chacademia'
version = '0.2.0-commands.1-nova.1'
base { archivesName = 'chacademia-tornado' }

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly fileTree('lib') { include '*.jar' }
    compileOnly files('../magic-codex-paper/build/libs/magic-codex-bridge-0.13.0.jar')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}
