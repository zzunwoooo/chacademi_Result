# plugins/ChacaNPC/npc-models.yml — NPC 3D 외형 (ChacaNPC). 명령: /NPC관리 외형 …
# Citizens 번호는 서버마다 달라서 개별 NPC 지정(npcs)은 "서버ID:번호" 로 저장합니다.
server-id: school
# 클라이언트 npc-models/models.json 에 있는 모델 ID (자동완성·오타 검사용)
models:
- luka
- ria
- captain_bram
- teacher_ellna
- pipi
- dorm_lowell
- wizard_statue
# 캐릭터 ID 기준 기본값 — 그 캐릭터와 연결된 NPC를 다시 만들어도 따라갑니다
characters:
  luka:
    model: luka
    scale: 1.0
  st_lia:
    model: ria
    scale: 1.0
  captain_bram:
    model: captain_bram
    scale: 1.0
  teacher_ellna:
    model: teacher_ellna
    scale: 1.0
  pipi:
    model: pipi
    scale: 1.0
  dorm_lowell:
    model: dorm_lowell
    scale: 1.0
# Citizens NPC 하나만 따로 지정 (캐릭터 기본값보다 우선). model: none = 이 NPC만 원래 외형
npcs: {}
