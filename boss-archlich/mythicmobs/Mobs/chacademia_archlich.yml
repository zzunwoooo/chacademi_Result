# 무덤의 대현자 모르바스 (보스) + 망자 병사 (소환 잡몹) — MythicMobs 5 + ModelEngine 4
# 모델: ca_archlich (1페이즈), ca_archlich_p2 (2페이즈), ca_archlich_thrall (병사)  → ModelEngine blueprints 폴더에 넣고 /meg reload
# 스킬: Skills/chacademi_archlich_skills.yml
# 2026-10-29 등록본: 리치의 지하 연구실(ChacaDungeon) 보스 단계에서 소환 (/던전관리 보스 lich CA_Boss_Archlich)

CA_Boss_Archlich:
  Type: ZOMBIE
  Display: '&5&l무덤의 대현자 &d모르바스'
  Health: 4000         # 2026-10-29 오너: 1800 → 4000 (평균 스펙에 비해 짧음). 바꾸면 아래 2페이즈 조건(절반)도 같이
  Damage: 0            # 피해는 전부 스킬(chatelegraph)로. 기본 근접공격은 이동용으로만 둠
  Armor: 12
  BossBar:
    Enabled: true
    Title: '&5무덤의 대현자 모르바스'
    Range: 48
    Color: PURPLE
    Style: SEGMENTED_10
    CreateFog: true
    DarkenSky: true
  Faction: archlich
  Options:
    MovementSpeed: 0.2
    FollowRange: 40
    KnockbackResistance: 1
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    Silent: true
    Despawn: false
    Collidable: true
    MaxCombatDistance: 40
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - clear
  - float
  - meleeattack
  - randomstroll
  AITargetSelectors:
  - clear
  - players
  - attacker
  Equipment: []
  Variables:
    phase: 1
    busy: 0
  Skills:
  # --- 모델 ---
  - model{mid=ca_archlich;hb=true;n=false} @self ~onSpawn
  - state{s=spawn;li=0;lo=3} @self ~onSpawn
  - skill{s=CHA_ARCHLICH_SPAWN_LOCK} @self ~onSpawn
  # --- 2페이즈 전환 (HP 50% 이하, 한 번만) ---
  # health 조건은 절대값: Health 를 바꾸면 이 값(절반)도 같이 바꾼다
  - skill{s=CHA_ARCHLICH_PHASE2} @self ~onDamaged ?health{h=<2000} ?variableequals{var=caster.phase;value=1}
  # --- 스킬 선택: 2초마다, 시전 중이 아니면 ---
  - skill{s=CHA_ARCHLICH_AI} @target ~onTimer:40 ?variableequals{var=caster.busy;value=0} ?targetwithin{d=30}
  # --- 사망 ---
  - skill{s=CHA_ARCHLICH_DEATH} @self ~onDeath
  Drops: []

CA_Mob_ArchlichThrall:
  Type: ZOMBIE
  Display: '&7망자 병사'
  Health: 60
  Damage: 0            # 피해는 CHA_ARCHLICH_THRALL_SLASH 에서 (0.45초 베기에 맞춤)
  Armor: 4
  Faction: archlich
  Options:
    MovementSpeed: 0.24
    FollowRange: 24
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    Silent: true
    Despawn: true
  AIGoalSelectors:
  - clear
  - float
  - meleeattack
  - randomstroll
  AITargetSelectors:
  - clear
  - players
  Skills:
  - model{mid=ca_archlich_thrall;hb=true;n=false} @self ~onSpawn
  - state{s=spawn;li=0;lo=3} @self ~onSpawn
  - skill{s=CHA_ARCHLICH_THRALL_SPAWN_LOCK} @self ~onSpawn
  # 근접 공격은 기본 공격 대신 스킬로 (애니 0.45초 베기에 판정을 맞춤)
  - skill{s=CHA_ARCHLICH_THRALL_SLASH} @target ~onTimer:30 ?targetwithin{d=2.4}
  - state{s=death;li=0;lo=0} @self ~onDeath
  Drops: []
