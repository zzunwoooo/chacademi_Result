# 빗자루 비행 설정 (비행 마법에서 사용)
# 수치를 바꾼 뒤 /서버관리 새로고침 빗자루 → 다음 탑승부터 적용됩니다.
#
# 빗자루가 있는 플레이어(/유저관리 <닉네임> 빗자루 주기 로 지급)는 시간 제한 없이 날고,
# 없는 플레이어는 practice-broom 으로 비행 마법의 지속 시간(기본 10초)만큼 납니다.

# 파일 형식 버전. 플러그인이 이보다 오래된 파일을 찾으면 brooms.yml.v1.bak 으로 옮기고 새 기본 파일을 씁니다.
config-version: 2

practice-broom: broom_1

# 숙련도 100% 까지 필요한 누적 비행 시간(시간). 숙련도가 낮을수록 균형이 쉽게 깨져서 잘 떨어집니다.
mastery-full-hours: 3

# 스페이스 상승 힘 (모든 빗자루 공통, 능력치 아님). 위를 보며 W 와 같이 누르면 더 빨리 오릅니다.
climb-power: 0.055

boost-cooldown-ticks: 120   # 부스트(달리기 키) 재사용 대기 (20틱 = 1초)
roll-cooldown-ticks: 60     # 배럴롤(A/D 두 번) 재사용 대기
catch-window-ticks: 40      # 떨어진 뒤 공중에서 빗자루를 다시 잡을 수 있는 시간

# 빗자루를 탈 수 없는 월드 이름
blocked-worlds: []

debug: false

# 각 항목 (2026-10-16 기획 확정: 30종, 등급 순서 broom_1~30. 수치는 1~10단계에서 계산한 값 그대로 — 등급 배수 없음)
#   name         표시 이름
#   grade        등급 (일반 / 희귀 / 유일 / 전설)
#   levels       기획 단계 [최고속도, 가속, 선회, 제동, 안정성] (참고용. 실제로 쓰는 값은 아래 수치)
#   max-speed    최고 속도 (블록/틱). 1단계 0.545(=크리에이티브 비행 10.9 b/s) ~ 10단계 1.65(33 b/s). 부스트 ×1.45
#   accel        W 를 누를 때 틱마다 붙는 속도. 0.025 + 0.005×(단계-1)
#   turn         느릴 때 틱마다 돌 수 있는 각도(도). 6 + 단계. 최고 속도에서는 60% 로 줄어듦. 위아래(시선 보고 W)에도 같은 값 적용
#   brake        S 를 누를 때 틱마다 줄어드는 속도 비율. 0.025 + 0.005×(단계-1)
#   stability    균형 게이지가 깎이는 양을 나누는 값. 0.6 + 1.2×(단계-1)/9. 최대 균형 = 90 + 3×단계
#   description  획득권 아이템 설명 (플러그인은 아직 쓰지 않음)
# 오르내림: 스페이스 = 상승(공통 climb-power), 위를 보고 W = 상승(둘 다 하면 더 빠름), 아래를 보고 W = 하강, 앉기 키 = 하강, 비행 마법 키 = 하차.
#
# 모델은 모드의 assets/chacademy_motion/brooms/<ID>.bbmodel 입니다.
# ItemsAdder 리소스팩에 같은 경로로 넣으면 모드를 다시 배포하지 않고 모델을 바꾸거나 새 빗자루를 추가할 수 있습니다.
