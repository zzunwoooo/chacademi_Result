# ChacaDungeon 전체 설정. 던전마다의 설정은 dungeons.yml (인게임 /던전관리 명령으로 대부분 채운다).
# 고친 뒤 /서버관리 새로고침 던전입장

# 입장 준비 안내(자리가 났을 때)에 응답할 시간. 지나면 다음 사람에게 넘기고 대기 등록이 취소된다.
offer-seconds: 60
# 대기 중 접속을 끊으면 대기 등록을 취소한다 (false = 유지).
cancel-queue-on-quit: true
# 포탈 반경 안에 들어왔다고 볼 때 / 다시 열 수 있게 되는 거리 배수 (반경 × 이 값보다 멀어지면 다시 다가갔을 때 열림).
portal-rearm-factor: 1.6

# 도전 시작 판정: 도착한 뒤 이만큼 움직이면 시작 (블록). 움직이지 않아도 아래 초가 지나면 시작.
start-move-distance: 0.6
start-fallback-seconds: 10

# 기록 저장 DB. MagicCodexBridge 의 공용 MariaDB 설정 파일을 그대로 읽는다 (없거나 sqlite 면 이 폴더의 records.db).
database-file: ../MagicCodexBridge/player-state-database.properties
# 칭호 이름·색 (MagicCodexBridge titles.yml)
titles-file: ../MagicCodexBridge/titles.yml

# [기능:파티던전 시작]
# 마지막 보스를 잡은 뒤 출구 포탈이 열려 있는 시간 (초). 지나면 남은 사람을 모두 내보낸다.
exit-seconds: 30
# 출구 포탈 반경 (블록). 칸마다 지점 이름 "출구" 를 찍어 두면 그 자리, 없으면 보스가 쓰러진 자리.
exit-radius: 1.5
# 던전 칸 구역 밖에 이만큼 (초) 있으면 판에서 빠진다 (1인 = 실패, 파티 = 그 사람만 마을로).
leave-grace-seconds: 5
# 파티 입장 수락 시간 (초).
accept-seconds: 10
# 던전 보스가 이로치("<보스 미몹>_shiny", 있을 때만)로 나올 확률 (0.01 = 1%).
boss-shiny-chance: 0.01
# [기능:파티던전 끝]
