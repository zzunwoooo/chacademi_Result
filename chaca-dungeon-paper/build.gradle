plugins { id 'java' }
group = 'school.chacademia'
version = '0.5.0-difficulty-20261109'
base { archivesName = 'chaca-dungeon' }
repositories {
    if (findProperty('localDependencyRepo')) maven { url = uri(property('localDependencyRepo')) }
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
// MythicMobs: ?쒕쾭???덈뒗 jar 濡?而댄뙆?쇰쭔 (媛숈씠 ?ｌ? ?딆쓬). ?ㅻⅨ 寃쎈줈硫?-PmythicJar=... 濡?諛붽씔??
def mythicJar = findProperty('mythicJar') ?: 'C:/Chacademi/network/wild1/plugins/MythicMobs-5.9.0.jar'
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly files(mythicJar)
    // MagicCodexBridge(蹂댁긽 ?꾨떖쨌?됰꽕?꽷룸챸???덈툕)쨌ChacaGimmick쨌ItemsAdder ??由ы뵆?됱뀡?쇰줈留?遺瑜몃떎 (諛고룷 jar 媛 ?뚯뒪? ?щ씪???덉쟾).
    // ?쒕씪?대쾭留?(?몃┛ jna쨌waffle쨌slf4j ???ｌ? ?딅뒗?? ?쒕쾭 履쎄낵 寃뱀묠)
    implementation('org.mariadb.jdbc:mariadb-java-client:3.5.1') { transitive = false }
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.main.java.srcDir '../chaca-dungeon-protocol/src/main/java'
sourceSets.main.java.srcDir '../magic-codex-database/src/main/java'
jar {
    from { configurations.runtimeClasspath.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
test { useJUnitPlatform() }
processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}
