plugins {
    id 'fabric-loom' version '1.10.5'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = 'kkaegul-ui' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

// 게임 없이 화면 미리보기 PNG: ./gradlew preview  → build/preview/*.png
tasks.register('preview', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.kkaegul.client.preview.PreviewMain'
    args 'src/main/resources/assets/kkaegul', "${buildDir}/preview"
    systemProperty 'java.awt.headless', 'true'
}
