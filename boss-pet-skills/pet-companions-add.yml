# [기능:boss-pet-skills] pet-companions.yml 에 넣을 것 (5대 전부, 2026-10-31). 학교·야생·아레나 파일에 아래 1~3을 반영한 뒤 /펫 새로고침.

# 1) 맨 위(pets: 위)에 새 칸: MCPets 보스펫(바닐라 4종 + 이로치) → 스킬. 이 펫을 꺼낸 사람은 전투 중 40초마다 스킬을 쓴다.
mcpets-skills:
  chacademia_elder_guardian: [CHA_PET_boss_elder_guardian]
  chacademia_elder_guardian_shiny: [CHA_PET_boss_elder_guardian]
  chacademia_ender_dragon: [CHA_PET_boss_ender_dragon]
  chacademia_ender_dragon_shiny: [CHA_PET_boss_ender_dragon]
  chacademia_wither: [CHA_PET_boss_wither]
  chacademia_wither_shiny: [CHA_PET_boss_wither]
  chacademia_warden: [CHA_PET_boss_warden]
  chacademia_warden_shiny: [CHA_PET_boss_warden]

