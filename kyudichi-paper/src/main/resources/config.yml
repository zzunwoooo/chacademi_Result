# 큐디치 규칙. 숫자는 전부 여기서 조정합니다. /서버관리 새로고침 큐디치 (진행 중인 경기는 끝난 뒤 적용)
# 시간은 초, 거리는 블록, 속도는 블록/초.
# 참고: 빗자루 최고 속도는 초당 16~25블록 (부스트 1.45배).
config-version: 4            # 2 = 2026-10-17 공 속도·중력, 3 = 2026-10-19 공 크기 2배·F 범위, 4 = 2026-10-20 공 크기 1.4·블러저 범위·퀘이플 비행 (예전 파일은 서버가 켜질 때 이 값들로 바꿈)

season:
  length-days: 7             # 시즌 길이 (큐디치·1:1 각각). 끝나면 그 모드의 레이팅·전적을 완전 초기화하고 다음 시즌 자동 시작.
                             # 첫 시즌은 /큐디치관리 시즌 시작 <큐디치|결투> 로 시작 (그 전에는 시즌 없음)

duel:                        # 1:1 결투장
  wins: 2                    # 이 판 수를 먼저 이기면 승리 (3판 2선승)
  round-seconds: 180         # 라운드 제한 시간. 끝나면 남은 체력 % 높은 쪽이 이기고, 같으면 둘 다 1점
  prepare-seconds: 30        # 마법 세팅 시간
  round-pause-seconds: 3     # 라운드 끝나고 다음 라운드 카운트다운 전까지
  banned-spells: []          # flight(비행)은 항상 금지

match:
  prepare-seconds: 60        # 준비(마법 세팅) 시간
  countdown-seconds: 3       # 시작·골인 후 재개 카운트다운
  goal-pause-seconds: 2      # 골인 연출 후 위치 복귀까지
  play-seconds: 600          # 본 경기 10분
  overtime-seconds: 180      # 골든골 연장 최대 3분
  snitch-at-seconds: 300     # 스니치 등장 (멈춘 시간 제외한 실제 경기 시간)
  respawn-seconds: 5         # 사망 후 부활까지
  respawn-invulnerable-seconds: 2
  game-mode: ADVENTURE       # 경기 중 게임모드 (ADVENTURE 권장: 블록 파괴 불가)

score:
  goal: 10
  kill: 3
  snitch: 100
  kill-credit-seconds: 10    # 마지막으로 피해를 준 적이 이 시간 안이면 처치 인정

key:                         # 큐디치 키(F) 공통
  range: 5.0                 # 퀘이플 잡기·블러저 쳐내기 범위 (스니치는 snitch.catch-range)
  cooldown-seconds: 1.0

quaffle:
  drift-speed: 12.0          # 놓친·자유 퀘이플이 블러저처럼 떠다니는 속도
  throw-speed: 44.0          # 에임(조준점) 방향으로 던짐
  gravity: 16.0              # (안 씀: 2026-10-20 던진 퀘이플은 직선, 놓친 퀘이플은 떠다님)
  flight-seconds: 3.0        # 던진 뒤 이 시간 동안 직선으로 날아감 + 패스(팀원 몸에 닿으면 받기)
  hold-seconds: 10           # 10초 룰
  auto-catch-radius: 1.5     # 팀원 패스 자동 받기 (몸에 닿을 때)
  rethrow-block-seconds: 0.5 # 던진 사람은 이 시간 동안 다시 못 잡음
  drop-pop-speed: 6.0        # 놓쳤을 때 튕겨 나가는 속도

bludger:
  count: 2
  wander-speed: 16.0
  chase-speed: 30.0          # (안 씀: 2026-10-20 돌진 방식 — 아래 approach/dash)
  # 2026-10-20 돌진: 노린 사람에게 approach-speed 로 다가가다 dash-range 안이면 windup 동안 멈칫(예고) →
  # dash-speed 로 그 사람이 갈 곳을 향해 일직선 돌진, 부딪혀도 멈추지 않고 dash-overshoot 블록 더 날아간 뒤 dash-recover 동안 쉼
  approach-speed: 18.0
  dash-speed: 44.0           # 빗자루보다 빠름: 쳐내기(F)·배럴롤·옆으로 비켜서 피함
  dash-range: 14
  windup-seconds: 0.4
  dash-overshoot: 10
  dash-recover-seconds: 1.2
  steer: 6.0                 # 방향을 바꾸는 빠르기 (클수록 급회전)
  hit-radius: 1.0            # 블러저에 맞는 거리 (2026-10-20 1.5 → 1.0)
  damage-percent: 25         # 최대 체력의 %, 모든 피해 감소 무시
  knockback: 1.2
  ignore-after-hit-seconds: 1.2
  idle-target-radius: 40     # 공 든 사람이 없을 때 노리는 범위 (한 번 노린 사람은 끝까지 쫓아감)
  second-delay-seconds: 0.5  # 두 번째 블러저가 같은 사람을 노릴 때 늦게 출발
  deflect-speed: 42.0        # 쳐낸 블러저 속도 (에임 방향)
  deflect-seconds: 1.5
  after-deflect-rest-seconds: 2.0  # 쳐낸 블러저는 날아간 뒤 이 시간 동안 아무도 쫓지 않음

snitch:                      # 위치 표시 없음 · 빛나지 않음
  speed: 30.0                # 순간 돌진은 이 속도의 1.25배
  flee-radius: 26
  catch-range: 1.6
  pause-every-seconds: [10, 18]
  pause-seconds: 0.6         # 잠깐 멈추는 시간 (잡을 기회)

shrine:
  pickup-radius: 1.6
  respawn-seconds: 20
  scale: 0.75                # 성소 이펙트 크기 (2026-10-20 1.0 → 0.75)
  health-percent: 50
  mana-percent: 50
  vfx:                       # PortableVFX 팩 (ShrineHealth 등, PC 차카데미 vfx_Claude 폴더)
    health: shrinehealth
    mana: shrinemana
    stability: shrinestability
    haste: shrinehaste

rating:
  start: 1000
  k: 60
  min-change: 5
  contribution-min: 0.8      # 이겼을 때 기여 배율 범위 (졌을 때는 1.2 → 0.7)
  contribution-max: 1.3
  loss-max: 1.2
  loss-min: 0.7
  leaver-multiplier: 1.2
  tiers:                     # 이 점수 이상
    silver: 900
    gold: 1100
    platinum: 1300
    diamond: 1500
    master: 1700

mvp:                         # MVP 점수 (레이팅 기여 보정에도 사용)
  goal: 10
  kill: 3
  snitch: 30
  assist: 1
  carrier-stop-bonus: 2
  pass: 1
  save-goal: 3
  save-bludger: 2
  deflect-hit: 2
  heal-per: 10               # 파티원 회복 10당 1점
  damage-per: 20             # 적 피해 20당 1점
  save-goal-radius: 8

# 스니치·블러저·떠다니는 퀘이플이 경기장 벽에서 떨어져 다니는 거리 (던지거나 쳐낸 공은 예외). y 는 바닥·천장
ball-edge-margin: 8
ball-edge-margin-y: 3

# 큐디치에서 쓸 수 없는 마법 (준비 화면에서 회색, 경기 중 시전 막힘)
banned-spells: []
# 큐디치에서 막는 아티팩트 (현재는 순간이동형만 서버에서 막을 수 있음: 아래 teleport-guard)
banned-artifacts: [rewind_hourglass]
teleport-guard: true          # 경기 중 다른 플러그인의 순간이동(되감기 모래시계, 귀환 등) 차단. 경기장 안으로의 짧은 순간이동(빗자루 순간이동 마법 등)은 허용

models:                       # ModelEngine 모델 id (plugins/ModelEngine/blueprints/kyudichi 에 자동 설치)
  quaffle: kyudichi_quaffle
  bludger: kyudichi_bludger
  snitch: kyudichi_snitch
  scale: 1.4                  # 공 크기 (2026-10-19 2배 → 2026-10-20 1.4)
fallback-items:               # ModelEngine이 없을 때 보이는 아이템
  quaffle: ORANGE_CONCRETE_POWDER
  bludger: BLACKSTONE
  snitch: GOLD_BLOCK
