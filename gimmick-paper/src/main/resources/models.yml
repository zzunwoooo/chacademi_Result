# 기믹 모델 목록 (dungeon-gimmicks 37종, 2026-10-20 폐기 26종 제외). 렌더러 모델 id = prefix + 이 키
# kind: 장치 종류 (플러그인 동작), footprint: [가로, 깊이] 칸 (가로 = 모델 오른쪽 방향, 깊이 = 정면 방향)
# collision: solid = 차지한 칸을 배리어로 막음 (높이 = 모델 높이 올림), floor = 막지 않음 (바닥 위에 얇게 놓이는 장치),
#            platform = 한 층만 배리어 (모델 윗면이 칸 윗면에 맞도록 올려 놓음, 그 위를 밟고 다님), none = 막지 않음
# open: on = 퍼즐 노드가 켜지면 막힘 해제 (문·수문·얼음 봉인), off = 꺼져 있을 때 해제 (빛의 다리: 켜져야 밟힘)
# ports: 마력 도관 연결 방향 (front = 모델 정면, back, left, right). 실서버에서 코너/분기 방향이 반대로 보이면 left/right 를 바꾼다
