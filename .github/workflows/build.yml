name: ssangyong-launcher build

on:
  push:
    branches: [ 'claude/ssangyong-launcher' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install
        run: npm ci
        shell: bash

      - name: Build (Windows installer)
        run: npx electron-builder build -w --publish never
        shell: bash

      - name: List
        run: ls -la dist
        shell: bash

      - name: Verify packaged app
        shell: bash
        run: |
          npx --yes @electron/asar extract dist/win-unpacked/resources/app.asar /tmp/app
          grep -n "REMOTE_DISTRO_URL =" /tmp/app/app/assets/js/distromanager.js
          grep -n "ssangyong" /tmp/app/app/assets/js/configmanager.js
          grep -n "title =" /tmp/app/app/assets/lang/_custom.toml
          grep -n "update-not-available" /tmp/app/index.js | head -3
          ls dist/win-unpacked/resources

      - uses: actions/upload-artifact@v4
        with:
          name: ssangyong-launcher-setup
          path: dist/*.exe
          retention-days: 30

      # 100MB 넘는 파일은 git 에 못 올려서 90MB 조각으로 나눠 build 브랜치에 올림 (받는 쪽에서 이어 붙임)
      - name: Push to build branch
        shell: bash
        run: |
          mkdir out && cd out
          exe=$(ls ../dist/*.exe | head -1)
          split -b 90m -d "$exe" "$(basename "$exe").part"
          sha256sum "$exe" | awk '{print $1}' > SHA256.txt
          ls -la
          git init -q && git checkout -q -b claude/ssangyong-launcher-build
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" claude/ssangyong-launcher-build
