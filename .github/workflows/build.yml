name: kkaegul-launcher build

on:
  push:
    branches: [ 'claude/kkaegul-launcher' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install
        run: npm ci
        shell: bash

      - name: Build (Windows installer)
        run: npx electron-builder build -w --publish never
        shell: bash

      - name: List
        run: ls -la dist
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: kkaegul-launcher-setup
          path: dist/*.exe
          retention-days: 30
