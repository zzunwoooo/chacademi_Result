name: kkaegul-ui build
on:
  push:
    paths: ['kkaegul-ui-fabric/**', '.github/workflows/kkaegul-ui.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kkaegul-ui-fabric } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: chmod +x gradlew && ./gradlew build preview --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kkaegul-ui
          path: |
            kkaegul-ui-fabric/build/libs/*.jar
            kkaegul-ui-fabric/build/preview/*.png
