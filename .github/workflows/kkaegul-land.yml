name: kkaegul-land build
on:
  push:
    branches: ['claude/kkaegul-land']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12.1' }
      - name: core plugin
        working-directory: kkaegul-core
        run: gradle build --no-daemon --stacktrace
      - name: ui mod
        working-directory: kkaegul-ui-fabric
        run: gradle build --no-daemon --stacktrace
      # 결과 jar 를 claude/kkaegul-land-build 브랜치에 올림
      - name: publish build branch
        run: |
          mkdir -p /tmp/out && cp kkaegul-core/build/libs/*.jar kkaegul-ui-fabric/build/libs/*.jar /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b claude/kkaegul-land-build
          git config user.name "kkaegul-ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" claude/kkaegul-land-build
