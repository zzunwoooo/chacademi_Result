plugins {
    id 'fabric-loom' version '1.10.5'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = 'magic-codex-ui' }

repositories { mavenCentral() }
sourceSets.main.java.srcDir '../magic-codex-protocol/src/main/java'
sourceSets.main.java.srcDir '../chaca-npc-protocol/src/main/java'
sourceSets.main.java.srcDir '../chaca-portrait-protocol/src/main/java'

dependencies {
    implementation 'org.yaml:snakeyaml:2.2'
    include 'org.yaml:snakeyaml:2.2'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
test { useJUnitPlatform() }

// Optional in-engine visual check; its entrypoint is never packaged in the mod.
if (project.hasProperty('visualCheck')) {
    apply from: 'visual-check.gradle'
}
