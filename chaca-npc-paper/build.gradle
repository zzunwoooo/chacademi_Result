plugins { id 'java' }
group = 'kr.chacademy'
version = '0.3.0-npcmodel.3-nova.1'
base { archivesName = 'chaca-npc' }
// school 서버 Citizens 실제 버전에 맞춰 -PcitizensVersion=... 로 바꿀 수 있음 (컴파일 기준값일 뿐 설치 버전이 아님)
def citizensVersion = findProperty('citizensVersion') ?: '2.0.37-SNAPSHOT'
repositories {
    if (findProperty('localDependencyRepo')) maven { url = uri(property('localDependencyRepo')) }
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.citizensnpcs.co/repo' }
}
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly("net.citizensnpcs:citizens-main:${citizensVersion}") { exclude group: '*', module: '*' }
    implementation files('../magic-codex-database/lib/mariadb-java-client-3.5.10.jar')
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// AI 대화 패킷 계약(Fabric UI와 공유)과 공통 DB 설정. MagicCodex 서비스 API 클래스는 포함하지 않는다 (리플렉션 호출).
sourceSets.main.java.srcDir '../chaca-npc-protocol/src/main/java'
sourceSets.main.java.srcDir '../magic-codex-database/src/main/java'
sourceSets.test.java.srcDir '../chaca-npc-protocol/src/test/java'
// NPC 3D 외형 패킷 계약 (클라이언트 모드 chacademi-npc-model 과 공유)
sourceSets.main.java.srcDir '../chaca-npc-model-protocol/src/main/java'
sourceSets.test.java.srcDir '../chaca-npc-model-protocol/src/test/java'
jar {
    from { zipTree('../magic-codex-database/lib/mariadb-java-client-3.5.10.jar') }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
test { useJUnitPlatform() }
processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}

dependencies { testRuntimeOnly files('../libraries/org/xerial/sqlite-jdbc/3.47.2.0/sqlite-jdbc-3.47.2.0.jar') }
