# 필터 목록. 띄어쓰기·기호를 무시하고 "포함"으로 검사합니다. (/서버관리 새로고침 NPC 로 적용)

# 플레이어 입력과 NPC 대사 모두에서 막을 단어 (욕설·혐오 표현 등 — 서버에 맞게 채워 주세요)
banned-words:
  - 시발
  - 씨발
  - 병신
  - 좆
  - 니애미
  - 섹스

# 탈옥(규칙 깨기) 시도 표현 → AI를 부르지 않고 'confused' 고정 대사, 장난 누적
# (일상 대화를 막지 않도록 "잊고", "무시해"처럼 흔한 말은 넣지 말고 정규식으로 잡으세요)
jailbreak-phrases:
  - 프롬프트
  - 이전지시
  - 지시사항
  - 시스템메시지
  - 너ai
  - ai지
  - 너인공지능
  - 챗gpt
  - 역할극그만
  - 롤플레이그만
  - 캐릭터연기그만
  - 설정무시
  - 규칙무시
  - 개발자모드
  - jailbreak
  - ignoreprevious
  - ignoreall
  - systemprompt

# 정규식 (고급). 대소문자 무시
jailbreak-regex:
  - "(지금까지|여태|앞|위|이전).{0,10}(명령|지시|설정|규칙|대화|프롬|내용).{0,8}(무시|잊)"
  - "(무시|잊).{0,6}(하고|고).{0,20}(레시피|만드는\\s*법|코드|숙제|과제)"
  - "you\\s+are\\s+now"
  - "ignore\\s+(all|previous|the)"

# NPC 대사에 나오면 안 되는 말 (나오면 그 대사를 버리고 고정 대사)
meta-words:
  - 프롬프트
  - 언어모델
  - 인공지능
  - 챗봇
  - 시스템메시지
  - 지시사항
  - 롤플레이
  - 역할극
  - 마인크래프트
  - 마크서버

# NPC끼리 잡담(근처 모든 플레이어에게 보임)과, 저장돼서 프롬프트에 다시 들어가는 글(메모·약속·분위기 노트)에
# 추가로 막을 단어. 위 목록들(banned-words·jailbreak·meta-words·romance-banned)도 함께 적용됩니다.
# 걸리면 그 잡담/메모만 버립니다 (대화 자체는 그대로). 서버에 맞게 더 채워 주세요.
# 이 항목을 통째로 지우면 플러그인에 들어 있는 기본 목록을 씁니다.
