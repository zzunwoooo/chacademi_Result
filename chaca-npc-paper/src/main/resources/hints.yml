# 마법 힌트 목록. NPC 캐릭터 파일의 hint_topics 에 topic 이 맞는 힌트만 그 NPC가 줍니다.
# difficulty: 1 = 꽤 구체적 / 2 = 적당히 돌려서 / 3 = 아주 막연하게
# 호감도가 높을수록 구체적인 힌트(낮은 difficulty)까지 허락됩니다.
# 같은 힌트는 플레이어당 한 번만, 하루 최대 hints.daily-per-player 개.
# (서버가 힌트를 대화에 넣어 주고 그 대사가 플레이어에게 나가면 1개로 셉니다 — AI가 표시하지 않아도 셉니다.)
# vague (선택): 호감도가 낮을 때(모르는 사이·아는 사이)는 materials 를 AI에게 주지 않고 이 막연한 문장만 줍니다.
#   재료·장소·방법이 드러나지 않게 적어 주세요. 없으면 "어딘가에 숨은 마법이 있다는 소문" 정도의 기본 문장을 씁니다.
hints:
  moon_water:
    spell: moonlight_bolt
    topic: light
    materials: "보름달, 호숫가, 밤에 물에 비친 달"
    vague: "밤에만 볼 수 있는 빛의 마법이 있다는 소문"
    difficulty: 3
  morning_dew:
    spell: dawn_shield
    topic: light
    materials: "새벽, 이슬, 해가 뜨기 직전의 정원"
    difficulty: 2
  rain_song:
    spell: water_veil
    topic: water
    materials: "비 오는 날, 분수대, 노래"
    difficulty: 2
