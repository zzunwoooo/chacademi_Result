# 차카데미 스토리 플러그인 설정

# ---------------------------------------------------------------- 모드
# 스토리 모드가 없는 유저에게 재생 명령이 왔을 때 보낼 메시지 (비우면 안 보냄)
# 접속 직후에는 모드 채널이 늦게 잡히므로, 접속 뒤 15초까지 기다린 다음에만 "모드 없음" 으로 본다.
missing-mod-message: "&7(차카데미 스토리 모드가 없어서 스토리를 볼 수 없습니다. 모드를 설치한 뒤 다시 접속해 주세요)"
# 스토리 모드가 예전 버전일 때 (프로토콜이 맞지 않으면 아무것도 보내지 않고 이 메시지만 보낸다)
outdated-mod-message: "&c차카데미 스토리 모드가 오래된 버전입니다. 모드를 업데이트해 주세요."

# 모드가 없는 (또는 오래된) 유저도 끝난 것으로 쳐서 다음 명령을 실행할지
#   false (기본): 스토리가 넘어가지 않는다. 모드를 넣고 다시 접속하면 그 스토리부터 이어진다.
#   true : 보지 않고도 on-finish / end 명령과 "끝 호감도" 를 받는다. 모드 채널은 클라가 정하는 것이라,
#          끝 명령이 보상을 주거나 퀘스트를 넘기는 서버에서는 켜지 말 것 (모드를 빼고 들어오면 전부 건너뛸 수 있음).
finish-if-missing-mod: false

# 클라에 스토리 파일이 없거나 깨져서 보여 줄 수 없다고 알려 왔을 때
#   false (기본): 끝난 것으로 치지 않는다 (콘솔 경고 + 아래 메시지). 파일을 맞추고 다시 접속하면 이어진다.
#   true : 건너뛴 것으로 치고 다음 명령을 실행한다.
finish-if-client-content-missing: false
client-content-missing-message: "&c스토리 파일이 최신이 아닙니다. 스토리 파일을 업데이트한 뒤 다시 접속해 주세요."

# ---------------------------------------------------------------- 컷신
# 컷신이 끝나면 콘솔로 실행할 명령어. {player} {id} {skipped}   (재생 요청 한 번에 한 번만 실행)
# 접속이 끊기거나 화면이 중간에 닫히면 끝난 것이 아니다: 다시 보여 주고, 끝까지 본 다음에 실행한다.
on-finish: {}
# on-finish:
#   ch1_ashen_night:
#     - "대화관리 재생 {player} 대화 ch1_wakeup"     # 컷신이 끝나면 바로 대화로

# 탭 자동완성용 컷신 id (선택)
cutscenes:
  - magic_tutorial
  - ch1_harbor_arrival
  - ch1_ashen_night
  - ch1_chronicle
  - ch2_ashen_eyes

# 컷신별 최소 시청 시간(초). 이보다 빨리 "끝났다" 고 오면 인정하지 않고 다시 재생한다. 0 또는 없음 = 검사 안 함.
# 2배속 버튼이 있으므로 컷신 길이의 절반보다 조금 작게 적을 것. 이 값이 있는 컷신은 auto 모드에서도 건너뛰기 없이 재생된다
# (/대화관리 재생 <닉네임> 컷신 <id> 건너뛰기허용 으로 보낸 것은 검사하지 않는다).
min-seconds: {}
# min-seconds:
#   ch1_ashen_night: 7

# 컷신 화면이 중간에 닫혔을 때 (사망 화면, 다른 플러그인 GUI, 월드 이동 등) 다시 보내기까지 기다리는 시간과 횟수.
# 횟수를 넘으면 다음 접속 때 다시 재생한다.
cutscene-resend-delay-seconds: 3
cutscene-max-resends: 5

# ---------------------------------------------------------------- 대화
# 현재 기본 대화 재생(/대화관리 재생 <닉네임> 대화 <id>)은 클라이언트 파일·로컬 기록을 사용한다.
# 아래 그래프/서버 ledger 관련 설정은 보존된 구형 서버 흐름에만 적용된다.
# 최신 명령 절·보상 연결·리로드 설명: docs/handoff/CODEX_STORY_LOCAL_20261011.md
# 대화마다 서버 폴더 plugins/ChacademyStory/dialogues/<대화id>/ 에 편집기 zip 의 두 파일을 그대로 넣는다:
#   dialogue.yml          대화 흐름 (서버가 선택지·결말을 검증)
#   server_commands.yml   명령어·호감도
# (예전 위치 dialogues/<대화id>.yml 의 명령어 파일도 계속 읽는다.) 바꾼 뒤에는 /서버관리 새로고침 스토리.
# 명령어 안의 {player} 는 마인크래프트 닉네임, {nickname} 은 MagicCodex 한글 닉네임 (글자·숫자·_·- 만 남김).

# 서버에 dialogue.yml 이 없는 대화를 열지 말지
#   true (기본): 열지 않는다 (콘솔 경고 + 명령어를 친 사람에게 안내).
#   false: 예전처럼 검증 없이 연다 — 조작된 클라가 모든 선택지 보상과 원하는 결말을 가져갈 수 있다.
require-server-graph: true

# 이미 끝낸 대화를 다시 열라는 명령이 오면
#   false (기본): 열지 않는다 (명령어도 다시 실행하지 않음). 다시 보여 주기만 하려면 /테스트 스토리 대화 <id> [닉네임] (보상·명령 없음).
#   true : 다시 보여 준다. 어느 쪽이든 다시 보기는 명령어·호감도를 다시 주지 않는다.
# 대화별로 server_commands.yml 에 allow-replay: true/false 를 적으면 그 대화는 그 값을 따른다.
# 완료 기록 보기/지우기: /유저관리 <닉네임> 스토리기록 보기 [대화id], /유저관리 <닉네임> 스토리기록 초기화 <대화id|전체> 확인
allow-replay: false

# 대사 속 글자 바꾸기
#   {player}  = MagicCodex 한글 닉네임 (MagicCodexBridge 가 없으면 %user_nickname%, 그것도 없으면 마인크래프트 닉네임)
#   {account} = 마인크래프트 닉네임
#   아래 목록의 PlaceholderAPI 값도 대사에 그대로 쓸 수 있다 (예: "%chacademiatitle_full% 학생, 어서 와요")
#   대화를 열 때 서버가 계산해서 보내므로, 대사에 쓰고 싶은 것을 여기에 적어 둔다.
dialogue-placeholders:
  - "%user_nickname%"
  - "%user_account%"
  - "%chacademiatitle_full%"
  - "%chacademiatitle_prefix%"
  - "%chacademiatitle_suffix%"

# ---------------------------------------------------------------- 보는 동안 보호
# 컷신·대화를 보는 동안 (화면이 잠겨 있음) 피해를 받지 않고, 몹이 노리지 않고, 배고픔이 줄지 않고, 제자리에 고정된다.
protect-during-story: true
# 이 시간(초)이 지나면 끝 신호가 없어도 보호를 푼다 (0 = 제한 없음)
protect-max-seconds: 900

# ---------------------------------------------------------------- 호감도
# 호감도는 MagicCodexBridge 하나로만 저장한다 (ChacaNPC 와 같은 점수, 하트 단계 상한 적용).
#   스토리 대화로 바뀐 점수는 출처 "dialogue" 로 기록 (MagicCodex affinity.yml 의 daily-caps.dialogue).
#   대화를 열 때는 server_commands.yml 의 npcs 목록에 있는 NPC 점수만 보낸다 (편집기가 자동으로 적어 줌).
#   MagicCodexBridge 가 꺼져 있으면 스토리 호감도 변경은 적용되지 않고 콘솔에 경고만 남는다.
# (예전의 affinity-default / affinity-min / affinity-max 와 이 폴더의 affinity.yml 은 더 이상 쓰지 않는다. 지워도 된다.)
# 한 항목 한도: 선택지·장면 이벤트 ±20, 결말·끝 ±50 (넘는 값은 읽을 때 자르고 콘솔에 경고).
# 한 플레이어가 한 대화에서 얻을 수 있는 호감도 합 (오른 것만 셈, 모든 NPC 합). 0 = 제한 없음.
affinity-gain-cap-per-dialogue: 0
# 호감도가 바뀔 때마다 콘솔에 기록
affinity-log: false

# ---------------------------------------------------------------- 이어서 보기 / 기록
# 한 사람에게는 한 번에 하나만 재생된다. 보는 중에 온 컷신·대화는 순서대로 기다렸다가 재생된다.
# 재생 중·대기 중인 것, 대화에서 보고 있던 장면·대사 번호, 끝낸 대화와 이미 실행한 이벤트는 progress.yml 에 저장된다.
# 접속이 끊기거나 서버가 재시작돼도 다시 접속하면 이어진다 (컷신은 처음부터, 대화는 보던 대사부터).
# 이 파일들은 이 서버만의 것이다: 서버가 여러 대면 보상을 주는 스토리 명령은 한 서버에서만 실행되게 할 것.
# 관리자가 강제로 끝내려면: /대화관리 중지 <닉네임|모두>, 전부 취소는 /대화관리 대기열비우기 <닉네임|모두>

# 흐름에 맞지 않아 무시한 패킷을 콘솔에 하나씩 기록 (문제 찾을 때만)
story-debug: false

# ---------------------------------------------------------------- 스토리 진행 단계 (steps.yml)
# 이 서버의 이름. NPC클릭 호출은 "서버 이름 + Citizens 번호" 로 저장된다 (다른 서버의 같은 번호 NPC와 섞이지 않게).
# 진행 기록(quest-progress.yml)은 이 서버 로컬 파일이다 — 스토리 진행 기준 서버는 학교 서버 하나로 둔다.
# 2026-10-26 오너: 튜토리얼 맵은 school 서버 안 → quest-server-id: school 하나 (튜토리얼 서버 없음).
quest-server-id: school

# ---------------------------------------------------------------- 장(챕터) 공개 제한 (2026-10-25)
# 공개 전인 장의 단계는 어떤 호출로도 열리지 않는다 (포탈·NPC 클릭·자동·컷신·/유저관리 <닉네임> 스토리진행 다음,
# /대화관리 재생 의 그 장 대화·컷신). 그 장 첫 단계에 들어온 유저는 HUD 에 아래 안내만 보이고 멈춰 있다가, 장이 열리면 바로 이어진다.
# 장 번호 = 단계 ID 의 ch<번호>- (ch3-1 → 3장). 없으면 장 이름 앞의 "<번호>장". 장 표시 이름을 바꿔도 공개 상태는 그대로.
#   open-through   이 번호 이하의 장은 항상 공개 (기본 2 = 0장 튜토리얼·1장·2장)
#   chapters.<번호>.open      true = 공개 (운영 중에는 /대화관리 장공개 열기 <번호> 로 즉시 공개, 이 파일에 저장됨)
#   chapters.<번호>.open-at   "yyyy-MM-dd HH:mm" (한국 시간) 이 시각부터 자동 공개. 비우면 시각 없음 (오너 미정 — 1주차 중간 예정)
# 보기: /대화관리 장공개 목록 · 다시 잠그기: /대화관리 장공개 잠그기 <번호>
# 대기대화 (steps.yml 단계의 대기대화: — 조건을 못 채운 채 그 NPC 를 누르면 AI 대화 대신 짧은 고정 대화).
# 한 번 보여 준 뒤 이 시간(초) 안에 같은 NPC 를 다시 누르면 평소 대화(AI 대화창·상점 버튼)가 열린다. 0 = 매번 대기대화.
waiting-dialogue-cooldown-seconds: 60

chapter-release:
  # 오너 2026-10-26: 오픈 첫날은 1장까지만 → 2장부터 잠금. 둘째 날 /대화관리 장공개 열기 2 (또는 아래 open-at 에 둘째 날 시각)
  open-through: 1
  locked-title: "아직 열리지 않은 이야기입니다"
  locked-body: "다음 이야기가 공개되면 이어서 진행할 수 있어요."
  chapters:
    2:
      open: false
      open-at: ""
    3:
      open: false
      open-at: ""
