# 마법 발견 조건 (MagicDiscovery) — 2026-10-26 전체 정리 v2 (docs/plans/discovery-conditions-v2.md, 오너 결정)
# 300종 중 처음부터 아는 아공간 수조(fish_trap)를 뺀 299종이 모두 여기 있다. 표시 문구(condition-text)는 도감 문구(discovery.description)와 같다.
#   requirements 의 키 = 서버가 세는 값. trace.condition.<id> = 수업·책·스토리에서 "/유저관리 <닉네임> 마법조건 주기 <id>" 로만 채움 (manual-conditions.yml 에도 같은 마법이 있음).
#   learned.<원소>/learned.all = 그 원소(전체)에서 배운 마법 수 (MagicDiscovery 가 권한으로 셈, 2026-10-26 v2)
#   state.* = 상태 값 (친구 수·최대 마나 등).
# 서버의 plugins/MagicDiscovery/discoveries.yml 은 jar 를 바꿔도 덮어쓰지 않는다 → 이 파일로 직접 바꾼 뒤 /서버관리 새로고침 마법발견.
