# 깨굴이의 위험한 초대 : 운빨깨굴랜드 — 커스텀 아이템 (ItemsAdder)
# 아이템 id = item:<이름>. 기능은 KkaegulCore 플러그인이 이 id 로 인식해서 처리한다.
# 그림 17종 모두 확정 (교체 시 textures/item/<이름>.png 바꾸고 /iazip)
info:
  namespace: item

items:
  # ── 음식 ─────────────────────────────
  cola:
    display_name: "&c깨굴 콜라"
    lore:
      - "&7시원한 콜라 한 캔"
      - "&8먹으면 배고픔이 차요"
    resource:
      material: HONEY_BOTTLE
      generate: true
      textures:
        - item/cola.png
  kkaekkaero:
    display_name: "&6깨깨로"
    lore:
      - "&711월 11일 한정 과자"
      - "&8먹으면 배고픔이 차요"
    resource:
      material: COOKIE
      generate: true
      textures:
        - item/kkaekkaero.png

  # ── 티켓 ─────────────────────────────
  inven_save_ticket:
    display_name: "&e인벤세이브권"
    lore:
      - "&7죽을 때 1장 자동 사용"
      - "&7→ 아이템과 레벨을 지켜줘요"
    resource:
      material: PAPER
      generate: true
      textures:
        - item/inven_save_ticket.png
  teleport_ticket:
