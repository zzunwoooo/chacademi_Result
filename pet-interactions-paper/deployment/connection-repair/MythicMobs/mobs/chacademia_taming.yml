# Wild capture targets and separate cosmetic pet entities. No random spawns are added.
ChAcademiaWildWolf:
  Type: WOLF
  Display: '회색 늑대'
  Health: 20
  Damage: 3
  Options:
    Despawn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventRenaming: true
    PreventSunburn: true
  AIGoalSelectors:
  - clear
  - randomstroll
  - lookatplayers
  AITargetSelectors:
  - clear
ChAcademiaPetWolf:
  Type: WOLF
  Display: '회색 늑대'
  Health: 20
  Damage: 0
  Options:
    Despawn: false
    Invincible: true
    PreventOtherDrops: true
    PreventRenaming: true
    PreventSunburn: true
    PreventMobKillDrops: true
    Collidable: false
    Silent: true
  AIGoalSelectors:
  - clear
  - lookatplayers
  AITargetSelectors:
  - clear
  Skills:
  - addtag{t=chacademia_pet} @self ~onSpawn

